<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gestiune Buget - Arena Friends FC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --orange:#ff8c00; --green:#28a745; --dark:#f7ecd9; --card:#fff8ed; --accent:#3d5afe; --border:#dcc89a; }
        * { box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #3a2f1f; margin: 0; padding: 0; }
        
        .main-header { text-align: center; padding: 22px 20px 18px; border-bottom: 1px solid var(--border); background: #fffaf0; position: relative; }
        .main-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 4px; color: #3a2f1f; margin: 0; }
        .btn-back { position: absolute; left: 20px; top: 30px; background: #3a2f1f; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        
        .page { padding: 20px; max-width: 1000px; margin: 0 auto; }
        
        /* Widget Buget */
        .buget-banner { background: linear-gradient(135deg, #1a3a1a, #1a4a2a); color: #fff; padding: 24px; border-radius: 16px; text-align: center; margin-bottom: 24px; border: 1px solid #d3bd8c; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .buget-titlu { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 2px; color: var(--border); margin-bottom: 5px; }
        .buget-suma { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 1px; color: #fff; margin: 0; }
        .buget-detalii { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .buget-sub { font-size: 1rem; }
        .buget-sub span { display: block; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; }
        
        /* Formulare pe doua coloane */
        .grid-formulare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .grid-formulare { grid-template-columns: 1fr; } }
        
        .sectiune-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
        .sectiune-titlu { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.75rem; color: #7d6849; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 600; }
        .form-input { width: 100%; background: #fdf3df; border: 1px solid #d3bd8c; color: #3a2f1f; padding: 10px 12px; border-radius: 8px; font-family: 'Rajdhani', sans-serif; font-size: 1rem; outline: none; }
        .form-input:focus { border-color: var(--accent); }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-family: 'Rajdhani', sans-serif; font-size: 1rem; cursor: pointer; color: white; transition: all 0.15s; }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-incasare { background: var(--green); }
        .btn-cheltuiala { background: #c62828; }
        
        /* Istoric tranzactii */
        .tabel-tranzactii { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fffaf0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .tabel-tranzactii th { background: #3a2f1f; color: #fff; padding: 10px; text-align: left; font-size: 0.85rem; text-transform: uppercase; }
        .tabel-tranzactii td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .tip-incasare { color: var(--green); font-weight: bold; }
        .tip-cheltuiala { color: #c62828; font-weight: bold; }
        
        .btn-sterge { background: #e53935; color: white; padding: 4px 8px; font-size: 0.8rem; border-radius: 4px; border: none; width: auto; cursor: pointer; font-weight: 600; }
        .btn-sterge:hover { background: #b71c1c; }
        
        .loading-text { text-align: center; color: #7d6849; font-style: italic; padding: 10px; }
    </style>
</head>
<body>

    <div class="main-header">
        <a href="index.html" class="btn-back">← Înapoi</a>
        <h1>Buget Arena Friends FC</h1>
    </div>

    <div class="page">
        
        <div class="buget-banner">
            <div class="buget-titlu">Sold Total Buget</div>
            <div class="buget-suma" id="totalBuget">0.00 RON</div>
            <div class="buget-detalii">
                <div class="buget-sub">Total Încasat <span id="totalIncasat" style="color: #81c784;">0 RON</span></div>
                <div class="buget-sub">Total Cheltuit <span id="totalCheltuit" style="color: #e57373;">0 RON</span></div>
            </div>
        </div>

        <div class="grid-formulare">
            <div class="sectiune-card">
                <h2 class="sectiune-titlu" style="color: var(--green);">➕ Adaugă Încasare (Jucător)</h2>
                <div class="form-group">
                    <label>Selectează Jucătorul</label>
                    <select class="form-input" id="selectJucator">
                        <option value="">Se încarcă jucătorii...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Suma (RON)</label>
                    <input class="form-input" type="number" id="sumaIncasare" placeholder="ex: 50">
                </div>
                <div class="form-group">
                    <label>Detalii / Lună / Meci</label>
                    <input class="form-input" type="text" id="detaliiIncasare" placeholder="ex: Cotizație teren Iunie">
                </div>
                <button class="btn-incasare" onclick="adaugaIncasare()">💾 Salvează Încasarea</button>
            </div>

            <div class="sectiune-card">
                <h2 class="sectiune-titlu" style="color: #c62828;">➖ Înregistrează Cheltuială</h2>
                <div class="form-group">
                    <label>Descriere Cheltuială</label>
                    <input class="form-input" type="text" id="descriereCheltuiala" placeholder="ex: Chirie teren sferturi">
                </div>
                <div class="form-group">
                    <label>Suma Cheltuită (RON)</label>
                    <input class="form-input" type="number" id="sumaCheltuiala" placeholder="ex: 200">
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input class="form-input" type="date" id="dataCheltuiala">
                </div>
                <button class="btn-cheltuiala" onclick="adaugaCheltuiala()">💸 Salvează Cheltuiala</button>
            </div>
        </div>

        <div class="sectiune-card" style="grid-column: 1/-1;">
            <h2 class="sectiune-titlu">📋 Istoric Tranzacții Recente</h2>
            <div id="loadingTranzactii" class="loading-text">Se încarcă istoricul...</div>
            <table class="tabel-tranzactii" id="tabelTranzactii" style="display: none;">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Tip</th>
                        <th>Nume / Detalii</th>
                        <th>Sumă</th>
                        <th style="width: 80px; text-align: center;">Acțiuni</th>
                    </tr>
                </thead>
                <tbody id="listaTranzactii">
                    </tbody>
            </table>
        </div>

    </div>

    <script>
        // Setăm data de azi automat la cheltuieli
        document.getElementById('dataCheltuiala').valueAsDate = new Date();

        // --- CONFIGURARE COMPLETĂ SUPABASE ---
        const SUPABASE_URL = 'https://lfnumwbjikiyngdxsgrk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbnVtd2JqaWtpeW5nZHhzZ3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MDQ1MzEsImV4cCI6MjA5MDA4MDUzMX0.BrrmEHnOwa66hDqN-GhYCyqHqOqTAV7dswjcOVxx-wc';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let Jucatori = [];

        // Inițializare pagină
        async function init() {
            await incarcaJucatori();
            await recalculeazaBuget();
        }

        // Încarcă lista de jucători în Dropdown
        async function incarcaJucatori() {
            try {
                const { data, error } = await sb.from('players').select('id, name').order('name', { ascending: true });
                if (error) throw error;
                
                Jucatori = data || [];
                const select = document.getElementById('selectJucator');
                select.innerHTML = '<option value="">-- Alege Jucător --</option>';
                
                Jucatori.forEach(j => {
                    select.innerHTML += `<option value="${j.id}">${j.name}</option>`;
                });
            } catch (e) {
                alert("Eroare la încărcarea jucătorilor: " + e.message);
            }
        }

        // Calculează totalurile și generează tabelul de activitate generală
        async function recalculeazaBuget() {
            try {
                // 1. Preluăm încasările
                const { data: incasari, error: errI } = await sb.from('incasari').select('id, suma, data, detalii, players(name)');
                if (errI) throw errI;

                // 2. Preluăm cheltuielile
                const { data: cheltuieli, error: errC } = await sb.from('cheltuieli').select('id, suma, data, descriere');
                if (errC) throw errC;

                let totalIncasat = 0;
                let totalCheltuit = 0;
                let toateTranzactiile = [];

                // Formatare Încasări pentru Istoric
                incasari.forEach(i => {
                    totalIncasat += parseFloat(i.suma);
                    toateTranzactiile.push({
                        id: i.id,
                        tabela: 'incasari',
                        data: i.data,
                        tip: `<span class="tip-incasare">ÎNCASARE</span>`,
                        detalii: `Jucător: <b>${i.players ? i.players.name : 'Necunoscut'}</b> (${i.detalii || 'Fără detalii'})`,
                        suma: `+${i.suma} RON`
                    });
                });

                // Formatare Cheltuieli pentru Istoric
                cheltuieli.forEach(c => {
                    totalCheltuit += parseFloat(c.suma);
                    toateTranzactiile.push({
                        id: c.id,
                        tabela: 'cheltuieli',
                        data: c.data,
                        tip: `<span class="tip-cheltuiala">CHELTUIALĂ</span>`,
                        detalii: c.descriere,
                        suma: `-${c.suma} RON`
                    });
                });

                // Sortăm tranzacțiile după dată (cele mai recente primele)
                toateTranzactiile.sort((a,b) => new Date(b.data) - new Date(a.data));

                // Actualizăm interfața grafică
                document.getElementById('totalIncasat').textContent = `${totalIncasat.toFixed(2)} RON`;
                document.getElementById('totalCheltuit').textContent = `${totalCheltuit.toFixed(2)} RON`;
                
                const soldFinal = totalIncasat - totalCheltuit;
                document.getElementById('totalBuget').textContent = `${soldFinal.toFixed(2)} RON`;

                // Construire tabel istoric
                const tbody = document.getElementById('listaTranzactii');
                tbody.innerHTML = "";
                
                if(toateTranzactiile.length === 0) {
                    document.getElementById('loadingTranzactii').textContent = "Nu există nicio tranzacție salvată.";
                    document.getElementById('loadingTranzactii').style.display = "block";
                    document.getElementById('tabelTranzactii').style.display = "none";
                } else {
                    document.getElementById('loadingTranzactii').style.display = "none";
                    document.getElementById('tabelTranzactii').style.display = "table";
                    
                    toateTranzactiile.forEach(t => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${t.data}</td>
                                <td>${t.tip}</td>
                                <td>${t.detalii}</td>
                                <td>${t.suma}</td>
                                <td style="text-align: center;">
                                    <button class="btn-sterge" onclick="stergeTranzactie('${t.tabela}', '${t.id}')">Șterge</button>
                                </td>
                            </tr>
                        `;
                    });
                }

            } catch (e) {
                console.error("Eroare la calcularea bugetului:", e.message);
            }
        }

        // Funcție pentru ștergerea unei tranzacții din baza de date
        async function stergeTranzactie(tabela, id) {
            if (!confirm("Sigur vrei să ștergi această înregistrare? Acțiunea este ireversibilă!")) {
                return;
            }

            try {
                const { error } = await sb.from(tabela).delete().eq('id', id);
                if (error) throw error;

                alert("Tranzacția a fost ștearsă!");
                await recalculeazaBuget(); // Reîmprospătează calculele și tabelul
            } catch (e) {
                alert("Eroare la ștergere: " + e.message);
            }
        }

        // Trimite încasarea în Supabase
        async function adaugaIncasare() {
            const jucatorId = document.getElementById('selectJucator').value;
            const suma = document.getElementById('sumaIncasare').value;
            const detalii = document.getElementById('detaliiIncasare').value;

            if (!jucatorId || !suma || suma <= 0) {
                alert("Te rog selectează jucătorul și introdu o sumă validă!");
                return;
            }

            try {
                const { error } = await sb.from('incasari').insert([
                    { jucator_id: jucatorId, suma: parseFloat(suma), detalii: detalii }
                ]);

                if (error) throw error;

                alert("Încasare salvată cu succes!");
                document.getElementById('sumaIncasare').value = "";
                document.getElementById('detaliiIncasare').value = "";
                await recalculeazaBuget();
            } catch(e) {
                alert("Eroare la salvare: " + e.message);
            }
        }

        // Trimite cheltuiala în Supabase
        async function adaugaCheltuiala() {
            const descriere = document.getElementById('descriereCheltuiala').value;
            const suma = document.getElementById('sumaCheltuiala').value;
            const data = document.getElementById('dataCheltuiala').value;

            if (!descriere || !suma || suma <= 0) {
                alert("Te rog introdu o descriere și suma cheltuită!");
                return;
            }

            try {
                const { error } = await sb.from('cheltuieli').insert([
                    { descriere: descriere, suma: parseFloat(suma), data: data }
                ]);

                if (error) throw error;

                alert("Cheltuială înregistrată cu succes!");
                document.getElementById('descriereCheltuiala').value = "";
                document.getElementById('sumaCheltuiala').value = "";
                await recalculeazaBuget();
            } catch(e) {
                alert("Eroare la salvare: " + e.message);
            }
        }

        init();
    </script>
</body>
</html>
