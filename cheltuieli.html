<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Buget Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #0f131c;
            --panel-bg: #151b26;
            --accent-gold: #f1d483;
            --border-color: #232d3f;
            --text-light: #e2e8f0;
            --success-green: #10b981;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1, h2, h3 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .btn-back {
            background: #1c2433;
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid var(--border-color);
            font-weight: bold;
        }

        .total-budget-box {
            background: linear-gradient(135deg, #1e293b 0%, #151b26 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .total-budget-box .suma {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: block;
            margin-top: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .budget-form {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .form-group input, .form-group select {
            background: #1c2433;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
        }

        .btn-add {
            background: var(--accent-gold);
            color: #0b0e14;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            text-transform: uppercase;
        }
        
        .btn-add-payment {
            background: var(--success-green);
            color: #fff;
        }

        .wishlist-item {
            background: #1c2433;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-name { font-size: 1.15rem; font-weight: 700; }

        .item-finances {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 8px;
        }
        .delete-btn:hover { color: #ef4444; }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .player-row {
            display: flex;
            flex-direction: column;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
        }
        .player-row:last-child { border-bottom: none; }
        
        .player-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }
        
        .player-row-details {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .amount-paid { color: var(--success-green); font-weight: 700; }
        .amount-spent { color: #ef4444; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <h1>💰 Management Buget & Încasări</h1>
            <a href="index.html" class="btn-back">← Înapoi</a>
        </div>

        <div class="total-budget-box">
            <span>SOLD TOTAL DISPONIBIL (ÎNCASĂRI - CHELTUIELI)</span>
            <span class="suma" id="totalColectat">0 RON</span>
        </div>

        <div class="main-layout">
            <!-- COLOANA STÂNGA: Planificare Cheltuieli -->
            <div>
                <h2>🎯 Înregistrează Cheltuială</h2>
                <div class="budget-form" style="margin-top:15px; margin-bottom: 25px;">
                    <div class="form-group">
                        <label>Descriere Cheltuială / Produs</label>
                        <input type="text" id="itemName" placeholder="Ex: Minge WC26 Trionda Pro">
                    </div>
                    <div class="form-group">
                        <label>Suma Cheltuită (RON)</label>
                        <input type="number" id="itemTarget" placeholder="Ex: 470">
                    </div>
                    <button class="btn-add" onclick="salveazaCheltuiala()">Adaugă Cheltuială</button>
                </div>

                <h2>📋 Listă Cheltuieli Înregistrate</h2>
                <div id="wishlistContainer" style="margin-top: 15px;">Încarcă cheltuieli...</div>
            </div>

            <!-- COLOANA DREAPTĂ: Formular Adăugare Plăți + Istoric Nume Real -->
            <div>
                <h2>💵 Înregistrează Plată Nouă (Jucător)</h2>
                <div class="budget-form" style="margin-top:15px; margin-bottom: 25px;">
                    <div class="form-group">
                        <label>Selectează Jucătorul</label>
                        <select id="paymentPlayer">
                            <option value="">Se încarcă jucătorii...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Suma Plătită (RON)</label>
                        <input type="number" id="paymentAmount" placeholder="Ex: 50">
                    </div>
                    <div class="form-group">
                        <label>Detalii Plată</label>
                        <input type="text" id="paymentDetails" placeholder="Ex: Cotizatie minge / Rest sintetic">
                    </div>
                    <button class="btn-add btn-add-payment" onclick="salveazaPlata()">Adaugă Plată</button>
                </div>

                <div class="panel">
                    <h2>👥 Istoric Încasări Jucători</h2>
                    <div id="playersContributions" style="margin-top: 15px;">Încarcă lista de încasări...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lfnumwbjikiyngdxsgrk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbnVtd2JqaWtpeW5nZHhzZ3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MDQ1MzEsImV4cCI6MjA5MDA4MDUzMX0.BrrmEHnOwa66hDqN-GhYCyqHqOqTAV7dswjcOVxx-wc';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalIncasari = 0;
        let globalCheltuieli = 0;

        function actualizeazaSoldFinal() {
            const soldFinal = globalIncasari - globalCheltuieli;
            document.getElementById('totalColectat').textContent = `${soldFinal.toFixed(2)} RON`;
        }

        // 1. Încarcă jucătorii din tabelul 'players'
        async function incarcaJucatoriDropdown() {
            try {
                const { data, error } = await sb.from('players').select('id, name').order('name', { ascending: true });
                if (error) throw error;

                const select = document.getElementById('paymentPlayer');
                select.innerHTML = '<option value="">-- Alege Jucător --</option>';

                if(data && data.length > 0) {
                    data.forEach(j => {
                        select.innerHTML += `<option value="${j.id}">${j.name}</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">Nu s-au găsit jucători în bază</option>';
                }
            } catch(e) {
                console.error("Nu s-au putut încărca jucătorii:", e);
            }
        }

        // 2. Încarcă încasările folosind relația nativă 'players(name)'
        async function incarcaBugetSiJucatori() {
            try {
                const { data: incasari, error } = await sb.from('incasari').select('id, suma, data, detalii, players(name)');
                if (error) throw error;

                const container = document.getElementById('playersContributions');
                container.innerHTML = '';

                globalIncasari = 0;
                if(incasari && incasari.length > 0) {
                    incasari.forEach(i => {
                        const numeJucator = i.players ? i.players.name : 'Jucător Necunoscut';
                        const sumaIncasata = parseFloat(i.suma || 0);
                        const detaliiMeci = i.detalii || 'Fără detalii';
                        
                        globalIncasari += sumaIncasata;
                        
                        container.innerHTML += `
                            <div class="player-row">
                                <div class="player-row-top">
                                    <span>${numeJucator}</span>
                                    <div>
                                        <span class="amount-paid">+${sumaIncasata} RON</span>
                                        <button class="delete-btn" onclick="stergePlata('${i.id}')">🗑️</button>
                                    </div>
                                </div>
                                <div class="player-row-details">
                                    ${detaliiMeci} (${i.data || ''})
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="color:#64748b;">Nicio încasare înregistrată.</p>';
                }

                actualizeazaSoldFinal();

            } catch (e) {
                console.error(e);
                document.getElementById('playersContributions').textContent = "Eroare la încărcarea tabelului încasări.";
            }
        }

        // 3. Salvează plată nouă utilizând 'jucator_id'
        async function salveazaPlata() {
            const jucatorId = document.getElementById('paymentPlayer').value;
            const suma = parseFloat(document.getElementById('paymentAmount').value);
            const detalii = document.getElementById('paymentDetails').value.trim();

            if(!jucatorId || isNaN(suma) || suma <= 0) {
                alert("Te rog selectează un jucător și introdu o sumă validă!");
                return;
            }

            try {
                const azi = new Date().toISOString().split('T')[0];
                const { error } = await sb.from('incasari').insert([
                    {
                        jucator_id: jucatorId,
                        suma: suma,
                        detalii: detalii || 'Cotizație',
                        data: azi
                    }
                ]);

                if (error) throw error;

                document.getElementById('paymentAmount').value = '';
                document.getElementById('paymentDetails').value = '';
                document.getElementById('paymentPlayer').value = '';

                await incarcaBugetSiJucatori();

            } catch(e) {
                alert("Eroare la salvarea plății: " + e.message);
            }
        }

        // 4. Încarcă cheltuielile folosind coloanele corecte ('descriere', 'suma', 'data')
        async function incarcaWishlist() {
            try {
                const { data: cheltuieli, error } = await sb.from('cheltuieli').select('id, descriere, suma, data');
                if (error) throw error;

                const container = document.getElementById('wishlistContainer');
                container.innerHTML = '';

                globalCheltuieli = 0;
                if(!cheltuieli || cheltuieli.length === 0) {
                    container.innerHTML = '<p style="color:#64748b;">Nu există cheltuieli înregistrate.</p>';
                    actualizeazaSoldFinal();
                    return;
                }

                cheltuieli.forEach(item => {
                    const descriereProdus = item.descriere || 'Cheltuială generală';
                    const sumaCheltuita = parseFloat(item.suma || 0);
                    const dataCheltuiala = item.data || '';
                    
                    globalCheltuieli += sumaCheltuita;

                    container.innerHTML += `
                        <div class="wishlist-item">
                            <div class="item-header">
                                <div>
                                    <span class="item-name">${descriereProdus}</span>
                                    <button class="delete-btn" onclick="stergeObiectiv(${item.id})">🗑️</button>
                                </div>
                                <span class="amount-spent">-${sumaCheltuita} RON</span>
                            </div>
                            <div class="item-finances">
                                <span>Data înregistrării: <strong>${dataCheltuiala}</strong></span>
                            </div>
                        </div>
                    `;
                });

                actualizeazaSoldFinal();

            } catch(e) {
                console.error(e);
                document.getElementById('wishlistContainer').textContent = "Eroare la încărcarea tabelului cheltuieli.";
            }
        }

        // 5. Salvează cheltuială nouă în baza de date cu maparea corectă a coloanelor
        async function salveazaCheltuiala() {
            const nume = document.getElementById('itemName').value.trim();
            const suma = parseFloat(document.getElementById('itemTarget').value);

            if(!nume || isNaN(suma) || suma <= 0) {
                alert("Te rog adaugă o descriere și suma cheltuită!");
                return;
            }

            try {
                const azi = new Date().toISOString().split('T')[0];
                const { error } = await sb.from('cheltuieli').insert([
                    { 
                        descriere: nume, 
                        suma: suma, 
                        data: azi
                    }
                ]);
                if (error) throw error;

                document.getElementById('itemName').value = '';
                document.getElementById('itemTarget').value = '';
                
                await incarcaWishlist();

            } catch(e) {
                alert("Eroare la salvare: " + e.message);
            }
        }

        // 6. Șterge o cheltuială
        async function stergeObiectiv(id) {
            if(!confirm("Sigur vrei să ștergi această cheltuială?")) return;
            try {
                const { error } = await sb.from('cheltuieli').delete().eq('id', id);
                if (error) throw error;
                await incarcaWishlist();
            } catch(e) {
                alert("Eroare la ștergerea cheltuielii.");
            }
        }

        // 7. Șterge o plată
        async function stergePlata(id) {
            if(!confirm("Vrei să ștergi această înregistrare de plată?")) return;
            try {
                const { error } = await sb.from('incasari').delete().eq('id', id);
                if (error) throw error;
                await incarcaBugetSiJucatori();
            } catch(e) {
                alert("Eroare la ștergerea plății.");
            }
        }

        // Inițializare aplicație
        async function init() {
            await incarcaJucatoriDropdown();
            await incarcaBugetSiJucatori();
            await incarcaWishlist();
        }

        init();
    </script>
</body>
</html>
