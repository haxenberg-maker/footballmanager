<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Buget Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script>
    const SUPABASE_URL = 'https://lfnumwbjikiyngdxsgrk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbnVtd2JqaWtpeW5nZHhzZ3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MDQ1MzEsImV4cCI6MjA5MDA4MDUzMX0.BrrmEHnOwa66hDqN-GhYCyqHqOqTAV7dswjcOVxx-wc';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let globalIncasari = 0;
    let globalCheltuieliAlocate = 0;
    let globalCheltuieliReale = 0;
    let globalSoldDisponibil = 0;
    let dateRaportIncasari = [];
    let dateRaportWishlist = [];

    window.wishlistNames = {};
    let allocationItemId = null;
    let allocationMax = 0;

    const PRIO_RANK = { mare: 1, medie: 2, mica: 3 };

    function actualizeazaSoldFinal() {
        globalSoldDisponibil = Math.max(
            0,
            globalIncasari - globalCheltuieliReale - globalCheltuieliAlocate
        );

        document.getElementById('totalBuget').textContent = `${globalIncasari.toFixed(2)} RON`;
        document.getElementById('totalAlocat').textContent = `${globalCheltuieliAlocate.toFixed(2)} RON`;
        document.getElementById('totalColectat').textContent = `${globalSoldDisponibil.toFixed(2)} RON`;
    }

    function deschideModalAlocare(id, nume, sumaAlocata, tinta) {
        allocationItemId = id;
        const restProdus = Math.max(0, tinta - sumaAlocata);
        allocationMax = Math.min(globalSoldDisponibil, restProdus);

        document.getElementById('allocationProductName').textContent =
            `${nume} — ${sumaAlocata.toFixed(2)} / ${tinta.toFixed(2)} RON`;

        document.getElementById('allocationHelp').textContent =
            `Disponibil în buget: ${globalSoldDisponibil.toFixed(2)} RON • Mai trebuie pentru produs: ${restProdus.toFixed(2)} RON`;

        const input = document.getElementById('allocationAmount');
        input.value = '';
        input.max = allocationMax.toFixed(2);

        const modal = document.getElementById('allocationModal');
        modal.classList.add('open');
        setTimeout(() => input.focus(), 50);
    }

    function inchideModalAlocare() {
        const modal = document.getElementById('allocationModal');
        if (modal) modal.classList.remove('open');
        allocationItemId = null;
        allocationMax = 0;
    }

    async function confirmaAlocarea() {
        if (!allocationItemId) return;

        const input = document.getElementById('allocationAmount');
        const suma = parseFloat(input.value);

        if (isNaN(suma) || suma <= 0) {
            alert('Introdu o sumă validă.');
            return;
        }

        if (suma > allocationMax + 0.001) {
            alert(`Poți aloca maximum ${allocationMax.toFixed(2)} RON pentru acest produs.`);
            return;
        }

        try {
            const { data: item, error: fetchError } = await sb
                .from('cheltuieli')
                .select('id, descriere, suma')
                .eq('id', allocationItemId)
                .single();

            if (fetchError) throw fetchError;

            let payload = {};
            try {
                payload = JSON.parse(item.descriere || '{}');
            } catch (e) {}

            const tinta = parseFloat(payload.pret_total ?? item.suma ?? 0);
            const alocatActual = parseFloat(payload.pret_alocat ?? 0);
            const nouAlocat = Math.min(tinta, alocatActual + suma);

            if (nouAlocat <= alocatActual) {
                alert('Produsul este deja complet finanțat.');
                return;
            }

            payload.isWishlist = true;
            payload.produs = payload.produs || item.descriere;
            payload.pret_total = tinta;
            payload.pret_alocat = nouAlocat;
            payload.prioritate = payload.prioritate || 'medie';

            const { error: updateError } = await sb
                .from('cheltuieli')
                .update({
                    descriere: JSON.stringify(payload),
                    suma: tinta
                })
                .eq('id', allocationItemId);

            if (updateError) throw updateError;

            inchideModalAlocare();
            await incarcaBugetSiJucatori();
        } catch (e) {
            console.error(e);
            alert('Nu am putut salva alocarea: ' + e.message);
        }
    }

    async function incarcaJucatoriDropdown() {
        try {
            const { data, error } = await sb.from('players').select('id, name').order('name', { ascending: true });
            if (error) throw error;
            const select = document.getElementById('paymentPlayer');
            select.innerHTML = '<option value="">-- Alege Jucător --</option>';
            if(data && data.length > 0) {
                data.forEach(j => { select.innerHTML += `<option value="${j.id}">${j.name}</option>`; });
            }
        } catch(e) { console.error(e); }
    }

    async function incarcaBugetSiJucatori() {
        try {
            const { data: incasari, error } = await sb.from('incasari').select('id, suma, data, detalii, players(name)');
            if (error) throw error;

            const container = document.getElementById('playersContributions');
            container.innerHTML = '';

            globalIncasari = 0;
            dateRaportIncasari = [];
            if(incasari && incasari.length > 0) {
                incasari.forEach(i => {
                    const numeJucator = i.players ? i.players.name : 'Jucător Necunoscut';
                    const sumaIncasata = parseFloat(i.suma || 0);
                    const detaliiMeci = i.detalii || 'Fără detalii';
                    
                    globalIncasari += sumaIncasata;
                    dateRaportIncasari.push({ nume: numeJucator, suma: sumaIncasata, detalii: detaliiMeci });
                    
                    container.innerHTML += `
                        <div class="player-row">
                            <div class="player-row-top">
                                <span>${numeJucator}</span>
                                <div>
                                    <span class="amount-paid">+${sumaIncasata} RON</span>
                                    <button class="delete-btn" data-delete-payment="${i.id}">🗑️</button>
                                </div>
                            </div>
                            <div class="player-row-details">
                                ${detaliiMeci} (${i.data || ''})
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p style="color:#64748b;">Nicio încasare înregistrată.</p>';
            }

            const { data: expenseRows, error: expenseError } = await sb
                .from('cheltuieli')
                .select('id, descriere, suma, data')
                .order('id', { ascending: false });

            if (expenseError) throw expenseError;

            globalCheltuieliReale = 0;
            const expensesHistory = document.getElementById('expensesHistory');
            if (expensesHistory) expensesHistory.innerHTML = '';

            (expenseRows || []).forEach(row => {
                try {
                    const parsed = JSON.parse(row.descriere || '{}');
                    if (parsed.isExpense === true) {
                        const sumaCheltuita = Math.max(0, parseFloat(parsed.suma || row.suma || 0));
                        globalCheltuieliReale += sumaCheltuita;

                        if (expensesHistory) {
                            expensesHistory.innerHTML += `
                                <div class="player-row">
                                    <div class="player-row-top">
                                        <span>${parsed.detalii || 'Cheltuială'}</span>
                                        <div>
                                            <span style="color:#ef4444;font-weight:700;">-${sumaCheltuita.toFixed(2)} RON</span>
                                            <button class="delete-btn" data-delete-expense="${row.id}">🗑️</button>
                                        </div>
                                    </div>
                                    <div class="player-row-details">${row.data || ''}</div>
                                </div>
                            `;
                        }
                    }
                } catch (e) {}
            });

            if (expensesHistory && !expensesHistory.innerHTML.trim()) {
                expensesHistory.innerHTML = '<p style="color:#64748b;">Nicio cheltuială înregistrată.</p>';
            }

            await incarcaWishlist();
        } catch (e) { console.error(e); }
    }

    async function incarcaWishlist() {
        try {
            const { data: cheltuieli, error } = await sb
                .from('cheltuieli')
                .select('id, descriere, suma, data')
                .order('id', { ascending: true });

            if (error) throw error;

            const container = document.getElementById('wishlistContainer');
            dateRaportWishlist = [];

            const wishlistRows = (cheltuieli || []).filter(item => {
                try {
                    const parsed = JSON.parse(item.descriere || '{}');
                    return parsed.isWishlist === true;
                } catch (e) {
                    return false;
                }
            });

            if (wishlistRows.length === 0) {
                container.innerHTML = '<p style="color:#64748b;">Nu există produse în Wishlist.</p>';
                globalCheltuieliAlocate = 0;
                actualizeazaSoldFinal();
                return;
            }

            const items = wishlistRows.map(item => {
                let parsed = {};
                try { parsed = JSON.parse(item.descriere || '{}'); } catch (e) {}

                const tinta = Math.max(0, parseFloat(parsed.pret_total ?? item.suma ?? 0));
                const alocat = Math.max(
                    0,
                    Math.min(parseFloat(parsed.pret_alocat || 0), tinta)
                );

                return {
                    id: item.id,
                    numeProdus: parsed.produs || 'Produs',
                    tinta,
                    prioritate: parsed.prioritate || 'medie',
                    alocat
                };
            });

            const sortedItems = [...items].sort((a, b) =>
                (PRIO_RANK[a.prioritate] || 2) - (PRIO_RANK[b.prioritate] || 2) || a.id - b.id
            );

            globalCheltuieliAlocate = items.reduce((total, item) => total + item.alocat, 0);
            actualizeazaSoldFinal();
            container.innerHTML = '';

            sortedItems.forEach(it => {
                const curent = it.alocat;
                const tinta = it.tinta;
                const rest = Math.max(0, tinta - curent);
                let procent = tinta > 0 ? Math.round((curent / tinta) * 100) : 0;
                if (procent > 100) procent = 100;

                const eComplet = procent >= 100;
                window.wishlistNames[String(it.id)] = it.numeProdus;

                dateRaportWishlist.push({
                    produs: it.numeProdus,
                    tinta,
                    curent,
                    procent,
                    complet: eComplet,
                    prioritate: it.prioritate
                });

                container.innerHTML += `
                    <div class="wishlist-item ${eComplet ? 'completed' : ''}">
                        <div class="item-header">
                            <div>
                                <span class="item-name">${it.numeProdus}</span>
                                <button class="delete-btn" data-delete-wishlist="${it.id}">🗑️</button>
                            </div>
                            <span class="priority-badge prio-${it.prioritate}">${it.prioritate}</span>
                        </div>

                        <div class="item-finances">
                            <span>Alocat: <strong>${curent.toFixed(2)} RON</strong> din ${tinta.toFixed(2)} RON</span>
                            <span>${eComplet ? '🎉 Buget complet!' : `Mai trebuie: ${rest.toFixed(2)} RON (${procent}%)`}</span>
                        </div>

                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${procent}%"></div>
                        </div>

                        <div class="allocation-row">
                            <span class="allocation-info">
                                ${eComplet ? 'Produsul este finanțat 100%.' : `Progres finanțare: ${procent}%`}
                            </span>
                            <button
                                class="btn-allocate"
                                ${eComplet ? 'disabled' : ''}
                                type="button"
                                data-action="open-allocation"
                                data-allocation-id="${it.id}"
                                data-allocation-current="${curent}"
                                data-allocation-target="${tinta}">
                                🎯 Alocă din buget
                            </button>
                        </div>
                    </div>
                `;
            });

            actualizeazaSoldFinal();
        } catch(e) {
            console.error(e);
        }
    }

    async function salveazaPlata() {
        const jucatorId = document.getElementById('paymentPlayer').value;
        const suma = parseFloat(document.getElementById('paymentAmount').value);
        const detalii = document.getElementById('paymentDetails').value.trim();

        if(!jucatorId || isNaN(suma) || suma <= 0) {
            alert("Te rog selectează un jucător și introdu o sumă validă!");
            return;
        }

        try {
            const azi = new Date().toISOString().split('T')[0];
            const { error } = await sb.from('incasari').insert([{ jucator_id: jucatorId, suma: suma, detalii: detalii || 'Cotizație', data: azi }]);
            if (error) throw error;
            document.getElementById('paymentAmount').value = '';
            document.getElementById('paymentDetails').value = '';
            await incarcaBugetSiJucatori();
        } catch(e) { alert(e.message); }
    }

    async function salveazaCheltuialaReala() {
        const suma = parseFloat(document.getElementById('expenseAmount').value);
        const detalii = document.getElementById('expenseDetails').value.trim();

        if (isNaN(suma) || suma <= 0) {
            alert('Introdu o sumă validă pentru cheltuială.');
            return;
        }

        if (suma > globalSoldDisponibil + 0.001) {
            alert(`Nu poți înregistra o cheltuială de ${suma.toFixed(2)} RON. Buget disponibil: ${globalSoldDisponibil.toFixed(2)} RON.`);
            return;
        }

        try {
            const azi = new Date().toISOString().split('T')[0];
            const payload = { isExpense: true, suma, detalii: detalii || 'Cheltuială' };

            const { error } = await sb.from('cheltuieli').insert([{
                descriere: JSON.stringify(payload),
                suma,
                data: azi
            }]);

            if (error) throw error;

            document.getElementById('expenseAmount').value = '';
            document.getElementById('expenseDetails').value = '';

            await incarcaBugetSiJucatori();
        } catch (e) {
            alert('Eroare la salvarea cheltuielii: ' + e.message);
        }
    }

    async function salveazaCheltuiala() {
        const nume = document.getElementById('itemName').value.trim();
        const tinta = parseFloat(document.getElementById('itemTarget').value);
        const prioritate = document.getElementById('itemPriority').value;

        if(!nume || isNaN(tinta) || tinta <= 0) {
            alert("Te rog adaugă un nume de produs și prețul lui total!");
            return;
        }

        const wishlistPayload = {
            isWishlist: true,
            produs: nume,
            pret_total: tinta,
            pret_alocat: 0,
            prioritate: prioritate
        };

        try {
            const azi = new Date().toISOString().split('T')[0];
            const { error } = await sb.from('cheltuieli').insert([{ descriere: JSON.stringify(wishlistPayload), suma: tinta, data: azi }]);
            if (error) throw error;
            document.getElementById('itemName').value = '';
            document.getElementById('itemTarget').value = '';
            await incarcaBugetSiJucatori();
        } catch(e) { alert(e.message); }
    }

    async function stergeCheltuiala(id) {
        if (!confirm('Sigur vrei să ștergi această cheltuială?')) return;
        try {
            const { error } = await sb.from('cheltuieli').delete().eq('id', id);
            if (error) throw error;
            await incarcaBugetSiJucatori();
        } catch (e) {
            alert('Eroare la ștergerea cheltuielii: ' + e.message);
        }
    }

    async function stergeObiectiv(id) {
        if(!confirm("Sigur vrei să ștergi acest produs din listă?")) return;
        try {
            const { error } = await sb.from('cheltuieli').delete().eq('id', id);
            if (error) throw error;
            await incarcaBugetSiJucatori();
        } catch(e) { alert("Eroare"); }
    }

    async function stergePlata(id) {
        if(!confirm("Vrei să ștergi această înregistrare de plată?")) return;
        try {
            const { error } = await sb.from('incasari').delete().eq('id', id);
            if (error) throw error;
            await incarcaBugetSiJucatori();
        } catch(e) { alert("Eroare"); }
    }

    function genereazaTabelaRaport() {
        const soldFinal = globalIncasari - globalCheltuieliAlocate;
        
        let text = `👑 *UPDATE FINANCIAR - ARENA FC* 👑\n`;
        text += `▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n\n`;
        
        text += `💰 *STARE BUGET:*\n`;
        text += `└ Buget Disponibil: *${soldFinal.toFixed(2)} RON*\n`;
        text += `└ Total Strâns: _${globalIncasari.toFixed(2)} RON_\n`;
        text += `└ Total Alocat Wishlist: _${globalCheltuieliAlocate.toFixed(2)} RON_\n`;
        text += `└ Cheltuieli Reale: _${globalCheltuieliReale.toFixed(2)} RON_\n\n`;

        text += `🎯 *CE VREM SĂ CUMPĂRĂM / WISHLIST:*\n`;
        if(dateRaportWishlist.length === 0) {
            text += `└ _Fără produse adăugate în acest moment._\n`;
        } else {
            dateRaportWishlist.forEach(w => {
                if (w.complet) {
                    text += `✅ *${w.produs}* → Strâns complet! (*${w.tinta} RON*)\n`;
                } else {
                    const lipsa = w.tinta - w.curent;
                    text += `⏳ *${w.produs}* \n`;
                    text += `   └ Progres: *${w.curent}* / *${w.tinta} RON* (${w.procent}%)\n`;
                    text += `   └ Mai trebuie: *${lipsa.toFixed(2)} RON*\n`;
                }
            });
        }

        text += `\n👥 *CINE A DAT BANI RECENT:*\n`;
        if(dateRaportIncasari.length === 0) {
            text += `└ _Nicio plată înregistrată în baza de date._\n`;
        } else {
            const sumePeJucator = {};
            dateRaportIncasari.forEach(i => {
                if(!sumePeJucator[i.nume]) sumePeJucator[i.nume] = [];
                sumePeJucator[i.nume].push(`${i.suma} RON (${i.detalii})`);
            });

            for (const jucator in sumePeJucator) {
                text += `• *${jucator}* : ${sumePeJucator[jucator].join(' + ')}\n`;
            }
        }
        
        text += `\n▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n`;
        text += `⚡ _Raport actualizat în timp real din aplicație._`;

        navigator.clipboard.writeText(text).then(() => {
            alert("📋 Raportul formatat a fost copiat! Dă Paste direct pe grupul de WhatsApp.");
        }).catch(err => {
            alert("Eroare la copiere.");
        });
    }

    // Handlere globale pentru Evenimente (Event Delegation Fix)
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('button, [data-action]');
        
        // Deschidere Modal Alocare
        if (btn && btn.dataset.action === 'open-allocation') {
            if (globalSoldDisponibil <= 0) {
                alert("Nu ai suficient buget disponibil pentru a face o alocare!");
                return;
            }
            const id = Number(btn.dataset.allocationId);
            const current = Number(btn.dataset.allocationCurrent || 0);
            const target = Number(btn.dataset.allocationTarget || 0);
            const name = window.wishlistNames[String(id)] || 'Produs';
            deschideModalAlocare(id, name, current, target);
            return;
        }

        // Stergere Wishlist
        const btnWishlist = e.target.closest('[data-delete-wishlist]');
        if (btnWishlist) {
            stergeObiectiv(btnWishlist.dataset.deleteWishlist);
            return;
        }

        // Stergere Plata
        const btnPayment = e.target.closest('[data-delete-payment]');
        if (btnPayment) {
            stergePlata(btnPayment.dataset.deletePayment);
            return;
        }

        // Stergere Cheltuiala
        const btnExpense = e.target.closest('[data-delete-expense]');
        if (btnExpense) {
            stergeCheltuiala(btnExpense.dataset.deleteExpense);
            return;
        }

        if (!btn) return;

        const action = btn.dataset.action;
        if (action === 'login') autentifica();
        if (action === 'logout') delogare();
        if (action === 'report') genereazaTabelaRaport();
        if (action === 'add-wishlist') salveazaCheltuiala();
        if (action === 'add-payment') salveazaPlata();
        if (action === 'add-expense') salveazaCheltuialaReala();
    });

    document.getElementById('confirmAllocationButton').addEventListener('click', confirmaAlocarea);
    document.getElementById('cancelAllocationButton').addEventListener('click', inchideModalAlocare);
    
    document.getElementById('allocationModal').addEventListener('click', (e) => {
        if (e.target.id === 'allocationModal') inchideModalAlocare();
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') inchideModalAlocare();
    });

    async function init() {
        await incarcaJucatoriDropdown();
        await incarcaBugetSiJucatori();
    }

    async function autentifica() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errEl = document.getElementById('loginError');
        errEl.style.display = 'none';
        if (!email || !password) return;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
            errEl.textContent = 'Email sau parolă greșită.';
            errEl.style.display = 'block';
            return;
        }
        afiseazaApp();
    }

    async function delogare() {
        await sb.auth.signOut();
        document.getElementById('appContent').style.display = 'none';
        document.getElementById('loginGate').style.display = 'flex';
    }

    function afiseazaApp() {
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        init();
    }

    async function verificaSesiune() {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            afiseazaApp();
        } else {
            document.getElementById('loginGate').style.display = 'flex';
        }
    }

    verificaSesiune();
</script>
</body>
</html>
