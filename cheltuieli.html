<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Buget Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #0f131c;
            --panel-bg: #151b26;
            --accent-gold: #f1d483;
            --border-color: #232d3f;
            --text-light: #e2e8f0;
            --success-green: #10b981;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1, h2, h3 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .btn-back {
            background: #1c2433;
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid var(--border-color);
            font-weight: bold;
        }

        .total-budget-box {
            background: linear-gradient(135deg, #1e293b 0%, #151b26 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .total-budget-box .suma {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: block;
            margin-top: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .budget-form {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .form-group input, .form-group select {
            background: #1c2433;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
        }

        .btn-add {
            background: var(--accent-gold);
            color: #0b0e14;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            text-transform: uppercase;
        }
        
        .btn-add-payment {
            background: var(--success-green);
            color: #fff;
        }

        .wishlist-item {
            background: #1c2433;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-name { font-size: 1.15rem; font-weight: 700; }
        
        .priority-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
        }
        .prio-mare { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .prio-medie { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .prio-mica { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .item-finances {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .progress-container {
            width: 100%;
            background: #0f131c;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #cca03a 0%, var(--accent-gold) 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .completed .progress-bar {
            background: var(--success-green);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 8px;
        }
        .delete-btn:hover { color: #ef4444; }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        /* Stilul exact din poza ta image_88e3e4.png */
        .player-row {
            display: flex;
            flex-direction: column;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
        }
        .player-row:last-child { border-bottom: none; }
        
        .player-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }
        
        .player-row-details {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .amount-paid { color: var(--success-green); font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <h1>💰 Management Buget & Încasări</h1>
            <a href="index.html" class="btn-back">← Înapoi</a>
        </div>

        <div class="total-budget-box">
            <span>TOTAL STRÂNS DIN JUCĂTORI (BUGET DISPONIBIL)</span>
            <span class="suma" id="totalColectat">0 RON</span>
        </div>

        <div class="main-layout">
            <!-- COLOANA STÂNGA: Cheltuieli / Obiective -->
            <div>
                <h2>🎯 Adaugă Necesar / Produse</h2>
                <div class="budget-form" style="margin-top:15px; margin-bottom: 25px;">
                    <div class="form-group">
                        <label>Ce trebuie cumpărat? (Produs)</label>
                        <input type="text" id="itemName" placeholder="Ex: Mănuși Portar">
                    </div>
                    <div class="form-group">
                        <label>Preț Total Necesar (RON)</label>
                        <input type="number" id="itemTarget" placeholder="Ex: 300">
                    </div>
                    <div class="form-group">
                        <label>Suma Alocată Deja (RON)</label>
                        <input type="number" id="itemCurrent" placeholder="Ex: 40">
                    </div>
                    <div class="form-group">
                        <label>Prioritate</label>
                        <select id="itemPriority">
                            <option value="mare">Mare 🔥</option>
                            <option value="medie" selected>Medie ⚡</option>
                            <option value="mica">Mică 💤</option>
                        </select>
                    </div>
                    <button class="btn-add" onclick="salveazaCheltuiala()">Adaugă în tabelul Cheltuieli</button>
                </div>

                <h2>📋 Listă Achiziții & Progres</h2>
                <div id="wishlistContainer" style="margin-top: 15px;">Încarcă necesar...</div>
            </div>

            <!-- COLOANA DREAPTĂ: Adăugare Plăți + Istoric Plăți (Conform image_88e3e4.png) -->
            <div>
                <h2>💵 Înregistrează Plată Nouă</h2>
                <div class="budget-form" style="margin-top:15px; margin-bottom: 25px;">
                    <div class="form-group">
                        <label>Selectează Jucătorul</label>
                        <select id="paymentPlayer">
                            <option value="">Se încarcă jucătorii...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Suma Plătită (RON)</label>
                        <input type="number" id="paymentAmount" placeholder="Ex: 50">
                    </div>
                    <div class="form-group">
                        <label>Detalii Plată</label>
                        <input type="text" id="paymentDetails" placeholder="Ex: Cotizatie minge / Rest sintetic">
                    </div>
                    <button class="btn-add btn-add-payment" onclick="salveazaPlata()">Adaugă Plată</button>
                </div>

                <div class="panel">
                    <h2>👥 Istoric Încasări Jucători</h2>
                    <div id="playersContributions" style="margin-top: 15px;">Încarcă lista de încasări...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lfnumwbjikiyngdxsgrk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbnVtd2JqaWtpeW5nZHhzZ3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MDQ1MzEsImV4cCI6MjA5MDA4MDUzMX0.BrrmEHnOwa66hDqN-GhYCyqHqOqTAV7dswjcOVxx-wc';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Map stocare locală id_jucator -> Nume pentru rezolvarea rapidă a ID-urilor din image_88e3e4.png
        let listaJucatoriGlobal = {};

        // Încărcare inițială a listei de jucători din baza ta pentru Dropdown
        async function incarcaJucatoriDropdown() {
            try {
                // Încercăm să luăm din 'ratings' sau direct din 'jucatori'
                let { data: jucatori, error } = await sb.from('ratings').select('*');
                if(error) {
                    const res = await sb.from('jucatori').select('*');
                    jucatori = res.data;
                }

                const select = document.getElementById('paymentPlayer');
                select.innerHTML = '<option value="">-- Alege Jucător --</option>';

                if(jucatori && jucatori.length > 0) {
                    jucatori.forEach(j => {
                        const id = j.id || j.jucator_id;
                        const nume = j.nume || j.name || j.player_name;
                        
                        listaJucatoriGlobal[id] = nume; // Salvează în map ca să știm numele după ID
                        
                        select.innerHTML += `<option value="${id}">${nume}</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">Nu s-au găsit jucători în bază</option>';
                }
            } catch(e) {
                console.error("Nu s-au putut încărca jucătorii pentru formular:", e);
            }
        }

        // 1. Încarcă dinamic încasările cu formatare exactă ca în screenshot-ul tău (image_88e3e4.png)
        async function incarcaBugetSiJucatori() {
            try {
                const { data: incasari, error } = await sb.from('incasari').select('*');
                if (error) throw error;

                const container = document.getElementById('playersContributions');
                container.innerHTML = '';

                let total = 0;
                if(incasari && incasari.length > 0) {
                    incasari.forEach(i => {
                        // Rezolvă ID-ul sau numele direct conform structurii tale
                        const refId = i.jucator_id || i.jucator;
                        const numeJucator = listaJucatoriGlobal[refId] || i.nume || `Jucător (ID: ${refId})`;
                        const sumaIncasata = parseFloat(i.suma || 0);
                        const detaliiMeci = i.detalii || 'Cotizatie minge';
                        
                        total += sumaIncasata;
                        
                        // Generăm rândul exact ca structură din db (Nume + Sumă sus, Detalii dedesubt) + Buton Ștergere
                        container.innerHTML += `
                            <div class="player-row">
                                <div class="player-row-top">
                                    <span>${numeJucator}</span>
                                    <div>
                                        <span class="amount-paid">${sumaIncasata} RON</span>
                                        <button class="delete-btn" onclick="stergePlata('${i.id}')">🗑️</button>
                                    </div>
                                </div>
                                <div class="player-row-details">
                                    ${detaliiMeci}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="color:#64748b;">Nicio încasare înregistrată în bază.</p>';
                }

                document.getElementById('totalColectat').textContent = `${total} RON`;
                incarcaWishlist();

            } catch (e) {
                console.error(e);
                document.getElementById('playersContributions').textContent = "Eroare la încărcarea tabelului încasări.";
            }
        }

        // 2. Salvează plată nouă în tabelul incasari (exact coloanele din imaginea ta)
        async function salveazaPlata() {
            const jucatorId = document.getElementById('paymentPlayer').value;
            const suma = parseFloat(document.getElementById('paymentAmount').value);
            const detalii = document.getElementById('paymentDetails').value.trim() || 'Cotizatie minge';

            if(!jucatorId || isNaN(suma) || suma <= 0) {
                alert("Te rog selectează un jucător și introdu suma corectă!");
                return;
            }

            try {
                // Introduce fix pe formatul coloanelor tale: jucator_id, suma, detalii, data
                const azi = new Date().toISOString().split('T')[0];
                const { error } = await sb.from('incasari').insert([
                    {
                        jucator_id: jucatorId,
                        suma: suma,
                        detalii: detalii,
                        data: azi
                    }
                ]);

                if (error) throw error;

                // Resetăm formularul de plată
                document.getElementById('paymentAmount').value = '';
                document.getElementById('paymentDetails').value = '';
                document.getElementById('paymentPlayer').value = '';

                // Reîncărcăm lista ca să apară plata instant
                incarcaBugetSiJucatori();

            } catch(e) {
                alert("Eroare la salvarea plății: " + e.message);
            }
        }

        // 3. Încarcă cheltuielile/dorințele cu barele de progres
        async function incarcaWishlist() {
            try {
                const { data: cheltuieli, error } = await sb.from('cheltuieli').select('*');
                if (error) throw error;

                const container = document.getElementById('wishlistContainer');
                container.innerHTML = '';

                if(!cheltuieli || cheltuieli.length === 0) {
                    container.innerHTML = '<p style="color:#64748b;">Nu există produse adăugate în cheltuieli.</p>';
                    return;
                }

                cheltuieli.forEach(item => {
                    const numeProdus = item.produs || 'Produs';
                    const tinta = parseFloat(item.pret_total || 0);
                    const curent = parseFloat(item.pret_alocat || 0);
                    const prioritate = item.prioritate || 'medie';
                    
                    let procent = tinta > 0 ? Math.round((curent / tinta) * 100) : 0;
                    if(procent > 100) procent = 100;

                    const rest = tinta - curent;
                    const eComplet = procent === 100;

                    container.innerHTML += `
                        <div class="wishlist-item ${eComplet ? 'completed' : ''}">
                            <div class="item-header">
                                <div>
                                    <span class="item-name">${numeProdus}</span>
                                    <button class="delete-btn" onclick="stergeObiectiv(${item.id})">🗑️</button>
                                </div>
                                <span class="priority-badge prio-${prioritate}">${prioritate}</span>
                            </div>
                            <div class="item-finances">
                                <span>Alocat: <strong>${curent} RON</strong> din ${tinta} RON</span>
                                <span>${eComplet ? '🎉 Achiziționat!' : `Mai trebuie: ${rest} RON (${procent}%)`}</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar" style="width: ${procent}%"></div>
                            </div>
                        </div>
                    `;
                });

            } catch(e) {
                console.error(e);
                document.getElementById('wishlistContainer').textContent = "Eroare la încărcarea tabelului cheltuieli.";
            }
        }

        // 4. Salvează produs nou în cheltuieli
        async function salveazaCheltuiala() {
            const nume = document.getElementById('itemName').value.trim();
            const tinta = parseFloat(document.getElementById('itemTarget').value);
            const curent = parseFloat(document.getElementById('itemCurrent').value) || 0;
            const prioritate = document.getElementById('itemPriority').value;

            if(!nume || isNaN(tinta) || tinta <= 0) {
                alert("Te rog adaugă un nume de produs și prețul lui total!");
                return;
            }

            try {
                const { error } = await sb.from('cheltuieli').insert([
                    { 
                        produs: nume, 
                        pret_total: tinta, 
                        pret_alocat: curent, 
                        prioritate: prioritate 
                    }
                ]);
                if (error) throw error;

                document.getElementById('itemName').value = '';
                document.getElementById('itemTarget').value = '';
                document.getElementById('itemCurrent').value = '';
                
                incarcaWishlist();

            } catch(e) {
                alert("Eroare la salvare: " + e.message);
            }
        }

        // 5. Șterge produs din cheltuieli
        async function stergeObiectiv(id) {
            if(!confirm("Sigur vrei să ștergi acest produs din listă?")) return;
            try {
                const { error } = await sb.from('cheltuieli').delete().eq('id', id);
                if (error) throw error;
                incarcaWishlist();
            } catch(e) {
                alert("Eroare la ștergerea produsului.");
            }
        }

        // 6. Șterge o plată greșită din încasări
        async function stergePlata(id) {
            if(!confirm("Vrei să ștergi această înregistrare de plată?")) return;
            try {
                const { error } = await sb.from('incasari').delete().eq('id', id);
                if (error) throw error;
                incarcaBugetSiJucatori();
            } catch(e) {
                alert("Eroare la ștergerea plății.");
            }
        }

        // Pornire logică secvențială: Jucători -> Încasări & Cheltuieli
        async function init() {
            await incarcaJucatoriDropdown();
            await incarcaBugetSiJucatori();
        }

        init();
    </script>
</body>
</html>
