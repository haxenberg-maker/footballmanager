<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificator Buget & Achiziții</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f131c;
            --panel-bg: #151b26;
            --accent-gold: #f1d483;
            --border-color: #232d3f;
            --text-light: #e2e8f0;
            --success-green: #10b981;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1, h2 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Formular Adăugare Obiectiv */
        .budget-form {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .form-group input, .form-group select {
            background: #1c2433;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
        }

        .btn-add {
            background: var(--accent-gold);
            color: #0b0e14;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: #d9bd72;
        }

        /* Lista de Obiective */
        .wishlist {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .wishlist-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .priority-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .prio-mare { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .prio-medie { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
        .prio-mica { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }

        .item-finances {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        /* Container Bară de Progres */
        .progress-container {
            width: 100%;
            background: #1c2433;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #2d394e;
        }

        /* Linia care se umple */
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #cca03a 0%, var(--accent-gold) 100%);
            width: 0%; /* Se modifică din JS */
            transition: width 0.5s ease-out;
        }

        .completed .progress-bar {
            background: linear-gradient(90deg, #059669 0%, var(--success-green) 100%);
        }
        
        .delete-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            margin-left: 10px;
        }
        .delete-btn:hover { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎯 Obiective & Priorități Cumpărături</h1>

        <!-- Formular adăugare dorințe -->
        <div class="budget-form">
            <div class="form-group">
                <label for="itemName">Ce vrei să cumperi?</label>
                <input type="text" id="itemName" placeholder="Ex: Manusi">
            </div>
            <div class="form-group">
                <label for="itemTarget">Preț Necesar (RON)</label>
                <input type="number" id="itemTarget" placeholder="Ex: 300">
            </div>
            <div class="form-group">
                <label for="itemCurrent">Suma Disponibilă (RON)</label>
                <input type="number" id="itemCurrent" placeholder="Ex: 40">
            </div>
            <div class="form-group">
                <label for="itemPriority">Prioritate</label>
                <select id="itemPriority">
                    <option value="mare">Mare 🔥</option>
                    <option value="medie">Medie ⚡</option>
                    <option value="mica">Mică 💤</option>
                </select>
            </div>
            <button class="btn-add" onclick="adaugaObiectiv()">Adaugă</button>
        </div>

        <h2>📋 Stadiu Acoperire Finanțare</h2>
        <!-- Lista unde se generează barele de progres -->
        <div class="wishlist" id="wishlistContainer"></div>
    </div>

    <script>
        // Date dummy de pornire (le poți conecta ulterior la Supabase-ul tău)
        let obiective = [
            { id: 1, nume: "Mănuși", tinta: 300, curent: 40, prioritate: "mare" },
            { id: 2, nume: "Adidași sală", tinta: 450, curent: 450, prioritate: "medie" },
            { id: 3, nume: "Minge fotbal", tinta: 180, curent: 120, prioritate: "mica" }
        ];

        function randeazaObiective() {
            const container = document.getElementById('wishlistContainer');
            container.innerHTML = '';

            // Sortăm automat să apară cele cu prioritate Mare primele
            const ordinePrio = { mare: 1, medie: 2, mica: 3 };
            obiective.sort((a, b) => ordinePrio[a.prioritate] - ordinePrio[b.prioritate]);

            obiective.forEach(obj => {
                // Calcul procentaj acoperit
                let procent = obj.tinta > 0 ? Math.round((obj.curent / obj.tinta) * 100) : 0;
                if (procent > 100) procent = 100; // Să nu sară din bară dacă pui mai mulți bani
                
                const restNecesar = obj.tinta - obj.curent;
                const eComplet = procent === 100;

                container.innerHTML += `
                    <div class="wishlist-item ${eComplet ? 'completed' : ''}">
                        <div class="item-header">
                            <div>
                                <span class="item-name">${obj.nume}</span>
                                <button class="delete-btn" onclick="stergeObiectiv(${obj.id})">[șterge]</button>
                            </div>
                            <span class="priority-badge prio-${obj.prioritate}">Prio: ${obj.prioritate}</span>
                        </div>
                        <div class="item-finances">
                            <span>Acoperit: <strong>${obj.curent} RON</strong> din ${obj.tinta} RON</span>
                            <span>${eComplet ? '🎉 Strânși!' : `Mai trebuie: ${restNecesar} RON (${procent}%)`}</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${procent}%"></div>
                        </div>
                    </div>
                `;
            });
        }

        function adaugaObiectiv() {
            const nume = document.getElementById('itemName').value.trim();
            const tinta = parseFloat(document.getElementById('itemTarget').value);
            const curent = parseFloat(document.getElementById('itemCurrent').value) || 0;
            const prioritate = document.getElementById('itemPriority').value;

            if (!nume || isNaN(tinta) || tinta <= 0) {
                alert("Te rog completează numele și prețul total corect!");
                return;
            }

            const nouObiectiv = {
                id: Date.now(),
                nume: nume,
                tinta: tinta,
                curent: curent,
                prioritate: prioritate
            };

            obiective.push(nouObiectiv);
            randeazaObiective();

            // Resetăm inputurile din formular
            document.getElementById('itemName').value = '';
            document.getElementById('itemTarget').value = '';
            document.getElementById('itemCurrent').value = '';
        }

        function stergeObiectiv(id) {
            obiective = obiective.filter(x => x.id !== id);
            randeazaObiective();
        }

        // Inițializare la pornirea paginii
        randeazaObiective();
    </script>
</body>
</html>
