<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clasament Live · Bârladul pe Fugă · updated on 3rd of August </title>
<meta name="theme-color" content="#0a0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="smart-rating.js?v=20260904a"></script>
<style>
:root {
  /* surfaces */
  --bg:#0a0e14; --bg-deep:#05070a;
  --surface:#141a24; --surface-2:#1b2330; --surface-3:#212b3a;
  --line:#232c3c; --line-soft:#1b2330;
  /* ink */
  --ink:#f3f6fa; --ink-soft:#c7d0dd; --ink-dim:#8b96a8; --ink-faint:#5b6577;
  /* team colors */
  --orange:#ff8c3c; --green:#2fd66b; --black:#c9d3e0;
  /* accents */
  --accent:#5b7fff; --accent-deep:#22357a;
  --purple:#a78bfa; --purple-deep:#6d28d9;
  --gold:#ffd23f; --star:#ffd23f;
  --red:#ef4444; --red-soft:#f87171;
  --bronze:#e0995e; --silver:#cbd5e1; --gold-muted:#c9a668;
  /* legacy aliases kept so old var() refs still resolve */
  --dark:#0a0e14; --card:#141a24; --border:#232c3c;
  /* system */
  --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
  --font-display:'Bebas Neue',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
::selection{background:rgba(91,127,255,.35);color:#fff;}
body{font-family:var(--font-body);background:
    radial-gradient(720px 420px at 12% -8%, rgba(91,127,255,.10), transparent 60%),
    radial-gradient(600px 380px at 100% 0%, rgba(167,139,250,.08), transparent 55%),
    var(--bg);
  background-attachment:fixed;color:var(--ink);margin:0;padding:0;min-height:100vh;
  -webkit-font-smoothing:antialiased;letter-spacing:.1px;}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 64px;}

/* ── Floodlight glow — signature treatment for hero surfaces ── */
.glow{position:relative;isolation:isolate;}
.glow::before{content:'';position:absolute;inset:-40% -20% auto -20%;height:140%;
  background:radial-gradient(closest-side, rgba(255,255,255,.10), transparent 70%);
  pointer-events:none;z-index:0;opacity:.8;}
.glow>*{position:relative;z-index:1;}

.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px;}
.hd-title{font-family:var(--font-display);font-size:1.7rem;letter-spacing:3px;color:var(--ink);}
.hd-sub{font-size:.7rem;color:var(--ink-dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:500;}
.live-pill{display:flex;align-items:center;gap:6px;background:rgba(47,214,107,.13);border:1px solid rgba(47,214,107,.35);padding:5px 11px;border-radius:20px;flex-shrink:0;box-shadow:0 0 16px -4px rgba(47,214,107,.5);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.live-lbl{font-size:.64rem;font-weight:700;color:#4ade80;text-transform:uppercase;letter-spacing:1.2px;font-family:var(--font-mono);}
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-deep);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.loading-overlay.hidden{display:none;}
.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.78rem;color:var(--ink-dim);letter-spacing:2px;text-transform:uppercase;font-family:var(--font-mono);}
.stats-section{background:var(--surface);padding:18px;border-radius:var(--radius-lg);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset;}
.stats-section h3{font-family:var(--font-display);font-size:1.3rem;letter-spacing:3px;margin:0 0 14px;color:var(--ink);}
.lb-tab{padding:6px 12px;border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);transition:all .15s;white-space:nowrap;}
.lb-tab:hover{color:var(--ink);border-color:#334155;}
.lb-tab.active{background:rgba(167,139,250,.16);border-color:var(--purple);color:#c4b5fd;box-shadow:0 0 14px -4px rgba(167,139,250,.5);}
.lb-subtab{padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:700;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-dim);transition:all .15s;white-space:nowrap;}
.lb-subtab:hover{color:var(--ink);border-color:#334155;}
.lb-subtab.active{background:rgba(245,158,11,.14);border-color:#f59e0b;color:#fbbf24;}
.lb-period-btn{padding:5px 10px;border-radius:7px;font-size:.66rem;font-weight:600;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-faint);transition:all .15s;}
.lb-period-btn:hover{color:var(--ink);}
.lb-period-btn.active{background:rgba(201,166,104,.14);border-color:var(--gold-muted);color:#e8cd94;}
.lb-season-btn{padding:6px 12px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);transition:all .15s;white-space:nowrap;}
.lb-season-btn:hover{color:var(--ink);}
.lb-season-btn.active{background:rgba(91,127,255,.16);border-color:var(--accent);color:#b3c2ff;box-shadow:0 0 14px -4px rgba(91,127,255,.5);}
.season-banner{display:flex;align-items:center;gap:6px;font-size:.7rem;color:#c4b5fd;background:rgba(167,139,250,.09);border:1px solid rgba(167,139,250,.28);border-radius:9px;padding:8px 11px;margin-bottom:11px;}
.season-matches-toggle{width:100%;text-align:center;padding:8px;margin-top:9px;font-size:.7rem;font-weight:700;color:#c4b5fd;background:rgba(167,139,250,.07);border:1px dashed rgba(167,139,250,.3);border-radius:9px;cursor:pointer;transition:background .15s;}
.season-matches-toggle:hover{background:rgba(167,139,250,.12);}
.season-match-row{padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:.76rem;}
.season-match-date{color:var(--ink-faint);font-size:.64rem;font-family:var(--font-mono);}
.season-match-score{font-weight:700;color:var(--ink);font-family:var(--font-mono);}
.lb-more-btn{width:100%;text-align:center;padding:8px;margin-top:5px;font-size:.7rem;font-weight:700;color:var(--ink-dim);background:var(--surface-2);border:1px dashed var(--line);border-radius:9px;cursor:pointer;transition:background .15s;}
.lb-more-btn:hover{background:var(--surface-3);color:var(--ink);}
.me-card{background:linear-gradient(135deg,#1c2740,#05070a);color:#fff;border:1px solid rgba(91,127,255,.35);box-shadow:0 0 0 1px rgba(91,127,255,.08),0 8px 24px -8px rgba(91,127,255,.35);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;}
.me-card-name{font-family:var(--font-display);font-size:1.2rem;letter-spacing:1px;}
.me-card-sub{font-size:.7rem;color:rgba(255,255,255,.6);margin-top:2px;}
.me-card-rank{font-family:var(--font-display);font-size:2.1rem;color:var(--star);min-width:46px;text-align:center;text-shadow:0 0 18px rgba(255,210,63,.5);}
.footer-note{text-align:center;font-size:.66rem;color:var(--ink-faint);margin-top:20px;letter-spacing:.5px;}
.row-highlight{outline:2px solid var(--accent);outline-offset:-1px;}
.streak-banner-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:480px){.streak-banner-grid{grid-template-columns:1fr;}}
.streak-banner-card{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:11px;}
.streak-banner-card.hot{background:linear-gradient(135deg,rgba(255,140,60,.14),rgba(239,68,68,.08));border:1px solid rgba(255,140,60,.35);}
.streak-banner-card.goal{background:linear-gradient(135deg,rgba(52,211,153,.14),rgba(134,239,172,.08));border:1px solid rgba(52,211,153,.32);}
.streak-banner-icon{font-size:1.5rem;line-height:1;}
.streak-banner-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-dim);font-weight:600;}
.streak-banner-name{font-family:var(--font-display);font-size:1.05rem;letter-spacing:1px;color:var(--ink);}
.streak-banner-sub{font-size:.66rem;color:var(--ink-dim);}
.milestone-row{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;}
.milestone-badge{font-size:.6rem;padding:2px 7px;border-radius:6px;background:rgba(255,210,63,.14);border:1px solid rgba(255,210,63,.38);color:#ffd23f;white-space:nowrap;font-weight:700;}
.week-cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px;}
@media(max-width:640px){.week-cards-grid{grid-template-columns:1fr;}}
.week-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:13px 15px;}
.week-card-title{font-family:var(--font-display);font-size:.9rem;letter-spacing:1.5px;color:var(--ink-dim);margin-bottom:9px;}
.week-player-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:.8rem;}
.week-player-row:last-child{border-bottom:none;}
.week-player-rank{font-family:var(--font-display);font-size:.9rem;color:var(--gold-muted);min-width:16px;flex-shrink:0;}
.week-player-name{flex:1;min-width:0;font-weight:600;color:var(--ink);white-space:normal;word-break:break-word;line-height:1.3;}
.week-player-sub{flex-shrink:0;font-size:.66rem;color:var(--ink-dim);font-family:var(--font-mono);white-space:nowrap;align-self:center;}
.derby-score{font-family:var(--font-display);font-size:1.9rem;letter-spacing:2px;text-align:center;margin:4px 0;color:var(--ink);}
.derby-teams{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.derby-summary{font-size:.76rem;color:var(--ink-soft);margin-top:6px;text-align:center;line-height:1.5;}
.derby-date{text-align:center;font-size:.62rem;color:var(--ink-faint);margin-top:2px;font-family:var(--font-mono);}
.rules-empty{font-size:.8rem;color:var(--ink-faint);font-style:italic;}
.rule-item{border-bottom:1px solid var(--line-soft);}
.rule-item:last-child{border-bottom:none;}
.rule-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;cursor:pointer;user-select:none;}
.rule-item-head:hover .rule-item-title{color:var(--ink);}
.rule-item-title-wrap{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0;}
.rule-item-num{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-faint);flex-shrink:0;}
.rule-item-title{font-weight:600;font-size:.79rem;color:var(--ink-soft);flex:1;min-width:0;word-break:break-word;transition:color .15s;line-height:1.35;}
.rule-item-chevron{font-size:.6rem;color:var(--ink-faint);transition:transform .2s;flex-shrink:0;}
.rule-item.open .rule-item-chevron{transform:rotate(180deg);}
.rule-item.open .rule-item-title{color:var(--ink);}
.rule-item-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.rule-item.open .rule-item-body{max-height:600px;}
.rule-item-desc{font-size:.76rem;line-height:1.5;color:var(--ink-dim);padding:0 2px 8px;white-space:normal;}
.rule-item-meta{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 9px;}
.rule-item-loc{font-size:.62rem;font-family:var(--font-mono);color:var(--ink-dim);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;}
.rule-item-sanction{font-size:.62rem;font-family:var(--font-mono);color:#ff9b9b;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);border-radius:6px;padding:2px 7px;}
.rules-toggle-all{display:block;width:100%;margin-top:8px;padding:7px;background:none;border:1px dashed var(--line);border-radius:8px;color:var(--ink-dim);font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--font-mono);letter-spacing:.5px;}
.rules-toggle-all:hover{color:var(--ink);border-color:var(--ink-faint);}

/* ── 🏅 Cel mai bun jucător — bandă compactă (games+winrate+goluri+titluri) ── */
.best-player-strip{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,rgba(255,210,63,.09),rgba(167,139,250,.06));border:1px solid rgba(255,210,63,.28);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:16px;}
.best-player-icon{font-size:1.5rem;line-height:1;flex-shrink:0;}
.best-player-body{flex-shrink:0;}
.best-player-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);font-weight:600;}
.best-player-name{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.5px;color:var(--ink);}
.best-player-stats{flex:1;display:flex;justify-content:flex-end;gap:11px;flex-wrap:wrap;font-family:var(--font-mono);font-size:.72rem;color:#ffd23f;font-weight:700;}
@media(max-width:420px){.best-player-strip{flex-wrap:wrap;}.best-player-stats{justify-content:flex-start;width:100%;margin-top:2px;}}

/* ── Tab de pagină: Clasament / Meciuri ── */
.page-tabs{display:flex;gap:7px;margin-bottom:14px;}
.page-tab{flex:1;padding:10px 10px;border-radius:11px;font-family:var(--font-display);font-size:.9rem;letter-spacing:1.5px;cursor:pointer;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);transition:all .15s;}
.page-tab.active{background:linear-gradient(135deg,#5b7fff,#6d28d9);border-color:#5b7fff;color:#fff;box-shadow:0 4px 18px -6px rgba(91,127,255,.6);}

/* ── Meciuri: filtre ── */
.match-filters{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.match-search-wrap{position:relative;}
.match-search-wrap input{width:100%;box-sizing:border-box;padding:10px 34px 10px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.84rem;color:var(--ink);font-family:var(--font-body);}
.match-search-wrap input::placeholder{color:var(--ink-faint);}
.match-search-wrap input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,127,255,.18);}
.match-search-clear{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--ink-dim);font-size:.95rem;cursor:pointer;padding:4px 6px;line-height:1;}
.match-team-filters{display:flex;gap:6px;flex-wrap:wrap;}
.match-team-btn{padding:6px 12px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);transition:all .15s;}
.match-team-btn.active{background:rgba(91,127,255,.16);border-color:var(--accent);color:#b3c2ff;}

/* ── Card de meci / sesiune ── */
.match-card{border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 20px -10px rgba(0,0,0,.6);}
.match-card-hero{padding:16px 18px 14px;color:#fff;position:relative;overflow:hidden;}
.match-card-hero .mc-date{font-family:var(--font-display);font-size:1.55rem;letter-spacing:1.5px;line-height:1.15;}
.match-card-hero .mc-title{font-size:.7rem;opacity:.9;text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:600;}
.match-card-hero .mc-sub{font-size:.72rem;opacity:.85;margin-top:3px;}
.mc-details-toggle{width:100%;text-align:center;padding:9px;margin-top:2px;font-size:.72rem;font-weight:700;color:#c4b5fd;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.28);border-radius:9px;cursor:pointer;transition:background .15s;}
.mc-details-toggle:hover{background:rgba(167,139,250,.14);}
.match-card-body{padding:14px 18px 16px;}
.mc-story{font-size:.76rem;color:var(--ink-soft);line-height:1.7;margin-bottom:11px;}
.mc-standing{font-size:.76rem;margin-bottom:10px;line-height:1.9;}
.mc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.mc-badge{padding:5px 11px;border-radius:8px;font-size:.72rem;font-weight:700;white-space:nowrap;}
.mc-timeline{display:flex;flex-direction:column;gap:0;margin-bottom:4px;}
.mc-timeline-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;transition:background .12s;border-radius:6px;}
.mc-timeline-item:last-child{border-bottom:none;}
.mc-timeline-item:hover{background:var(--surface-2);}
.mc-timeline-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;box-shadow:0 0 6px currentColor;}
.mc-timeline-content{flex:1;min-width:0;}
.mc-timeline-teams{font-size:.74rem;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.4px;}
.mc-timeline-score{font-size:.7rem;color:var(--ink-dim);font-family:var(--font-mono);}
.mc-timeline-scorer{font-size:.7rem;color:#c4b5fd;margin-top:2px;}
.match-empty{text-align:center;padding:34px 10px;color:var(--ink-dim);font-size:.82rem;}

/* ── Player Profile ── */
.pp-back{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--ink-dim);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;margin-bottom:12px;transition:all .15s;}
.pp-back:hover{color:var(--ink);border-color:#334155;}
.pp-header{background:linear-gradient(135deg,#1c2740,#05070a);border:1px solid rgba(91,127,255,.35);box-shadow:0 0 0 1px rgba(91,127,255,.08),0 8px 24px -8px rgba(91,127,255,.35);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.pp-num{font-family:var(--font-display);font-size:1.1rem;color:var(--ink-faint);letter-spacing:1px;}
.pp-name{font-family:var(--font-display);font-size:1.9rem;letter-spacing:2px;color:var(--ink);line-height:1;margin:2px 0 4px;}
.pp-pos{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:1px;padding:2px 9px;border-radius:6px;background:rgba(91,127,255,.14);color:#b3c2ff;border:1px solid rgba(91,127,255,.3);}
.pp-rating-block{text-align:right;}
.pp-rating-val{font-family:var(--font-display);font-size:2.4rem;line-height:1;color:var(--accent);}
.pp-rating-lbl{font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);}
.pp-trend{font-family:var(--font-mono);font-size:.78rem;font-weight:700;margin-top:2px;}
.pp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
@media(max-width:560px){.pp-grid{grid-template-columns:repeat(2,1fr);}}
.pp-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:11px 10px;text-align:center;}
.pp-stat-val{font-family:var(--font-mono);font-weight:700;font-size:1.05rem;color:var(--ink);}
.pp-stat-lbl{font-size:.6rem;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;}
.pp-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media(max-width:560px){.pp-row2{grid-template-columns:1fr;}}
.pp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;}
.pp-card-lbl{font-size:.64rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.pp-card-name{font-weight:800;font-size:.98rem;color:var(--ink);margin-bottom:2px;}
.pp-card-sub{font-size:.72rem;color:var(--ink-dim);font-family:var(--font-mono);}
.pp-empty{color:var(--ink-faint);font-size:.76rem;text-align:center;padding:10px 0;}
.pp-section-title{font-family:var(--font-display);font-size:1.1rem;letter-spacing:2px;color:var(--ink);margin:0 0 10px;}
.pp-chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.pp-chip{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-align:center;min-width:84px;cursor:pointer;transition:border-color .15s,transform .1s;}
.pp-chip:hover{border-color:var(--accent);}
.pp-chip:active{transform:scale(.96);}
.pp-chip-emoji{font-size:1.05rem;}

function parseDateToObj(dateStr) {
    if (!dateStr || dateStr === '—') return new Date(0);
    if (dateStr.includes('.')) {
        const [d,m,y] = dateStr.split('.');
        return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T12:00:00`);
    }
    return new Date(dateStr);
}

function getRowTeamNames(h){
    const names = [];
    if ((h.orangePlayers||[]).length) names.push('Portocaliu');
    if ((h.greenPlayers ||[]).length) names.push('Verde');
    if ((h.blackPlayers ||[]).length) names.push('Negru');
    return names;
}

// Numele echipei care a câștigat o TURĂ (rând din roundsDetail) a unei perechi
// dintr-o sesiune 3 echipe. Folosește loser_name (setat pentru orice tură cu
// un câștigător clar) și penalty_winner_name (pentru turele decise la penalty).
// Returnează null dacă tura a fost egală și nu s-a jucat penalty.
function getRoundWinnerName(h, r) {
    if (!r) return null;
    if (r.end_reason === 'penalty' && r.penalty_winner_name) return r.penalty_winner_name;
    if (r.loser_name) {
        const teams = getRowTeamNames(h);
        return teams.find(t => t !== r.loser_name) || null;
    }
    return null;
}

function getWinnerSideFromScore(h) {
    const w = (h.winner||'').toLowerCase().trim();
    if (!w || w === 'egal') return 'draw';
    if (w.includes('portocaliu') || w.includes('orange')) return 'orange';
    if (w.includes('verde') || w.includes('green')) return 'green';
    if (w.includes('negru') || w.includes('black')) return 'black';
    const parts = (h.score||'').split(':').map(s => parseInt(s.trim()));
    if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        if (parts[0] > parts[1]) return 'orange';
        if (parts[1] > parts[0]) return 'green';
        return 'draw';
    }
    return null;
}

// Grupează perechile de 3 echipe salvate în aceeași zi, la <10 min una de alta,
// într-o singură "sesiune" — la fel ca în aplicația principală.
function groupHistoryForDisplay(sorted){
    const SESSION_GAP_MS = 10*60*1000;
    const items = [];
    let i = 0;
    while (i < sorted.length) {
        const h = sorted[i];
        const is3Team = Array.isArray(h.roundsDetail) && h.roundsDetail.length > 0;
        if (!is3Team) { items.push({type:'single', rows:[h]}); i++; continue; }
        const group = [h];
        let j = i+1;
        while (j < sorted.length) {
            const next = sorted[j];
            const nextIs3 = Array.isArray(next.roundsDetail) && next.roundsDetail.length > 0;
            if (!nextIs3 || next.date !== h.date) break;
            const tA = group[group.length-1].createdAt ? new Date(group[group.length-1].createdAt).getTime() : null;
            const tB = next.createdAt ? new Date(next.createdAt).getTime() : null;
            if (tA===null || tB===null || Math.abs(tA-tB) > SESSION_GAP_MS) break;
            group.push(next);
            j++;
        }
        items.push({type:'session', rows: group});
        i = j;
    }
    return items;
}

// Determină câștigătorul POTM pentru un set de rânduri (o sesiune întreagă
// sau un singur meci) — suprascrierea manuală (pe orice pereche) are
// prioritate, altfel câștigă cel cu cele mai multe voturi adunate din toate
// rândurile date. Reutilizabil și în clasamentul de Premii (unde se
// calculează pe TOT istoricul, nu doar o sesiune).
function computePotmWinnerForRows(rows){
    const votes = {};
    let manualId = null;
    rows.forEach(h => {
        if (manualId == null && h.manualPotmId != null) manualId = h.manualPotmId;
        Object.entries(h.potmVoteCounts||{}).forEach(([pid,cnt]) => {
            votes[pid] = (votes[pid]||0) + cnt;
        });
    });
    let winnerId = manualId;
    let source = winnerId != null ? 'manual' : null;
    if (winnerId == null) {
        const sorted = Object.entries(votes).sort((a,b)=>b[1]-a[1]);
        if (sorted.length) { winnerId = parseInt(sorted[0][0]); source = 'voted'; }
    }
    return { winnerId, source, votes };
}

// "MVP din meciuri" — NU voturile colegilor (mvp_votes), ci golgheterul cu
// cele mai multe minute jucate: goluri + asisturi + minute/90, calculat pe o
// sesiune întreagă (chrono = rows în ordine cronologică) sau pe un meci simplu.
// Reutilizat de renderSessionCard (badge-ul ⭐ MVP) și de clasamentul de
// Premii (numărătoarea totală).
function computeSessionMvpWinner(chrono){
    const manualId = chrono.find(h=>h.manualMvpId!=null)?.manualMvpId ?? null;
    // cleared = "NICIUN MVP la acest meci" (coloană separată mvp_cleared, setată
    // explicit din setari.html) — diferit de manualId==null ("fără suprascriere,
    // folosește calculul"). Înainte era codat ca manualMvpId=-1 direct în
    // manual_mvp_player_id (foreign key către players.id) — Postgres respingea
    // acel update (id -1 nu există), iar eroarea nu era verificată niciodată, deci
    // ștergerea manuală a MVP-ului "reușea" doar în UI, nu și în DB, și la refresh
    // MVP-ul calculat automat reapărea (și în clasamentul de Premii).
    if (chrono.some(h=>h.mvpCleared)) return null;

    const totalGoals = {};
    chrono.forEach(h => { Object.entries(h.playerGoals||{}).forEach(([n,g]) => { totalGoals[n]=(totalGoals[n]||0)+g; }); });

    const totalAssists = {};
    chrono.forEach(h => { Object.entries(h.playerAssists||{}).forEach(([n,a]) => { totalAssists[n]=(totalAssists[n]||0)+a; }); });

    const totalSeconds = {};
    chrono.forEach(h => {
        const rowSeconds = (h.roundsDetail||[]).reduce((s,r)=>s+(r.duration_sec||0),0);
        const playersInRow = new Set([...(h.orangePlayers||[]), ...(h.greenPlayers||[]), ...(h.blackPlayers||[])]);
        playersInRow.forEach(n => { totalSeconds[n] = (totalSeconds[n]||0) + rowSeconds; });
    });

    const allNames = new Set([...Object.keys(totalGoals), ...Object.keys(totalAssists), ...Object.keys(totalSeconds)]);
    const candidates = [...allNames].map(name => {
        const goals = totalGoals[name] || 0;
        const assists = totalAssists[name] || 0;
        const minutes = Math.round((totalSeconds[name]||0) / 60);
        return { name, goals, assists, minutes, score: goals + assists + minutes/90 };
    }).sort((a,b) => b.score - a.score);

    // Suprascrierea manuală (setată din setari.html) are prioritate — dacă
    // admin a ales explicit pe cineva, ăla e MVP-ul, indiferent de calcul.
    if (manualId != null) {
        const p = db.players.find(x=>x.id===manualId);
        if (p) {
            const existing = candidates.find(c=>c.name===p.name);
            return existing || { name: p.name, goals: 0, assists: 0, minutes: 0, score: 0 };
        }
    }
    return candidates[0] || null;
}

// Markup comun (scoruri per echipă + golgheter) pentru o pereche
function renderPairBodyPublic(h, opts){
    const showHattrick = opts?.showHattrick !== false; // implicit true — vezi apelul din openMatchDetail (sesiune 3 echipe)
    const hasBlack = (h.blackPlayers||[]).length > 0;
    const tg = h.teamGoals || { orange:0, green:0, black:0 };
    const penG = { orange:0, green:0, black:0 };
    if (Array.isArray(h.roundsDetail)) {
        h.roundsDetail.forEach(r=>{
            if (Array.isArray(r.penalty_shots)) {
                r.penalty_shots.forEach(s=>{
                    if (s.state==='goal' && penG[s.team]!==undefined) penG[s.team]++;
                });
            }
        });
    }
    const makeTeamScore = (names, teamKey, color, label) => {
        if (!names?.length) return '';
        const g = tg[teamKey] || 0;
        const pen = penG[teamKey] || 0;
        const isWinner = h.winner?.toLowerCase().includes(label.toLowerCase());
        return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;">
            <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block;"></span>
            <span style="font-weight:700;font-size:.82rem;color:${isWinner?color:'#f3f6fa'};">${label}</span>
            <span style="font-size:.72rem;color:#8b96a8;">(${names.length} juc.)</span>
            <span style="font-family:'Bebas Neue',sans-serif;font-size:1rem;margin-left:auto;color:${isWinner?color:'#f3f6fa'};min-width:18px;text-align:right;">${g}${pen>0?` <span style="font-family:'Inter',sans-serif;font-size:.62rem;color:#8b96a8;">(pen ${pen})</span>`:''}</span>
        </div>`;
    };
    const teamsHTML = [
        makeTeamScore(h.orangePlayers, 'orange', teamColorsPublic.orange, 'Portocaliu'),
        makeTeamScore(h.greenPlayers,  'green',  teamColorsPublic.green,  'Verde'),
        hasBlack ? makeTeamScore(h.blackPlayers, 'black', teamColorsPublic.black, 'Negru') : '',
    ].filter(Boolean).join('<div style="height:1px;background:#262f3f;margin:1px 0;"></div>');
    const mvpWinner = computeSessionMvpWinner([h]); // override-aware — la 2 echipe, goluri+minute e echivalent cu goluri (minute egale), dar respectă suprascrierea manuală
    const hattrick = showHattrick && mvpWinner && mvpWinner.goals >= 3;
    // Mod 2 echipe (showHattrick=false): fără mențiunea/logica de hat-trick —
    // doar un ⭐ MVP simplu, goluri afișate simplu (⚽/⚽×N) oriunde altundeva.
    const topScorerHTML = mvpWinner
        ? `<div class="mc-badge" style="background:${hattrick?'rgba(167,139,250,.1)':'rgba(52,211,153,.1)'};border:1px solid ${hattrick?'rgba(167,139,250,.35)':'rgba(52,211,153,.3)'};color:${hattrick?'#a78bfa':'#34d399'};">${hattrick?'🎩 Hattrick':'⭐ MVP'}: <b>${mvpWinner.name}</b> ${mvpWinner.goals} gol${mvpWinner.goals!==1?'uri':''}${hattrick?' <span style="color:#a78bfa;font-weight:700;">HATTRICK!</span>':''}</div>`
        : '';
    const potmHTML = h.potmWinnerName
        ? `<div class="mc-badge" style="background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);color:#eab308;">⭐ POTM: <b>${h.potmWinnerName}</b>${h.potmSource==='voted' ? ` <span style="color:#8b96a8;font-weight:400;">(${(h.potmVoteCounts[String(h.potmWinnerId)]||0)} voturi)</span>` : ` <span style="color:#8b96a8;font-weight:400;">(setat manual)</span>`}</div>`
        : '';
    return { teamsHTML, topScorerHTML, potmHTML, hattrick };
}

// Extras din openMatchDetail ca să poată fi reutilizat și de cardul inline
// (renderSingleMatchCard) — tabelă în oglindă + listă cronologică de goluri +
// timp jucat, pentru un meci simplu (2 echipe, fără ture/rounds_detail).
function buildTwoTeamMatchDetails(h){
    const teamHex = (col) => col==='orange'?teamColorsPublic.orange:col==='green'?teamColorsPublic.green:teamColorsPublic.black;

    let timeHtml = '';
    const totalSec = (h.startedAt && h.endedAt) ? Math.max(0, Math.round((new Date(h.endedAt)-new Date(h.startedAt))/1000)) : null;
    if (totalSec != null) {
        const mm = Math.floor(totalSec/60), ss = totalSec%60;
        timeHtml = `⏱ Timp jucat: <b style="color:#f3f6fa;">${mm}:${String(ss).padStart(2,'0')}</b> (ambele echipe)`;
    }

    // ── Tabelă în oglindă: echipa A aliniată dreapta / echipa B stânga,
    // convergând spre centru. Rating = OVR curent (smart-rating.js). Fără
    // hattrick — goluri afișate simplu (⚽/⚽×N). MVP 🏆/POTM ⭐ inline,
    // lângă jucătorul care le-a primit la ACEST meci specific.
    const mirrorGoalsByPlayer = {};
    const ensureMP = n => mirrorGoalsByPlayer[n] || (mirrorGoalsByPlayer[n] = {goals:0, assists:0});
    (h.goalsList||[]).forEach(g=>{
        if (g.is_penalty) return;
        ensureMP(g.player_name).goals++;
        if (g.assist_name) ensureMP(g.assist_name).assists++;
    });
    const mvpWinnerMirror = computeSessionMvpWinner([h]);
    const mvpNameMirror = mvpWinnerMirror ? mvpWinnerMirror.name : null;
    const potmNameMirror = h.potmWinnerName || null;
    const sidesMirror = [];
    if (h.orangePlayers?.length) sidesMirror.push({label:'Portocaliu', color:teamColorsPublic.orange, players:h.orangePlayers, goals:(h.teamGoals&&h.teamGoals.orange)||0});
    if (h.greenPlayers?.length)  sidesMirror.push({label:'Verde',      color:teamColorsPublic.green,  players:h.greenPlayers,  goals:(h.teamGoals&&h.teamGoals.green)||0});
    if (h.blackPlayers?.length)  sidesMirror.push({label:'Negru',      color:teamColorsPublic.black,  players:h.blackPlayers,  goals:(h.teamGoals&&h.teamGoals.black)||0});
    const [sideAMirror, sideBMirror] = sidesMirror;
    const renderMirrorSide = (side, align) => {
        if (!side || !side.players?.length) return '<div style="font-size:.72rem;color:#5b6577;">—</div>';
        return side.players.map(n=>{
            const gd = mirrorGoalsByPlayer[n];
            const pl = db.players.find(x=>x.name===n);
            const ratingHtml = pl ? `<span style="flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:.7rem;color:#a78bfa;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);border-radius:5px;padding:0 4px;">${getSmartRating(pl)}</span>` : '';
            const statsParts = [];
            if (gd?.goals > 0) statsParts.push(`⚽${gd.goals>1?'×'+gd.goals:''}`);
            if (gd?.assists > 0) statsParts.push(`🅰️${gd.assists>1?'×'+gd.assists:''}`);
            const statsHtml = statsParts.length ? `<span style="flex-shrink:0;font-size:.68rem;color:#8b96a8;">${statsParts.join(' ')}</span>` : '';
            const mvpBadge = n === mvpNameMirror ? '<span title="MVP" style="flex-shrink:0;">🏆</span>' : '';
            const potmBadge = n === potmNameMirror ? '<span title="POTM" style="flex-shrink:0;">⭐</span>' : '';
            const nameHtml = `<span title="${n}" style="font-weight:700;color:#f3f6fa;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${n}</span>`;
            const badges = mvpBadge + potmBadge;
            const rowStyle = 'display:flex;align-items:center;gap:4px;padding:3px 0;min-width:0;'
                + (align==='right' ? 'justify-content:flex-end;' : 'justify-content:flex-start;');
            return align==='right'
                ? `<div style="${rowStyle}">${badges}${statsHtml}${ratingHtml}${nameHtml}</div>`
                : `<div style="${rowStyle}">${nameHtml}${ratingHtml}${statsHtml}${badges}</div>`;
        }).join('');
    };
    const mirrorHtml = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
        <div style="flex:1;text-align:right;font-weight:700;font-size:.82rem;color:${sideAMirror?.color||'#f3f6fa'};">${sideAMirror?.label||''}</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#f3f6fa;white-space:nowrap;">${sideAMirror?.goals??0} - ${sideBMirror?.goals??0}</div>
        <div style="flex:1;text-align:left;font-weight:700;font-size:.82rem;color:${sideBMirror?.color||'#f3f6fa'};">${sideBMirror?.label||''}</div>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;">
        <div style="background:#141a24;border-radius:8px;padding:6px 8px;min-width:0;overflow:hidden;">${renderMirrorSide(sideAMirror,'right')}</div>
        <div style="width:1px;background:#262f3f;"></div>
        <div style="background:#141a24;border-radius:8px;padding:6px 8px;min-width:0;overflow:hidden;">${renderMirrorSide(sideBMirror,'left')}</div>
    </div>`;

    const normalGoals = (h.goalsList||[]).filter(g=>!g.is_penalty).sort((a,b)=>(a.minute??999)-(b.minute??999));
    const goalsHtml = normalGoals.length
        ? normalGoals.map(g=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1b2330;font-size:.72rem;">
            <span style="color:${teamHex(g.team)};font-weight:700;">⚽ ${g.player_name}${g.assist_name ? ` <span style="color:#60a5fa;font-weight:500;">(${g.assist_name} 🅰️)</span>` : ''}</span>
            <span style="color:#8b96a8;">${g.minute!=null?`min ${g.minute}`:''}</span>
        </div>`).join('')
        : `<div style="font-size:.7rem;color:#5b6577;padding:4px 0;">Niciun gol înregistrat.</div>`;
    const listHtml = `<div style="font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:#8b96a8;margin-bottom:4px;">⚽ Goluri</div>${goalsHtml}`;

    return { mirrorHtml, listHtml, timeHtml };
}

// Card pentru un meci simplu (2 echipe)
function renderSingleMatchCard(h){
    const _ws = getWinnerSideFromScore(h);
    const winColor = _ws === 'orange' ? teamColorsPublic.orange
                   : _ws === 'green'  ? teamColorsPublic.green
                   : _ws === 'black'  ? teamColorsPublic.black
                   : '#8b96a8';

    const { mirrorHtml, listHtml, timeHtml } = buildTwoTeamMatchDetails(h);
    const detailsDomId = 'matchDetails_' + String(h._dbId||Math.random()).replace(/[^a-zA-Z0-9]/g,'');
    const timeDomId = 'matchTime_' + String(h._dbId||Math.random()).replace(/[^a-zA-Z0-9]/g,'');

            <div class="mc-date">${h.date||'—'}</div>
            <div class="mc-title">🏆 ${h.winner||'Egal'} a câștigat · ${h.score||'—'}${h.imbalanced?' · ⚠️ dezechilibru':''}</div>
        </div>
        <div class="match-card-body">
            ${badgesHTML}
            <button class="mc-details-toggle" onclick="toggleSessionDetails('${detailsDomId}', this)">▼ Afișează detalii</button>
            <div id="${detailsDomId}" style="display:none;margin-top:10px;">
                <div style="background:#1b2330;border-radius:9px;padding:9px 11px;border:1px solid #262f3f;margin-bottom:8px;">${mirrorHtml}</div>
                <button onclick="event.stopPropagation();toggleSessionDetails('${timeDomId}', this, '▼ Afișează timpii','▲ Ascunde timpii')" style="width:100%;margin-top:4px;padding:8px;border-radius:8px;background:#1b2330;border:1px dashed #262f3f;color:#8b96a8;font-size:.7rem;font-weight:700;cursor:pointer;">▼ Afișează timpii</button>
                <div id="${timeDomId}" style="display:none;margin-top:8px;">

                    ${timeHtml ? `<div style="background:#1b2330;border-radius:8px;padding:8px 10px;border:1px solid #262f3f;margin-top:8px;">${timeHtml}</div>` : ''}
                </div>
            </div>
        </div>
    </div>`;
}

// Card de sesiune 3 echipe — golgheter total, MVP (goluri + minute), penalty, hattrick-uri,
// poveste cronologică, plus fiecare pereche individuală ca sub-secțiune expandabilă.
function renderSessionCard(rows){
    const chrono = [...rows].reverse();
    const first = chrono[0];

    const totalGoals = {};
    chrono.forEach(h => { Object.entries(h.playerGoals||{}).forEach(([n,g]) => { totalGoals[n]=(totalGoals[n]||0)+g; }); });

    const totalSeconds = {};
    chrono.forEach(h => {
        const rowSeconds = (h.roundsDetail||[]).reduce((s,r)=>s+(r.duration_sec||0),0);
        // IMPORTANT: o pereche poate fi Portocaliu-Verde, Portocaliu-Negru SAU
        // Verde-Negru — deci trebuie incluse toate cele 3 liste (cea a echipei
        // care NU joacă în perechea asta e oricum goală). Includerea doar a
        // orange+green lăsa afară minutele jucătorilor de pe Negru ori de câte
        // ori Negru era una din cele 2 echipe active ale perechii.
        const playersInRow = new Set([...(h.orangePlayers||[]), ...(h.greenPlayers||[]), ...(h.blackPlayers||[])]);
        playersInRow.forEach(n => { totalSeconds[n] = (totalSeconds[n]||0) + rowSeconds; });
    });

    const allNames = new Set([...Object.keys(totalGoals), ...Object.keys(totalSeconds)]);
    const sessionTop = computeSessionMvpWinner(chrono); // { name, goals, minutes, score } | null

    const totalPenGoals = {};
    chrono.forEach(h => { Object.entries(h.playerPenaltyGoals||{}).forEach(([n,g]) => { totalPenGoals[n]=(totalPenGoals[n]||0)+g; }); });
    const totalPenSorted = Object.entries(totalPenGoals).sort((a,b)=>b[1]-a[1]);
    const sessionPenTop = totalPenSorted[0] ? {name:totalPenSorted[0][0], goals:totalPenSorted[0][1]} : null;

    // ── ⭐ POTM pe toată sesiunea (nu per pereche) ──────────────────────────
    // Manual override (dacă vreun admin l-a setat pe oricare din perechile
    // sesiunii) are prioritate; altfel, adunăm voturile din TOATE perechile
    // sesiunii (fiecare h.potmVoteCounts vine dintr-un match_id diferit) și
    // câștigă cel cu cele mai multe voturi în total, pe toată sesiunea.
    const { winnerId: sessionPotmWinnerId, source: sessionPotmSource, votes: sessionPotmVotes } = computePotmWinnerForRows(chrono);
    const sessionPotmPlayer = sessionPotmWinnerId != null ? db.players.find(p=>p.id==sessionPotmWinnerId) : null;

    const hattricks = [];
    chrono.forEach(h => { if (h.topScorer && h.topScorer.goals >= 3) hattricks.push({ name: h.topScorer.name, goals: h.topScorer.goals, teams: getRowTeamNames(h) }); });

    const teamPlayed = {}, teamWon = {}, teamRoundsWon = {};
    chrono.forEach(h => {
        getRowTeamNames(h).forEach(t => { teamPlayed[t]=(teamPlayed[t]||0)+1; });
        if (h.winner) teamWon[h.winner]=(teamWon[h.winner]||0)+1;
        (h.roundsDetail||[]).forEach(r => {
            const rw = getRoundWinnerName(h, r);
            if (rw) teamRoundsWon[rw] = (teamRoundsWon[rw]||0) + 1;
        });
    });
    const standingColor = { Portocaliu: teamColorsPublic.orange, Verde: teamColorsPublic.green, Negru: teamColorsPublic.black };
    const standingHTML = Object.keys(teamPlayed).map(t =>
        `<span style="color:${standingColor[t]||'#f3f6fa'};font-weight:700;">${t}</span> <span style="color:#8b96a8;">${teamWon[t]||0}/${teamPlayed[t]}</span><span style="color:#5b6577;font-size:.82em;"> (${teamRoundsWon[t]||0} ture)</span>`
    ).join('<span style="color:#3a4759;margin:0 6px;">·</span>');

    // ── ⏱ Timp pe teren, per echipă (ca la Live → 📊 Stats) ──────────────
    const teamSeconds = {};
    chrono.forEach(h => {
        const rowSeconds = (h.roundsDetail||[]).reduce((s,r)=>s+(r.duration_sec||0),0);
        getRowTeamNames(h).forEach(t => { teamSeconds[t] = (teamSeconds[t]||0) + rowSeconds; });
    });
    const teamTimeList = Object.entries(teamSeconds)
        .map(([name,sec]) => ({ name, sec, hex: standingColor[name] || '#f3f6fa' }))
        .sort((a,b) => b.sec - a.sec);
    const maxTeamSec = teamTimeList.length ? teamTimeList[0].sec : 1;
    const teamTimeHtml = teamTimeList.map((t,i) => {
        const mm = Math.floor(t.sec/60), ss = t.sec%60;
        const pct = maxTeamSec>0 ? Math.round((t.sec/maxTeamSec)*100) : 0;
        return `<div style="margin-bottom:7px;">
            <div style="display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;margin-bottom:2px;">
                <span style="color:${t.hex};">${i===0?'👑 ':''}${t.name}</span>
                <span style="color:#f3f6fa;">${mm}:${String(ss).padStart(2,'0')}</span>
            </div>
            <div style="background:#1b2330;border-radius:6px;height:7px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${t.hex};"></div></div>
        </div>`;
    }).join('');

    // ── ⚽ Golgheteri pe toată sesiunea (nu doar MVP-ul, tot clasamentul) ──
    const playerTeamName = {};
    chrono.forEach(h => {
        (h.orangePlayers||[]).forEach(n=>{ playerTeamName[n]='Portocaliu'; });
        (h.greenPlayers ||[]).forEach(n=>{ playerTeamName[n]='Verde'; });
        (h.blackPlayers ||[]).forEach(n=>{ playerTeamName[n]='Negru'; });
    });
    // Sortare: mai întâi goluri, apoi (la egalitate) minutele jucate — evită
    // ordinea arbitrară când doi jucători au același număr de goluri.
    const allPlayerNames = new Set([...Object.keys(playerTeamName), ...Object.keys(totalGoals)]);
    const allScorersList = [...allPlayerNames].map(name => ({
        name,
        goals: totalGoals[name] || 0,
        minutes: Math.round((totalSeconds[name]||0) / 60),
        team: playerTeamName[name],
    })).sort((a,b) => b.goals - a.goals || b.minutes - a.minutes || a.name.localeCompare(b.name));
    const scoringPlayersList = allScorersList.filter(s => s.goals > 0); // fără cei cu 0 goluri
    const topScorersList  = scoringPlayersList.slice(0, 5);
    const restScorersList = scoringPlayersList.slice(topScorersList.length); // restul marcatorilor (tot cu goluri > 0), pentru "Vezi mai mult"
    const scorerRowHtml = (s,i) => `<div style="display:flex;align-items:center;gap:7px;padding:3px 0;font-size:.74rem;">
            <span style="width:7px;height:7px;border-radius:50%;background:${standingColor[s.team]||'#f3f6fa'};flex-shrink:0;"></span>
            <span style="flex:1;font-weight:700;color:#f3f6fa;">${i===0?'🥇 ':''}${s.name}</span>
            <span style="font-size:.64rem;color:#8b96a8;margin-right:2px;">${s.minutes} min</span>
            <span style="font-family:'Bebas Neue',sans-serif;font-size:1rem;color:#f3f6fa;">${s.goals}⚽</span>
        </div>`;
    const topScorersHtml = topScorersList.map((s,i) => scorerRowHtml(s,i)).join('');
    const restScorersHtml = restScorersList.map((s,i) => scorerRowHtml(s,i+topScorersList.length)).join('');
    const scorersDomId = 'sessScorers_' + String(first._dbId||Math.random()).replace(/[^a-zA-Z0-9]/g,'');

    // Timeline vizual — un rând per pereche, în ordine cronologică
    const timelineHTML = chrono.map((h,idx) => {
        const [tA,tB] = getRowTeamNames(h);
        const _ws = getWinnerSideFromScore(h);
        const dotColor = _ws==='orange'?teamColorsPublic.orange:_ws==='green'?teamColorsPublic.green:_ws==='black'?teamColorsPublic.black:'#c9a668';
        return `<div class="mc-timeline-item" onclick="openMatchDetail('${h._dbId}')">
            <span class="mc-timeline-dot" style="background:${dotColor};"></span>
            <div class="mc-timeline-content">
                <div class="mc-timeline-teams">${idx===0?'▶ START · ':''}${tA||'?'} vs ${tB||'?'}</div>
                <div class="mc-timeline-score">ture ${h.score||'—'} · câștigă ${h.winner||'—'}</div>
                ${h.topScorer ? `<div class="mc-timeline-scorer">${h.topScorer.goals>=3?'🎩':'⚽'} ${h.topScorer.name} ${h.topScorer.goals} gol${h.topScorer.goals!==1?'uri':''}</div>` : ''}
            </div>
        </div>`;
    }).join('');

    const sessDomId = 'sessDetails_' + String(first._dbId||Math.random()).replace(/[^a-zA-Z0-9]/g,'');
    const timeDomId = 'sessTime_' + String(first._dbId||Math.random()).replace(/[^a-zA-Z0-9]/g,'');

    return `<div class="match-card">
        <div class="match-card-hero" style="background:linear-gradient(135deg,#5b7fff,#a78bfa);">
            <div class="mc-date">${first.date||'—'}</div>
            <div class="mc-title">🎮 Sesiune 3 Echipe · ${chrono.length} meciuri jucate</div>
        </div>

// ── Reconstrucție goluri-pe-tură pentru meciuri VECHI (salvate înainte ca
// live.html să înceapă să salveze r.goals direct) ──────────────────────────
// Avem tot ce ne trebuie ca să deducem, per sesiune de 3 echipe:
//  • fiecare tură are un `num` GLOBAL, secvențial pe toată sesiunea (nu per
//    pereche) — deci putem sorta TOATE turele din sesiune în ordine reală
//  • fiecare tură are `duration_sec` → cumulativ, obținem fereastra ei de
//    timp [start,stop) în sesiune
//  • fiecare gol are `minute` = minutul absolut (din startul meciului) la
//    care a fost marcat
// Combinând astea, plasăm fiecare gol exact în tura a cărei fereastră de
// timp îl conține. Golurile reconstruite sunt marcate cu `_reconstructed`
// ca UI-ul să poată nota că sunt deduse, nu înregistrate direct pe tură.
function backfillSessionRoundGoals(sessionRows) {
    const needsBackfill = sessionRows.some(h => (h.roundsDetail||[]).some(r => !Array.isArray(r.goals)));
    if (!needsBackfill) return;

    // 1) Toate turele sesiunii (din toate perechile), sortate după num-ul global
    const allRounds = [];
    sessionRows.forEach(h => (h.roundsDetail||[]).forEach(r => allRounds.push(r)));
    allRounds.sort((a,b) => (a.num||0) - (b.num||0));
    if (!allRounds.length) return;

    // 2) Fereastra de timp cumulativă [startSec, endSec) a fiecărei ture
    let cursor = 0;
    allRounds.forEach(r => {
        r._startSec = cursor;
        r._endSec   = cursor + (r.duration_sec || 0);
        cursor = r._endSec;
    });

    // 3) Toate golurile normale (ne-penalty) din toate perechile sesiunii
    const allGoals = [];
    sessionRows.forEach(h => (h.goalsList||[]).forEach(g => {
        if (g.is_penalty || g.minute == null) return;
        allGoals.push({
    player_name: g.player_name,
    team: g.team,
    minute: g.minute,
    assist_name: g.assist_name || null
});
    }));

    // 4) Plasăm fiecare gol în tura a cărei fereastră de timp îl conține
    //    (aproximare la minut întreg — tolerabilă, turele durează minute întregi)
    allGoals.forEach(g => {
        const sec = g.minute * 60;
        let target = allRounds.find(r => sec >= r._startSec && sec < r._endSec);
        if (!target) { // fallback: tura cu marginea cea mai apropiată (rotunjiri la limită)
            target = allRounds.reduce((best, r) => {
                const d = Math.min(Math.abs(sec-r._startSec), Math.abs(sec-r._endSec));
                return (!best || d < best._d) ? { r, _d: d } : best;
            }, null)?.r;
        }
        if (target) {
            if (!Array.isArray(target.goals)) target.goals = [];
            target.goals.push({
    player_name: g.player_name,
    team: g.team,
    minute: g.minute,
    assist_name: g.assist_name || null,
    _reconstructed: true
});
        }
    });

    // Turele fără niciun gol găsit rămân cu listă goală (nu null) — UI-ul distinge
    // corect "0 goluri" de "date indisponibile"
    allRounds.forEach(r => { if (!Array.isArray(r.goals)) r.goals = []; delete r._startSec; delete r._endSec; });
}

// Detaliu bogat la click pe un MECI (simplu, 2 echipe) sau pe o TURĂ/pereche
// dintr-o sesiune 3 echipe — arată timp jucat + fiecare gol, pe tură/pe meci,

function openMatchDetail(dbId){
    const h = db.history.find(x=>String(x._dbId)===String(dbId));
    if(!h) return;
    const { teamsHTML, topScorerHTML, potmHTML } = renderPairBodyPublic(h);
    const hasRounds = Array.isArray(h.roundsDetail) && h.roundsDetail.length > 0;
    // MVP/POTM per-pereche se ascund în modul sesiune (ambele sunt deja arătate
    // corect la nivel de sesiune, calculate pe toate perechile — un "MVP" sau
    // "POTM" per pereche ar fi altă persoană decât cea corectă, de sesiune).
    // La 2 echipe (!hasRounds), MVP/POTM apar acum INLINE, lângă jucător, în
    // tabela în oglindă de mai jos — nu ca badge-uri separate deasupra.
    const topScorerForModal = '';
    const potmForModal = '';
    const badgesHTML = (topScorerForModal || potmForModal) ? `<div class="mc-badges" style="margin:8px 0;">${topScorerForModal}${potmForModal}</div>` : '';
    const teamHex = (col) => col==='orange'?teamColorsPublic.orange:col==='green'?teamColorsPublic.green:teamColorsPublic.black;
    const modalId = 'md_' + String(dbId).replace(/[^a-zA-Z0-9]/g,'');

    let timeHtml = '';
    let listHtml = '';
    let mirrorHtml = ''; // tabelă în oglindă — construită doar la 2 echipe (!hasRounds), vezi mai jos
    if (hasRounds) {
        // ── Meci 3 echipe: o "tură" = un rând din rounds_detail. Ambele echipe
        // ale acestei perechi au jucat exact aceleași ture, deci timpul e comun.
        const totalSec = h.roundsDetail.reduce((s,r)=>s+(r.duration_sec||0),0);
        const mm = Math.floor(totalSec/60), ss = totalSec%60;
        timeHtml = `⏱ Timp jucat: <b style="color:#f3f6fa;">${mm}:${String(ss).padStart(2,'0')}</b> · ${h.roundsDetail.length} tur${h.roundsDetail.length!==1?'e':'ă'}`;

        const reasonLabel = {goals:'goluri',time:'timp',manual:'manual',final:'final',penalty:'penalty'};
        const anyGoalsData = h.roundsDetail.some(r=>Array.isArray(r.goals));
        const anyReconstructed = h.roundsDetail.some(r=>(r.goals||[]).some(g=>g._reconstructed));
        // Rosterul celor 2 echipe ale acestei perechi (constant pe toate turele —
        // compoziția echipelor nu se schimbă tur cu tur în cadrul aceleiași perechi).
        const pairTeams = [
            h.orangePlayers?.length ? {name:'Portocaliu', col:'orange', players:h.orangePlayers} : null,
            h.greenPlayers?.length  ? {name:'Verde',      col:'green',  players:h.greenPlayers}  : null,
            h.blackPlayers?.length  ? {name:'Negru',       col:'black',  players:h.blackPlayers}  : null,
        ].filter(Boolean);
        const rosterInner = pairTeams.length ? `<div style="display:flex;justify-content:space-between;gap:10px;">
                ${pairTeams.map(t=>`<div style="flex:1;min-width:0;">
                    <div style="font-size:.62rem;font-weight:700;color:${teamHex(t.col)};margin-bottom:2px;">${t.name}</div>
                    ${t.players.map(n=>`<div style="font-size:.68rem;color:#c7d0dd;">${n}</div>`).join('')}
                </div>`).join('')}
            </div>` : '';
        const turHtml = h.roundsDetail.map((r,ri)=>{
            const dm = r.duration_sec ? Math.floor(r.duration_sec/60) : 0;
            const ds = r.duration_sec ? r.duration_sec%60 : 0;
            const durStr = r.duration_sec ? `${dm}:${String(ds).padStart(2,'0')}` : '—';
            const goalsHtml = Array.isArray(r.goals) && r.goals.length
                ? r.goals.map(g=>`<div style="font-size:.68rem;color:${teamHex(g.team)};font-weight:700;">⚽ ${g.player_name}${g.assist_name ? ` <span style="color:#60a5fa;font-weight:500;">(${g.assist_name} 🅰️)</span>` : ''}${g.minute!=null ? ` <span style="color:#8b96a8;font-weight:400;">min ${g.minute}${g._reconstructed?' ~':''}</span>` : ''}</div>`).join('')
                : `<div style="font-size:.66rem;color:#5b6577;">${anyGoalsData ? 'Fără goluri în această tură' : 'Detalii indisponibile'}</div>`;
            const roundWinnerName = getRoundWinnerName(h, r);
            const winnerHtml = roundWinnerName
                ? `<span style="color:${teamHex(roundWinnerName==='Portocaliu'?'orange':roundWinnerName==='Verde'?'green':'black')};font-weight:700;">🏆 ${roundWinnerName}</span>`
                : `<span style="color:#5b6577;">Egal</span>`;
            const hasRoster = pairTeams.length > 0;
            const rosterId = `${modalId}_r${ri}`;
            const rosterHtml = hasRoster ? `<div id="${rosterId}" style="display:none;margin-top:6px;padding:7px 9px;background:#0e131c;border-radius:7px;border:1px solid #1d2531;">${rosterInner}</div>` : '';

            return `<div style="padding:7px 0;border-bottom:1px solid #262f3f;">
                <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:.74rem;font-weight:700;color:#f3f6fa;">
                    <span>Tur ${r.num}</span>
                    <span style="font-weight:400;font-size:.7rem;">${winnerHtml} <span style="color:#5b6577;">· ${durStr} · ${reasonLabel[r.end_reason]||r.end_reason||''}</span></span>
                </div>

                ${rosterBtnHtml}

        }).join('');
        listHtml = `<div style="font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:#8b96a8;margin-bottom:4px;">📊 Istoric Ture</div>${turHtml}${anyReconstructed?'<div style="font-size:.6rem;color:#5b6577;margin-top:5px;">~ minut dedus automat (meci salvat înainte de update)</div>':''}`;
    } else {
        const built = buildTwoTeamMatchDetails(h);
        mirrorHtml = built.mirrorHtml;
        listHtml = built.listHtml;
        timeHtml = built.timeHtml;
    }

    const timeId = modalId + '_time';
    const timeToggleHtml = timeHtml ? `<div style="margin-top:10px;">
        <button onclick="const el=document.getElementById('${timeId}');const open=el.style.display==='none';el.style.display=open?'block':'none';this.textContent=open?'▲ Ascunde timp pe teren':'▼ Timp pe teren';" style="width:100%;text-align:center;padding:7px;font-size:.68rem;font-weight:700;color:#8b96a8;background:#1b2330;border:1px dashed #262f3f;border-radius:8px;cursor:pointer;">▼ Timp pe teren</button>

        <div style="font-size:.68rem;color:#8b96a8;margin-bottom:4px;">${h.date||'—'} · ${hasRounds?'ture ':''}${h.score||'—'}</div>
        <div style="background:#1b2330;border-radius:9px;padding:9px 11px;border:1px solid #262f3f;margin-bottom:8px;">${mirrorHtml || teamsHTML}</div>
        ${badgesHTML}
        <div style="margin-top:6px;">${listHtml}</div>
        ${timeToggleHtml}
        <button id="matchDetailCloseBtn" style="margin-top:14px;width:100%;padding:10px;border-radius:9px;background:rgba(239,68,68,.1);border:1px solid #f87171;color:#ef4444;font-weight:700;cursor:pointer;">Închide</button>
    </div>`;
    overlay.querySelector('#matchDetailCloseBtn').onclick = ()=>overlay.remove();
    document.body.appendChild(overlay);
}

function renderMatchesFeed(){
    const feed = document.getElementById('matchesFeed');
    if(!feed) return;

    // Doar meciurile din sezonul selectat (implicit sezonul curent, nearhivat) —
    // la fel ca la clasament, sezonul e singurul filtru de timp.
    const seasonScoped = db.history.filter(h => h.season === currentSeason);
    const sorted = [...seasonScoped].sort((a,b) => parseDateToObj(b.date) - parseDateToObj(a.date));
    let items = groupHistoryForDisplay(sorted);

    // Filtru echipă
    if (matchTeamFilter !== 'all') {
        items = items.filter(item => item.rows.some(h => getRowTeamNames(h).includes(matchTeamFilter)));
    }

    // Filtru căutare jucător (fără diacritice) — caută în toate rosterurile perechilor
    const q = normalizeSearchStr(matchSearchQuery.trim());
    if (q) {
        items = items.filter(item => item.rows.some(h =>
            [...(h.orangePlayers||[]), ...(h.greenPlayers||[]), ...(h.blackPlayers||[])]
                .some(n => normalizeSearchStr(n).includes(q))
        ));
    }

    if (!items.length) {
        const seasonLabel = currentSeason ? `sezonul „${currentSeason}"` : 'sezonul curent';
        feed.innerHTML = `<div class="match-empty">${q || matchTeamFilter!=='all' ? 'Niciun meci găsit pentru acest filtru.' : `Niciun meci înregistrat încă în ${seasonLabel}.`}</div>`;
        return;
    }

    feed.innerHTML = items.map(item => item.type==='session' ? renderSessionCard(item.rows) : renderSingleMatchCard(item.rows[0])).join('');
}

// ── 🏆 Premii / Titluri — clasament pe TOT istoricul, din toate sezoanele
// (spre deosebire de tab-urile Goluri/Asisturi/Victorii, NU respectă selectorul
// de sezon — un jucător care a fost MVP într-un sezon arhivat tot apare aici) ──
function renderAwardsLeaderboard(wrap){
    if (!wrap) return;

    // POTM total pe jucător — grupăm istoricul pe sesiuni (ca la sesiuni 3
    // echipe, unde o sesiune întreagă are UN singur POTM, nu unul per pereche)
    // și numărăm câștigătorii, la fel ca renderSessionCard dar peste tot istoricul.
    const potmCountById = {};
    groupHistoryForDisplay(db.history).forEach(item => {
        const { winnerId } = computePotmWinnerForRows(item.rows);
        if (winnerId != null) potmCountById[winnerId] = (potmCountById[winnerId]||0) + 1;
    });

    // MVP total pe jucător — NU voturile colegilor (mvp_votes), ci "MVP din
    // meciuri": golgheterul cu cele mai multe minute jucate (goluri +
    // minute/90), calculat per sesiune/meci cu computeSessionMvpWinner —
    // exact aceeași logică folosită pentru badge-ul ⭐ MVP de pe fiecare card.
    const mvpCountByName = {};
    groupHistoryForDisplay(db.history).forEach(item => {
        const chrono = [...item.rows].reverse();
        const winner = computeSessionMvpWinner(chrono);
        if (winner) mvpCountByName[winner.name] = (mvpCountByName[winner.name]||0) + 1;
    });

    // Premii custom (din player_awards) — grupate pe jucător
    const customByPlayerId = {};
    (db.playerAwards||[]).forEach(a => {
        if (!customByPlayerId[a.player_id]) customByPlayerId[a.player_id] = [];
        customByPlayerId[a.player_id].push(a);
    });

    const rows = db.players.map(p => {
        const potmCount = potmCountById[p.id] || 0;
        const mvpCount = mvpCountByName[p.name] || 0;
        const custom = customByPlayerId[p.id] || [];
        const total = potmCount + mvpCount + custom.length;
        return { p, potmCount, mvpCount, custom, total };
    }).filter(r => r.total > 0).sort((a,b) => b.total - a.total);

    if (!rows.length) {
        wrap.innerHTML = '<div class="match-empty">Niciun premiu acordat încă (POTM, MVP sau personalizat).</div>';
        return;
    }

    const medals = ['🥇','🥈','🥉'];
    wrap.innerHTML = '<div style="font-size:.72rem;color:#8b96a8;margin-bottom:10px;">Clasament după totalul de premii — ⭐ POTM și 👑 MVP (golgheter cu cele mai multe minute jucate) se numără automat, restul sunt titluri acordate manual.</div>'
        + rows.map((r, i) => {
        const chips = [];
        if (r.potmCount > 0) chips.push(`<span class="mc-badge" style="background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);color:#eab308;">⭐ POTM ×${r.potmCount}</span>`);
        if (r.mvpCount > 0) chips.push(`<span class="mc-badge" style="background:rgba(91,127,255,.1);border:1px solid rgba(91,127,255,.3);color:#60a5fa;">👑 MVP ×${r.mvpCount}</span>`);
        r.custom.forEach(a => {
            chips.push(`<span class="mc-badge" style="background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);color:#a78bfa;" title="${a.note||''}">${a.icon||'🏆'} ${a.title}${a.season?' · '+a.season:''}</span>`);
        });
        return `<div class="match-card" style="padding:12px 16px;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:${chips.length?'8px':'0'};">
                <span style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;min-width:26px;text-align:center;color:${medals[i]?'var(--star)':'#8b96a8'};">${medals[i]||(i+1)}</span>
                <span style="font-weight:700;color:#f3f6fa;flex:1;">${r.p.name}</span>
                <span style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#f3f6fa;">${r.total} 🏆</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:5px;">${chips.join('')}</div>
        </div>`;
    }).join('');
}

// ── 🔥 Top 10 Formă — Current OVR (din smart-rating.js) + schimbare față de
// ÎNAINTE de ultimul meci/sesiune jucat(ă) (nu formDelta-ul general din
// smart-rating.js, care e o medie pe ultimele 8 meciuri — aici e strict
// "de la ultimul meci încoace", cum jucați voi de obicei o dată/săptămână).
// Fără instantaneu stocat în Supabase: reconstituim starea "înainte" scăzând
// din statisticile curente exact ce a adus ultimul meci/sesiune (goluri,
// victorie, POTM, MVP), recalculăm OVR-ul cu acele statistici, și comparăm.
// INTENȚIONAT limitat la 10, ca să nu devină un clasament complet al tuturor
// ratingurilor (evită discuții/frustrări legate de ratinguri mici). ──
// Multe funcții din smart-rating.js (eaComputeFormDelta, getActivityMultiplier,
// getTeamSynergyBonus) citesc db.history GLOBAL direct — fereastra "ultimele 8
// meciuri" o iau de-acolo. app.js încarcă DOAR sezonul curent din Supabase, deci
// OVR-ul lui e mereu scopat automat; clasament.html încarcă TOATE sezoanele (ca
// să poți răsfoi arhiva din selectorul de sezon), deci trebuie să restrângem
// manual db.history la sezonul curent ORI DE CÂTE ORI calculăm OVR — altfel
// iese diferit față de app.js pentru același jucător (meciuri/POTM/MVP arhivate
// intrând în calcul pe pagina publică, dar nu în panoul de admin).
function withCurrentSeasonHistory(fn){
    const saved = db.history;
    db.history = db.history.filter(h => !h.season);
    try { return fn(); } finally { db.history = saved; }
}

function computeOvrDeltaSinceLastMatch(){
    // Doar sezonul curent — vezi withCurrentSeasonHistory. "Ultimul meci" trebuie
    // să fie ultimul din sezonul curent, nu ultimul din tot istoricul (care ar
    // putea fi din alt sezon dacă sezonul curent tocmai a început).
    const seasonHistory = db.history.filter(h => !h.season);
    const items = groupHistoryForDisplay(seasonHistory);
    if (!items.length) return {};
    const lastItem = items[0]; // cel mai recent meci/sesiune (sortat descrescător)
    const lastIds = new Set(lastItem.rows.map(r=>r._dbId));
    const historyBefore = seasonHistory.filter(h => !lastIds.has(h._dbId));

    // Ce a adus ultimul meci/sesiune fiecărui jucător implicat — scădem asta
    // din statisticile curente ca să reconstituim starea de "înainte".
    const deltas = {};
    const ensure = n => deltas[n] || (deltas[n] = {games:0,wins:0,goals:0,potm:0,mvp:0});
    lastItem.rows.forEach(row => {
        const participants = [...(row.orangePlayers||[]), ...(row.greenPlayers||[]), ...(row.blackPlayers||[])];
        participants.forEach(name => {
            const d = ensure(name);
            d.games++;
            if (playerWonMatch(row, name) === true) d.wins++;
            d.goals += (row.playerGoals?.[name]||0);
        });
    });
    const { winnerId: potmWinnerId } = computePotmWinnerForRows(lastItem.rows);
    if (potmWinnerId != null) {
        const pl = db.players.find(x=>x.id===potmWinnerId);
        if (pl) ensure(pl.name).potm = 1;
    }
    const mvpWinner = computeSessionMvpWinner([...lastItem.rows].reverse());
    if (mvpWinner) ensure(mvpWinner.name).mvp = 1;

    // eaComputeFormDelta/getActivityMultiplier citesc db.history global (fereastra
    // "ultimele 8 meciuri") — îl schimbăm temporar, recalculăm, apoi îl refacem.
    const savedHistory = db.history;
    db.history = historyBefore;
    const beforeRanked = db.players
        .map(p => {
            const d = deltas[p.name] || {games:0,wins:0,goals:0,potm:0,mvp:0};
            return {
                name: p.name,
                snap: { ...p,
                    games: Math.max(0, p.games - d.games),
                    wins: Math.max(0, p.wins - d.wins),
                    totalGoals: Math.max(0, (p.totalGoals||0) - d.goals),
                    potmCount: Math.max(0, (p.potmCount||0) - d.potm),
                    mvpCount: Math.max(0, (p.mvpCount||0) - d.mvp),
                }
            };
        })
        .filter(x => x.snap.games > 0) // n-a jucat încă niciun meci "înainte" → nu intră în comparație
        .map(x => ({ name: x.name, ovr: eaGetPlayerCard(x.snap).currentOVR }))
        .sort((a,b) => b.ovr - a.ovr);
    db.history = savedHistory;

    const result = {};
    beforeRanked.forEach((r,i) => { result[r.name] = { rank: i+1, ovr: r.ovr }; });
    return result;
}

    const ranked = withCurrentSeasonHistory(() => active

    const beforeMap = computeOvrDeltaSinceLastMatch();

        let rankTrend = '', ovrTrend = '';

function playerWonMatch(h, playerName) {
    const inOrange = (h.orangePlayers||[]).includes(playerName);
    const inGreen  = (h.greenPlayers||[]).includes(playerName);
    const inBlack  = (h.blackPlayers||[]).includes(playerName);
    if (!inOrange && !inGreen && !inBlack) return null;
    const w = (h.winner||'').toLowerCase().trim();
    if (!w || w === 'egal') return false;
    if (inOrange) return w.includes('portocaliu') || w.includes('orange');
    if (inGreen)  return w.includes('verde') || w.includes('green');
    if (inBlack)  return w.includes('negru') || w.includes('black');
    return false;
}

function getStreak(p){
    if(!p.matchHistory?.length) return {count:0,type:null};
    const last=p.matchHistory[p.matchHistory.length-1]; let count=0;
    for(let i=p.matchHistory.length-1;i>=0;i--){ if(p.matchHistory[i]===last) count++; else break; }
    return {count,type:last};
}

function getRecentMatchesWindow(){
    if(!db.history.length) return [];
    const cutoff = new Date(Date.now()-7*24*60*60*1000);
    let recent = db.history.filter(h=>parseDateToObj(h.date)>=cutoff);
    if(!recent.length) recent = db.history.slice(0,5);
    return recent;
}
function computeWeekPlayerStats(){
    const recent = getRecentMatchesWindow();
    if(!recent.length) return {};
    const stats={};
    const ensure=n=>stats[n]||(stats[n]={name:n,games:0,wins:0,goals:0});
    recent.forEach(h=>{
        const winO=h.winner==='Portocaliu', winG=h.winner==='Verde', winB=h.winner==='Negru';
        (h.orangePlayers||[]).forEach(n=>{const s=ensure(n);s.games++;if(winO)s.wins++;});
        (h.greenPlayers ||[]).forEach(n=>{const s=ensure(n);s.games++;if(winG)s.wins++;});
        (h.blackPlayers ||[]).forEach(n=>{const s=ensure(n);s.games++;if(winB)s.wins++;});
        if (Array.isArray(h.goalsList)) {
    h.goalsList.forEach(g => {
        // Penalty-urile nu intră în statisticile normale de goluri/assisturi
        if (g.is_penalty) return;

        const scorer = (g.player_name || '').trim();
        if (scorer) {
            ensure(scorer).goals += (g.goals || 1);
        }

        const assister = (g.assist_name || '').trim();
        if (assister) {
            ensure(assister).assists += 1;
        }
    });
}
    });
    return stats;
}
function computeWeekTopScorer(){
    const stats = computeWeekPlayerStats();
    const arr = Object.values(stats).filter(s=>s.goals>0).sort((a,b)=>b.goals-a.goals);
    if(!arr.length) return null;
    const topGoals = arr[0].goals;
    const top = arr.filter(s=>s.goals===topGoals);
    return { players: top, goals: topGoals };
}
function computeDerbyOfWeek(){
    const recent = getRecentMatchesWindow();
    if(!recent.length) return null;
    let best=null, bestExcitement=-Infinity;
    recent.forEach(h=>{
        if(!h.score) return;
        const parts = h.score.split(':').map(s=>parseInt(s.trim(),10));
        if(parts.length<2 || isNaN(parts[0]) || isNaN(parts[1])) return;
        const diff = Math.abs(parts[0]-parts[1]);
        const total = parts[0]+parts[1];
        const excitement = total - diff;
        if(excitement > bestExcitement){
            best={h,diff,total,excitement,a:parts[0],b:parts[1]};
            bestExcitement=excitement;
        }
    });
    return best;
}

// Statistici derivate STRICT din meciurile unui sezon (h.season === seasonName).
// seasonName = null înseamnă sezonul curent (nearhivat). Necesar pentru că
// wins/games/totalGoals de pe player se resetează la arhivarea sezonului —
// singura sursă de adevăr e tabela match_history (+ match_goals).
function computeSeasonStats(seasonName){
    const stats = {};
    const ensure = n => stats[n] || (stats[n] = {name:n, games:0, wins:0, goals:0, assists:0, penaltyGoals:0, penaltyAttempts:0, penaltyShots:[]});
    db.history.forEach(h=>{
        if (h.season !== seasonName) return;
        const winO = h.winner==='Portocaliu', winG = h.winner==='Verde', winB = h.winner==='Negru';
        (h.orangePlayers||[]).forEach(n=>{ const s=ensure(n); s.games++; if(winO) s.wins++; });
        (h.greenPlayers ||[]).forEach(n=>{ const s=ensure(n); s.games++; if(winG) s.wins++; });
        (h.blackPlayers ||[]).forEach(n=>{ const s=ensure(n); s.games++; if(winB) s.wins++; });
        if (Array.isArray(h.goalsList)) {
    h.goalsList.forEach(g => {
        if (g.is_penalty) return;

        const name = (g.player_name || '').trim();
        if (!name) return;

        ensure(name).goals += (g.goals || 1);
    });
}
        if (h.goalsList) {h.goalsList.forEach(g => { if (g.assist_name && !g.is_penalty) { ensure(g.assist_name).assists++; }})};
        if (Array.isArray(h.roundsDetail)) h.roundsDetail.forEach(r=>{
            if (Array.isArray(r.penalty_shots)) {
                r.penalty_shots.forEach(s=>{
                    const scored = s.state === 'goal';
                    const st = ensure(s.player_name);
                    st.penaltyAttempts++;
                    st.penaltyShots.push(scored); // ordinea în care apar în db.history (cel mai nou meci primul)
                    if (scored) st.penaltyGoals++;
                });
            }
        });
    });
    return stats;
}

const PP_MIN_WR_GAMES = 5;        // prag minim meciuri pt. "cel mai bun winrate"
const PP_MIN_TEAMMATE_GAMES = 2;  // prag minim meciuri împreună pt. "cel mai bun coechipier"
let ppMatchesExpanded = false;    // "ULTIMELE MECIURI" — colapsat implicit, se resetează per jucător
let ppActiveTab = 'overview';     // 'overview' | 'chemistry' — se resetează per jucător
let ppLastProfileName = null;
let ppCurrentAchievements = [];   // achievement-urile profilului afișat curent, pentru showAchievementInfo(i)

function ppMatchesFor(name){
    return db.history.filter(h =>
        (h.orangePlayers||[]).includes(name) ||
        (h.greenPlayers ||[]).includes(name) ||
        (h.blackPlayers ||[]).includes(name)
    ).sort((a,b)=>parseDateToObj(b.date)-parseDateToObj(a.date));
}

// "Cel mai bun coechipier" = cele mai multe VICTORII împreună (nu doar
// apariții în aceeași echipă) — vezi playerWonMatch pentru rezultatul real.
// Listă completă de coechipieri, sortată după victorii împreună (tab Chimie
// + cardul "Cel mai bun coechipier" din overview folosesc aceeași sursă).
function computeTeammateChemistry(name){
    const chemMap = {};
    ppMatchesFor(name).forEach(h=>{
        const inOrange = (h.orangePlayers||[]).includes(name);
        const inGreen  = (h.greenPlayers ||[]).includes(name);
        const myTeam = inOrange ? h.orangePlayers : inGreen ? h.greenPlayers : h.blackPlayers;
        const won = playerWonMatch(h, name) === true;
        (myTeam||[]).forEach(n=>{
            if (n===name) return;
            if (!chemMap[n]) chemMap[n]={together:0,wins:0};
            chemMap[n].together++;
            if (won) chemMap[n].wins++;
        });
    });
    return Object.entries(chemMap)
        .map(([n,d])=>({name:n, together:d.together, wins:d.wins, wr: d.together>0?d.wins/d.together:0}))
        .sort((a,b)=> b.wins-a.wins || b.wr-a.wr || b.together-a.together);
}

function computeBestTeammate(name){
    const results = computeTeammateChemistry(name).filter(r=>r.together>=PP_MIN_TEAMMATE_GAMES);
    return results[0] || null;
}

// Nemesis — port EXACT al logicii din app.js (min 3 meciuri directe, rată
// de înfrângere >50%), la cererea utilizatorului, ca să rămână coerent cu
// panoul de admin.
function computeNemesis(name){
    const opponents = {};
    db.history.forEach(h=>{
        const inOrange = (h.orangePlayers||[]).includes(name);
        const inGreen  = (h.greenPlayers ||[]).includes(name);
        const inBlack  = (h.blackPlayers ||[]).includes(name);
        if (!inOrange && !inGreen && !inBlack) return;
        const won = playerWonMatch(h, name);
        if (won===null) return;
        let oppList = [];
        if (inOrange) oppList = [...(h.greenPlayers||[]), ...(h.blackPlayers||[])];
        else if (inGreen) oppList = [...(h.orangePlayers||[]), ...(h.blackPlayers||[])];
        else oppList = [...(h.orangePlayers||[]), ...(h.greenPlayers||[])];
        oppList.forEach(n=>{
            if (n===name) return;
            if (!opponents[n]) opponents[n]={games:0,losses:0};
            opponents[n].games++;
            if (won===false) opponents[n].losses++;
        });
    });
    let nemesis=null;
    Object.entries(opponents).forEach(([n,st])=>{
        if (st.games<3) return;
        const lossRate = st.losses/st.games;
        if (lossRate<=0.5) return;
        if (!nemesis || lossRate>nemesis.lossRate || (lossRate===nemesis.lossRate && st.games>nemesis.games)) {
            nemesis = {name:n, games:st.games, losses:st.losses, wins:st.games-st.losses, lossRate};
        }
    });
    return nemesis;
}

function getBestSingleMatchAssists(name){
    let max=0, bestMatch=null;
    db.history.forEach(h=>{
        const a = (h.goalsList||[]).filter(g=>!g.is_penalty && g.assist_name===name).length;
        if (a>max){ max=a; bestMatch=h; }
    });
    return { value:max, match:bestMatch };
}

function getBestSingleMatchGoalsWithMatch(name){
    let max=0, bestMatch=null;
    db.history.forEach(h=>{
        const g = (h.goalsList||[]).filter(gg=>!gg.is_penalty && gg.player_name===name).reduce((s,gg)=>s+(gg.goals||1),0);
        if (g>max){ max=g; bestMatch=h; }
    });
    return { value:max, match:bestMatch };
}

// Achievement-uri automate — CONFIGURABILE din Setări → Milestone-uri, exact
// ca insignele vechi (goals/wins/games/streak/best_match_goals). Orice categorie
// nouă din milestone_config care are un getter mai jos apare automat aici, cu
// pragurile/emoji/label-urile puse de admin — nu mai e nimic hardcodat de tip
// "7 goluri" în cod; ca să schimbi pragul, editezi rândul din Setări.
// Categoriile 'goals'/'games'/'streak' rămân doar insigne (nu achievement-uri
// de profil), ca să nu dubleze secțiunea RECORDURI.
const ACHIEVEMENT_STAT_GETTERS = {
    goals:                (p, s) => p.totalGoals||0,
    games:                (p, s) => p.games||0,
    streak:               (p, s) => s.streak||0,
    best_match_goals:     (p, s) => s.bestMatchGoals,
    best_match_assists:   (p, s) => s.bestMatchAssists,
    wins:                 (p, s) => s.wins,
    assists:              (p, s) => s.assists,
    mvp_count:            (p, s) => p.careerMvpCount||0,
    winrate:              (p, s) => s.games>=PP_MIN_WR_GAMES ? Math.round((s.wins/s.games)*100) : -1,
    rating:                (p, s) => s.rating,
    teammate_wins:        (p, s) => s.teammateWins||0,
};
const ACHIEVEMENT_UNIT_LABELS = {
    goals:'goluri (total carieră)', games:'meciuri jucate', streak:'victorii la rând (cea mai lungă serie)',
    best_match_goals:'goluri într-un meci', best_match_assists:'assisturi într-un meci',
    wins:'victorii', assists:'assisturi', mvp_count:'MVP-uri',
    winrate:`% winrate (min. ${PP_MIN_WR_GAMES} meciuri)`, rating:'rating',
    teammate_wins:'victorii cu același coechipier',
};
function computeAchievements(p, stats){
    const chips = [];
    Object.keys(ACHIEVEMENT_STAT_GETTERS).forEach(cat=>{
        const tiers = _milestoneTiersFor(cat);
        if (!tiers.length) return;
        const val = ACHIEVEMENT_STAT_GETTERS[cat](p, stats);
        const unit = ACHIEVEMENT_UNIT_LABELS[cat]||cat;
        tiers.forEach(t=>{
            chips.push({
                emoji: t.emoji, label: t.label, desc: `${t.threshold} ${unit}`,
                how: `Ajunge la ${t.threshold} ${unit}.`,
                unlocked: val>=t.threshold, current: Math.max(val,0), target: t.threshold, unit,
            });
        });
    });
    return chips;
}

// Construiește stats-ul necesar pt. computeAchievements() pornind DOAR de la
// numele jucătorului — folosit de clasament (badge-ul 🏅) și de head-to-head,
// unde nu avem deja variabilele astea calculate local (spre deosebire de
// renderPlayerProfile, care le are pe toate și le pasează direct).
function buildAchievementStats(p){
    const assists = getCurrentAssists(p.name);
    const bestGoalsMatch = getBestSingleMatchGoalsWithMatch(p.name);
    const bestAssistsMatch = getBestSingleMatchAssists(p.name);
    const teammate = computeBestTeammate(p.name);
    return {
        wins: p.wins||0, games: p.games||0, assists,
        bestMatchGoals: bestGoalsMatch.value, bestMatchAssists: bestAssistsMatch.value,
        streak: getLongestWinStreak(p),
        rating: withCurrentSeasonHistory(()=>getSmartRating(p)),
        teammateWins: teammate ? teammate.wins : 0,
    };
}
function getPlayerAchievements(p){
    return computeAchievements(p, buildAchievementStats(p));
}
