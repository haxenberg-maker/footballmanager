// ⭐ POTM / 👑 MVP per meci — calculate la nivel de SESIUNE (groupHistoryForDisplay),
// exact ca restul aplicației (renderSessionCard/renderAwardsLeaderboard), nu o a
// treia logică separată. Într-o sesiune 3 echipe, premiul e per sesiune întreagă,
// nu per rundă — de-aia marcăm toate rândurile (_dbId) din grupul câștigător.
function getPlayerMatchAwards(name){
    const potmIds = new Set(), mvpIds = new Set();
    groupHistoryForDisplay(db.history).forEach(item=>{
        const participates = item.rows.some(h =>
            (h.orangePlayers||[]).includes(name) ||
            (h.greenPlayers ||[]).includes(name) ||
            (h.blackPlayers ||[]).includes(name)
        );
        if (!participates) return;
        const rowIds = item.rows.map(r=>r._dbId);
        const { winnerId: potmWinnerId } = computePotmWinnerForRows(item.rows);
        if (potmWinnerId != null) {
            const pl = db.players.find(x=>x.id===potmWinnerId);
            if (pl && pl.name===name) rowIds.forEach(id=>potmIds.add(id));
        }
        const mvpWinner = computeSessionMvpWinner([...item.rows].reverse());
        if (mvpWinner && mvpWinner.name===name) rowIds.forEach(id=>mvpIds.add(id));
    });
    return { potmIds, mvpIds };
}

// Meciuri directe (echipe diferite, în același meci) între doi jucători —
// folosește playerWonMatch/getRowTeamNames deja existente, nu o a doua sursă.
function computeHeadToHead(nameA, nameB){
    const teamOf = (h,name) =>
        (h.orangePlayers||[]).includes(name) ? 'orange' :
        (h.greenPlayers ||[]).includes(name) ? 'green'  :
        (h.blackPlayers ||[]).includes(name) ? 'black'  : null;
    const matches = db.history.map(h=>{
        const tA = teamOf(h,nameA), tB = teamOf(h,nameB);
        if (!tA || !tB || tA===tB) return null;
        return { h, wonA: playerWonMatch(h,nameA), wonB: playerWonMatch(h,nameB) };
    }).filter(Boolean).sort((a,b)=>parseDateToObj(b.h.date)-parseDateToObj(a.h.date));
    const winsA = matches.filter(m=>m.wonA===true).length;
    const winsB = matches.filter(m=>m.wonB===true).length;
    const draws = matches.length - winsA - winsB;
    return { matches, winsA, winsB, draws, total: matches.length };
}

function renderComparePage(nameA, nameB){

            <div class="pp-back" onclick="location.href='clasament.html'">← Înapoi la clasament</div>

                <div style="font-size:2rem;margin-bottom:8px;">🔍</div>
                <div style="font-weight:700;color:var(--ink);">Unul dintre jucători nu a fost găsit.</div>
            </div>`;
        return;
    }

    const ratingA = withCurrentSeasonHistory(()=>getSmartRating(a));
    const ratingB = withCurrentSeasonHistory(()=>getSmartRating(b));
    const wrA = a.games>0 ? Math.round((a.wins/a.games)*100) : 0;
    const wrB = b.games>0 ? Math.round((b.wins/b.games)*100) : 0;
    const assistsA = getCurrentAssists(a.name), assistsB = getCurrentAssists(b.name);

    const achNamesA = new Set(achA.map(x=>x.label));
    const achNamesB = new Set(achB.map(x=>x.label));

    const statRow = (label, valA, valB, higherIsBetter=true) => {
        const na = parseFloat(valA), nb = parseFloat(valB);
        const aBetter = higherIsBetter ? na>nb : na<nb;
        const bBetter = higherIsBetter ? nb>na : nb<na;
        return `<div class="h2h-stat-row">
            <div class="h2h-stat-val${aBetter?' better':''}">${valA}</div>
            <div class="h2h-stat-lbl">${label}</div>

    };

    wrap.innerHTML = `
        <div class="pp-back" onclick="location.href='clasament.html?player='+encodeURIComponent('${a.name.replace(/'/g,"\\'")}')">← Înapoi la profilul lui ${a.name}</div>

            <div class="h2h-side">
                <div class="h2h-side-name pp-name-link" onclick="location.href='clasament.html?player='+encodeURIComponent('${b.name.replace(/'/g,"\\'")}')">${b.name}</div>
                <div class="h2h-side-rating">${ratingB}</div>
            </div>
        </div>

        <div class="h2h-record">${h2h.winsA} - ${h2h.draws} - ${h2h.winsB}</div>
        <div class="h2h-record-lbl">Meciuri directe (V ${a.name} — Egal — V ${b.name}) · ${h2h.total} meciuri</div>

        <div class="stats-section" style="margin-bottom:14px;">
            <div class="pp-section-title">STATISTICI</div>
            ${statRow('Meciuri', a.games||0, b.games||0)}
            ${statRow('Victorii', a.wins||0, b.wins||0)}
            ${statRow('Winrate', wrA+'%', wrB+'%')}
            ${statRow('Goluri', a.totalGoals||0, b.totalGoals||0)}
            ${statRow('Assisturi', assistsA, assistsB)}
            ${statRow('MVP-uri', a.careerMvpCount||0, b.careerMvpCount||0)}
            ${statRow('Realizări deblocate', achA.length, achB.length)}
        </div>

        <div class="stats-section" style="margin-bottom:14px;">
            <div class="pp-section-title">🏅 REALIZĂRI</div>
            <div class="h2h-ach-cols">
                <div>
                    <div class="pp-card-name" style="text-align:center;margin-bottom:8px;">${a.name}</div>
                    <div class="pp-chip-row" style="justify-content:center;">
                        ${achA.length ? achA.map(x=>`<div class="pp-chip${achNamesB.has(x.label)?'':' h2h-exclusive'}" title="${x.desc}"><div class="pp-chip-emoji">${x.emoji}</div><div class="pp-chip-lbl">${x.label}</div></div>`).join('') : `<div class="pp-empty">Nicio realizare încă.</div>`}

function applyPageMode(){
    const isCompare = !!(compareP1 && compareP2);
    const isProfile = !isCompare && !!highlightPlayer;
    document.getElementById('playerProfileWrap').style.display = isProfile ? 'block' : 'none';
    document.getElementById('comparePageWrap').style.display = isCompare ? 'block' : 'none';
    ['meCardWrap','rulesWrap','lbSeasonRow','lbSeasonBanner','leaderboardSection'].forEach(id=>{
        const el = document.getElementById(id);
        if (el) el.style.display = (isProfile||isCompare) ? 'none' : '';
    });
    const pageTabs = document.querySelector('.page-tabs');
    if (pageTabs) pageTabs.style.display = (isProfile||isCompare) ? 'none' : '';
    const matchesSection = document.getElementById('matchesSection');
    if (matchesSection && (isProfile||isCompare)) matchesSection.style.display = 'none';
    if (isCompare) renderComparePage(compareP1, compareP2);
    else if (isProfile) renderPlayerProfile(highlightPlayer);
}

function renderLeaderboard(){
    const medals=['🥇','🥈','🥉'];
    const content=document.getElementById('lbContent');
    if(!content) return;

    // Premii — tab separat de restul (nu e un clasament de rating/goluri, e un
    // clasament de titluri), randat direct aici, fără logica de period/season
    // de mai jos. Intenționat: Premiile numără din TOATE sezoanele, nu doar cel
    // selectat — vezi renderAwardsLeaderboard.
    if (currentLbTab === 'awards') {
        renderAwardsLeaderboard(content);
        return;
    }

    // Top 10 Formă — Current OVR (Base OVR + Form Delta din smart-rating.js) +
    // tendință (▲/▼/=). La fel ca Premii: randat direct, fără logica de
    // period/season de mai jos — OVR-ul e "acum", nu per sezon selectat.
    if (currentLbTab === 'ovr') {
        renderOvrLeaderboard(content);
        return;
    }

    const viewingPastSeason = !!currentSeason;
    const usesPeriodStats = viewingPastSeason || currentLbTab==='pen' || currentLbTab==='goals' || currentLbTab==='assist' || currentLbTab==='contrib' ;
    const periodStats = usesPeriodStats ? computeSeasonStats(currentSeason) : null;

    const gamesOf = p => usesPeriodStats ? (periodStats[p.name]?.games||0) : p.games;
    const winsOf  = p => usesPeriodStats ? (periodStats[p.name]?.wins ||0) : p.wins;
    const goalsOf = p => usesPeriodStats ? (periodStats[p.name]?.goals||0) : (p.totalGoals||0);
    const assistsOf = p => usesPeriodStats ? (periodStats[p.name]?.assists||0): getCurrentAssists(p.name);
    const contribOf = p =>
        goalsOf(p) + assistsOf(p);
    

    const all = db.players;
    // La sezoane arhivate, un jucător poate să nu mai fie în roster-ul curent
    // (a plecat între timp) — completăm cu obiecte "fantomă" minimale ca să nu
    // dispară din clasamentul istoric.
    const rosterNames = new Set(db.players.map(p=>p.name));
    const ghostPlayers = viewingPastSeason
        ? Object.keys(periodStats).filter(n=>!rosterNames.has(n)).map(n=>({ name:n, games:0, wins:0, totalGoals:0, ratings:[], matchHistory:[] }))
        : [];
    const withGames = usesPeriodStats
        ? [...db.players, ...ghostPlayers].filter(p=>(periodStats[p.name]?.games||0)>0)
        : db.players.filter(p=>p.games>0);

    let sorted=[], getValue, subLabel, bigColor='var(--star)';
    switch(currentLbTab){
        case 'smart':
            sorted=withCurrentSeasonHistory(()=>[...all].sort((a,b)=>getSmartRating(b)-getSmartRating(a)));
            getValue=p=>withCurrentSeasonHistory(()=>String(getSmartRating(p)));
            subLabel=p=>{const wr=p.games>0?((p.wins/p.games)*100).toFixed(0)+'%':'—';return wr+' WR · '+p.games+'M';};
            bigColor='#a78bfa';
            break;
        case 'general':
            sorted=[...all].sort((a,b)=>getGeneralAvg(b)-getGeneralAvg(a));
            getValue=p=>getGeneralAvg(p).toFixed(1);
            subLabel=p=>{const wr=p.games>0?((p.wins/p.games)*100).toFixed(0)+'%':'—';return wr+' WR';};
            bigColor='var(--star)';
            break;
        case 'goals':
            sorted=[...withGames].filter(p=>goalsOf(p)>0).sort((a,b)=>goalsOf(b)-goalsOf(a));
            getValue=p=>'⚽'+goalsOf(p);
            subLabel=p=>{const g=gamesOf(p);const gpg=g>0?(goalsOf(p)/g).toFixed(1):'—';return gpg+'/meci';};
            bigColor='#34d399';
            break;
        case 'assist':
            sorted = [...withGames]
                .filter(p => assistsOf(p) > 0)
                .sort((a,b) =>
                    assistsOf(b) - assistsOf(a) ||
                    goalsOf(b) - goalsOf(a)
                );
            getValue = p => '🅰️' + assistsOf(p);
        
            subLabel = p => {
                const g = gamesOf(p);
                const apg = g > 0
                    ? (assistsOf(p) / g).toFixed(1)
                    : '—';
                return apg + '/meci';
            };
            bigColor = '#60a5fa';
            break;
        case 'contrib':
          // Sub-taburi: Total (goluri+asisturi) / Goluri / Asisturi — vezi
          // currentContribSubTab și renderContribSubTabs().
          if (currentContribSubTab === 'goals') {
              sorted=[...withGames].filter(p=>goalsOf(p)>0).sort((a,b)=>goalsOf(b)-goalsOf(a));
              getValue=p=>'⚽'+goalsOf(p);
              subLabel=p=>{const g=gamesOf(p);const gpg=g>0?(goalsOf(p)/g).toFixed(1):'—';return gpg+'/meci';};
              bigColor='#34d399';
              break;
          }
          if (currentContribSubTab === 'assists') {
              sorted = [...withGames]
                  .filter(p => assistsOf(p) > 0)
                  .sort((a,b) => assistsOf(b) - assistsOf(a) || goalsOf(b) - goalsOf(a));
              getValue = p => '🅰️' + assistsOf(p);
              subLabel = p => {
                  const g = gamesOf(p);
                  const apg = g > 0 ? (assistsOf(p) / g).toFixed(1) : '—';
                  return apg + '/meci';
              };
              bigColor = '#60a5fa';
              break;
          }
          // 'total' (implicit)
          sorted = [...withGames]
              .filter(p => contribOf(p) > 0)
              .sort((a,b) =>
                  contribOf(b) - contribOf(a) ||
                  goalsOf(b) - goalsOf(a) ||
                  assistsOf(b) - assistsOf(a)
              );
      
          getValue = p => '🔥' + contribOf(p);
      
          subLabel = p => {
              const g = gamesOf(p);
              const cpg = g > 0
                  ? (contribOf(p) / g).toFixed(1)
                  : '—';
      
              return `${goalsOf(p)} ⚽ + ${assistsOf(p)} 🅰️ · ${cpg}/meci`;
          };
      
          bigColor = '#f59e0b';
        break;
        case 'wins':
            sorted=[...withGames].sort((a,b)=>winsOf(b)-winsOf(a));
            getValue=p=>'🏆'+winsOf(p);
            subLabel=p=>{const g=gamesOf(p);const wr=g>0?((winsOf(p)/g)*100).toFixed(0)+'%':'—';return wr+' WR';};
            bigColor='#fb7185';
            break;
        case 'games':
            sorted=[...withGames].sort((a,b)=>gamesOf(b)-gamesOf(a));
            getValue=p=>'📅'+gamesOf(p);
            subLabel=p=>winsOf(p)+'V / '+(gamesOf(p)-winsOf(p))+'P';
            bigColor='#60a5fa';
            break;
        case 'wr':
            sorted=[...withGames].filter(p=>gamesOf(p)>=LB_MIN_GAMES).sort((a,b)=>(winsOf(b)/gamesOf(b))-(winsOf(a)/gamesOf(a)));
            getValue=p=>((winsOf(p)/gamesOf(p))*100).toFixed(0)+'%';
            subLabel=p=>winsOf(p)+'V / '+gamesOf(p)+'M';
            bigColor='#22c55e';
            break;
        case 'gpg':
            sorted=[...withGames].filter(p=>gamesOf(p)>=LB_MIN_GAMES && goalsOf(p)>0)
                .sort((a,b)=>(goalsOf(b)/gamesOf(b))-(goalsOf(a)/gamesOf(a)));
            getValue=p=>(goalsOf(p)/gamesOf(p)).toFixed(2);
            subLabel=p=>goalsOf(p)+' goluri'+(viewingPastSeason ? ' (sezon)' : ' sezon curent');
            bigColor='#eab308';
            break;
        case 'pen':
            sorted=[...db.players, ...ghostPlayers].filter(p=>(periodStats[p.name]?.penaltyGoals||0)>0)
                .sort((a,b)=>(periodStats[b.name]?.penaltyGoals||0)-(periodStats[a.name]?.penaltyGoals||0));
            getValue=p=>'🥅'+(periodStats[p.name]?.penaltyGoals||0);
            subLabel=p=>{
                const s=periodStats[p.name]||{};
                const att=s.penaltyAttempts||0, g=s.penaltyGoals||0;
                const pct=att>0 ? Math.round((g/att)*100)+'% reușită' : '';
                return g+' goluri la penalty'+(pct?' · '+pct:'');
            };
            bigColor='#ef4444';
            break;
        default:
            sorted=withCurrentSeasonHistory(()=>[...all].sort((a,b)=>getSmartRating(b)-getSmartRating(a)));
            getValue=p=>withCurrentSeasonHistory(()=>String(getSmartRating(p))); subLabel=p=>p.games+'M'; bigColor='#a78bfa';
    }
    if(!sorted.length){
        const emptyMsg = viewingPastSeason
            ? `Niciun jucător cu date în sezonul „${currentSeason}".`
            : (currentLbTab==='pen' ? 'Niciun gol la penalty încă.' : 'Fără date disponibile.');
        content.innerHTML=`<p style="color:#8b96a8;font-size:.85rem;text-align:center;padding:14px;">${emptyMsg}</p>`;
        return;
    }
    const maxVal=parseFloat(getValue(sorted[0]).replace(/[^0-9.]/g,''))||1;
    const visibleCount = lbExpanded ? sorted.length : Math.min(10, sorted.length);
    content.innerHTML='<div style="display:flex;flex-direction:column;gap:4px;">'+
        sorted.slice(0,visibleCount).map((p,i)=>{
            const val=getValue(p);
            const numVal=parseFloat(val.replace(/[^0-9.]/g,''))||0;
            const pct=Math.round((numVal/maxVal)*100);
            const medalColors=['#ffd23f','#cbd5e1','#e0995e'];
            const isMe = highlightPlayer && p.name===highlightPlayer;
            const bg=isMe?'rgba(91,127,255,.10)':i===0?`rgba(167,139,250,.06)`:i===1?`rgba(203,213,225,.03)`:i===2?`rgba(224,153,94,.03)`:'transparent';
            const nameColor=i<3?'#f3f6fa':'#8b96a8';
            const form=viewingPastSeason ? {last5:[]} : getFormIndex(p);
            // Pe tab-ul Penalty, bulinele arată ultimele penalty-uri ale jucătorului
            // (verde = gol, roșu = ratat) — NU forma victorii/înfrângeri ca la celelalte tab-uri.
            const dots = currentLbTab==='pen'
                ? (periodStats[p.name]?.penaltyShots||[]).slice(0,5).reverse()
                    .map(scored=>`<span title="${scored?'Gol':'Ratat'}" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${scored?'#22c55e':'#ef4444'};"></span>`).join('')
                : form.last5.slice(0,5).map(r=>`<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${r==='W'?'#22c55e':'#ef4444'};"></span>`).join('');
            return `<div class="${isMe?'row-highlight':''}" style="display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;background:${bg};border-bottom:1px solid #262f3f;">
                <span style="font-family:'Bebas Neue',sans-serif;font-size:${i<3?'1rem':'.8rem'};min-width:24px;text-align:center;color:${medalColors[i]||'#8b96a8'};">${medals[i]||(i+1)}</span>
                <div style="flex:1;min-width:0;">
                    <div class="pp-name-link" onclick="location.href='clasament.html?player='+encodeURIComponent('${p.name.replace(/'/g,"\\'")}')" style="font-weight:700;font-size:${i===0?'.9rem':'.82rem'};color:${nameColor};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}${isMe?' 📍':''}</div>
                    ${viewingPastSeason ? '' : renderAchBadgeCount(p)}
                    <div style="display:flex;align-items:center;gap:5px;margin-top:2px;">
                        <div style="flex:1;height:${i===0?'3px':'2px'};background:#262f3f;border-radius:1px;overflow:hidden;max-width:80px;"><div style="width:${pct}%;height:100%;background:${i===0?bigColor:'#2c384c'};border-radius:1px;"></div></div>
                        <span style="font-size:.58rem;color:#8b96a8;">${subLabel(p)}</span>
                        <span style="font-size:.58rem;">${dots}</span>
                    </div>
                </div>
                <span style="font-family:'Bebas Neue',sans-serif;font-size:${i===0?'1.1rem':'.9rem'};color:${i===0?bigColor:i<3?'#8b96a8':'#5b6577'};white-space:nowrap;">${val}</span>
            </div>`;
        }).join('')+
        (sorted.length>10 ? `<button class="lb-more-btn" onclick="toggleLbExpand()">${lbExpanded?'▲ Arată doar top 10':'▼ Vezi tot clasamentul ('+sorted.length+')'}</button>` : '')
        +'</div>';
}

function rowToPlayer(p) {
    return {
        id: p.id, name: p.name, status: p.status||'bench', role: p.role||null,
        positionPrimary: p.position_primary || null,
        wins: p.wins||0, games: p.games||0,
        matchHistory: p.match_history||[],
        adminTags: p.admin_tags ? p.admin_tags.split(',').filter(Boolean) : [],
        adminRating: p.admin_rating != null ? parseFloat(p.admin_rating) : null,
        manualAttrs: p.manual_attrs || null,
        totalGoals: p.total_goals||0,
        totalGoalsConceded: p.total_goals_conceded||0,
        lastImbalanceLoss: p.last_imbalance_loss||0,
        ratings: (p.ratings||[]).map(r=>({
            rater:r.rater, date:r.date, tags:r.tags||'',
            general:r.general||5, viteza:r.viteza||5, tehnica:r.tehnica||5,
            strategie:r.strategie||5, aparare:r.aparare||5
        }))
    };
}

async function loadAll(){
    try{
        // Interogările independente pornesc TOATE deodată (Promise.allSettled,
        // nu secvențial) — niciuna nu are nevoie de rezultatul alteia ca să
        // PORNEASCĂ, se combină abia după. allSettled (nu all) ca o eroare de
        // rețea pe UNA din ele să nu blocheze restul paginii.
        // NOTĂ: interogările către borda_votes și mvp_votes au fost scoase —
        // sistemul de voturi comunitare a fost eliminat, iar bordaScore/
        // bordaVotes/mvpWinCount/mvpLossCount nu mai erau folosite nicăieri în
        // pagină (cod mort, doar tăiau timp din load).
        const [
            tagsRes, algoRes, playersRes, histRes, goalsRes, potmRes, awardsRes
        ] = await Promise.allSettled([
            sb.from('tags_config').select('*').order('sort_order'),
            sb.from('algo_settings').select('key,value'),
            sb.from('players').select('*, ratings(*)').order('id'),
            sb.from('match_history').select('*').order('created_at', { ascending:false }),
            sb.from('match_goals').select('*'),
            sb.from('potm_votes').select('match_id,voted_player_id'),
            sb.from('player_awards').select('*').order('created_at',{ascending:false}),
            loadMilestoneConfig(), // mutează direct milestoneConfig — nu ne interesează rezultatul aici
        ]);
        const dataOf = r => r.status==='fulfilled' ? (r.value?.data ?? null) : null;

        // tags_config
        tagsConfig = dataOf(tagsRes) || [];
        buildPTById(); buildTWFromConfig();

        // algo_settings — toate "cadranele" formulei OVR (registrul ALGO_FIELDS, smart-rating.js),
        // ca OVR-ul afișat public să fie IDENTIC cu ce a configurat admin-ul în Setări.
        const algoData = dataOf(algoRes);
        applyAlgoSettingsRows(algoData);
        (algoData||[]).forEach(row=>{
            if(row.key==='weights') Object.assign(W, row.value);
            if(row.key==='tag_bonus_cap') TAG_BONUS_CAP = parseFloat(row.value)||10.0;
            if(row.key==='rules_list') rulesList = Array.isArray(row.value) ? row.value : [];
        });

        // players + ratings
        const playersRaw = dataOf(playersRes);
        db.players = (playersRaw || []).map(rowToPlayer);

        // match history + goals
        const histRaw = dataOf(histRes);
        // IMPORTANT: select('*') aici, NU o listă explicită de coloane — o listă
        // explicită cu 'minute' cădea cu eroare 400 (posibil cache de schemă
        // PostgREST neactualizat pentru coloana nou-adăugată). select('*') e
        // exact ce funcționează deja garantat (e folosit și în index.html).
        let goalsPerMatch = {};
        try{
            if (goalsRes.status!=='fulfilled') throw (goalsRes.reason||new Error('fetch failed'));
            const { data: allGoals, error } = goalsRes.value;
            if (error) throw error;
            (allGoals||[]).forEach(g=>{
                if(!goalsPerMatch[g.match_id]) goalsPerMatch[g.match_id]=[];
                goalsPerMatch[g.match_id].push(g);
            });
        }catch(e){ console.warn('match_goals load:', e.message); }
        // POTM (Player of The Match) — voturi + suprascriere manuală, pentru
        // insigna ⭐ POTM de pe fiecare card/detaliu de meci.
        let potmVotesByMatch = {};
        try{
            const potmRaw = dataOf(potmRes);
            (potmRaw||[]).forEach(v=>{
                if(!potmVotesByMatch[v.match_id]) potmVotesByMatch[v.match_id]={};
                const pid = String(v.voted_player_id);
                potmVotesByMatch[v.match_id][pid] = (potmVotesByMatch[v.match_id][pid]||0)+1;
            });
        }catch(e){ console.warn('potm_votes load (ai rulat migrarea SQL?):', e.message); }
      function enrichRoundGoalsWithAssists(roundsDetail, goals) {
    if (!Array.isArray(roundsDetail)) return roundsDetail;

    const assistMap = {};

    (goals || [])
        .filter(g => !g.is_penalty)
        .forEach(g => {
            const key = `${g.player_name}|||${g.team}|||${g.minute ?? ''}`;

            if (!assistMap[key]) assistMap[key] = [];
            assistMap[key].push(g.assist_name || null);
        });

    return roundsDetail.map(r => ({
        ...r,
        goals: Array.isArray(r.goals)
            ? r.goals.map(g => {
                const key = `${g.player_name}|||${g.team}|||${g.minute ?? ''}`;
                const assists = assistMap[key] || [];

                return {
                    ...g,
                    assist_name: g.assist_name || (assists.length ? assists.shift() : null)
                };
            })
            : r.goals
    }));
}
        db.history = (histRaw||[]).map(h=>{
            const goals = goalsPerMatch[h.id]||[];
            // Golurile de penalty (is_penalty:true) se țin STRICT separat, nu se adună
            // la golurile normale — nici în playerGoals, nici în teamGoals.
            const playerGoals = {};
            const playerPenaltyGoals = {};
            const playerAssists = {}; // pentru MVP (goluri + asisturi + minute)
            goals.forEach(g=>{
                if (g.is_penalty) {
                    playerPenaltyGoals[g.player_name] = (playerPenaltyGoals[g.player_name]||0) + (g.goals||1);
                } else {
                    playerGoals[g.player_name] = (playerGoals[g.player_name]||0) + (g.goals||1);
                }
                if (g.assist_name && !g.is_penalty) {
                    playerAssists[g.assist_name] = (playerAssists[g.assist_name]||0) + 1;
                }
            });
            const topEntries = Object.entries(playerGoals).sort((a,b)=>b[1]-a[1]);
            const topScorer = topEntries[0] ? { name: topEntries[0][0], goals: topEntries[0][1] } : null;
            const teamGoals = { orange:0, green:0, black:0 };
            goals.forEach(g=>{ if(!g.is_penalty && teamGoals[g.team]!==undefined) teamGoals[g.team] += (g.goals||1); });

            // POTM: manual (setat de admin) are prioritate; altfel, jucătorul cu cele mai multe voturi.
            const voteCounts = potmVotesByMatch[h.id] || {};
            let potmWinnerId = h.manual_potm_player_id != null ? h.manual_potm_player_id : null;
            let potmSource = potmWinnerId != null ? 'manual' : null;
            if (potmWinnerId == null) {
                const sortedVotes = Object.entries(voteCounts).sort((a,b)=>b[1]-a[1]);
                if (sortedVotes.length) { potmWinnerId = parseInt(sortedVotes[0][0]); potmSource = 'voted'; }
            }
            const potmPlayer = potmWinnerId != null ? db.players.find(p=>p.id==potmWinnerId) : null;

            return {
                _dbId: h.id, date: h.date, winner: h.winner, score: h.score,
                imbalanced: h.imbalanced||false,
                orangePlayers: h.orange_players||[], greenPlayers: h.green_players||[], blackPlayers: h.black_players||[],
                roundsDetail: enrichRoundGoalsWithAssists(h.rounds_detail, goals), playerGoals, playerAssists, playerPenaltyGoals, topScorer, teamGoals,
                season: h.season||null, createdAt: h.created_at||null,
                startedAt: h.started_at||null, endedAt: h.ended_at||null, goalsList: goals,
                manualPotmId: h.manual_potm_player_id!=null ? h.manual_potm_player_id : null,
                manualMvpId: h.manual_mvp_player_id!=null ? h.manual_mvp_player_id : null,
                mvpCleared: !!h.mvp_cleared, // "Niciun MVP" setat explicit — vezi computeSessionMvpWinner
                potmVoteDeadline: h.potm_vote_deadline||null,
                potmVoteCounts: voteCounts,
                potmWinnerId, potmSource,
                potmWinnerName: potmPlayer ? potmPlayer.name : null,
            };
        }).sort((a,b)=>parseDateToObj(b.date)-parseDateToObj(a.date));

        // Reconstituim golurile-pe-tură pentru sesiunile vechi (salvate înainte
        // de update-ul care le salvează direct) — vezi backfillSessionRoundGoals().
        groupHistoryForDisplay(db.history)
            .filter(item => item.type === 'session')
            .forEach(item => backfillSessionRoundGoals(item.rows));

        // ── Construiește lista de sezoane arhivate (cele mai recente primele) ──
        const seasonLatestDate = new Map();
        db.history.forEach(h=>{
            if(!h.season) return;
            const d = parseDateToObj(h.date);
            if(!seasonLatestDate.has(h.season) || d > seasonLatestDate.get(h.season)) seasonLatestDate.set(h.season, d);
        });
        seasonsList = [...seasonLatestDate.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
        if(currentSeason && !seasonsList.includes(currentSeason)) currentSeason = null; // sezon dispărut/redenumit
        renderSeasonTabs();

        // Premii personalizate (Gheata de Aur etc.) — POTM/MVP se calculează
        // automat mai jos/în renderAwardsLeaderboard, astea sunt titluri
        // acordate manual din setari.html.
        try{
            const awardsRaw = dataOf(awardsRes);
            if (awardsRes.status!=='fulfilled') throw (awardsRes.reason||new Error('fetch failed'));
            if (awardsRes.value.error) throw awardsRes.value.error;
            db.playerAwards = awardsRaw || [];
        }catch(e){ console.warn('player_awards load:', e.message); db.playerAwards = []; }

        // p.potmCount / p.mvpCount — necesare de eaComputeFormDelta (din
        // smart-rating.js) pentru semnalele ⭐/👑 din Form Rating. IMPORTANT:
        // NU e aceeași sursă ca la clasamentul de Premii (care numără din
        // TOATE sezoanele, intenționat) — aici trebuie neapărat doar sezonul
        // curent (season == null), la fel ca app.js (.is('season', null)),
        // altfel OVR-ul iese diferit între pagina publică și panoul de admin
        // pentru același jucător, din cauza unor POTM/MVP-uri arhivate.
        db.players.forEach(p=>{ p.potmCount=0; p.mvpCount=0; });
        const currentSeasonHistory = db.history.filter(h => !h.season);
        groupHistoryForDisplay(currentSeasonHistory).forEach(item => {
            const { winnerId } = computePotmWinnerForRows(item.rows);
            if (winnerId != null) { const pl = db.players.find(x=>x.id===winnerId); if (pl) pl.potmCount++; }
            const chrono = [...item.rows].reverse();
            const mvpWinner = computeSessionMvpWinner(chrono);
            if (mvpWinner) { const pl = db.players.find(x=>x.name===mvpWinner.name); if (pl) pl.mvpCount++; }
        });

        // p.careerPotmCount / careerMvpCount / careerAwardsCount — pentru
        // bonusul separat "🏆 Realizări istorice" din Form Rating
        // (eaComputeCareerAchievementsDelta, smart-rating.js). Spre deosebire
        // de potmCount/mvpCount de mai sus (strict sezonul curent), aici e
        // EXACT aceeași logică folosită deja de renderAwardsLeaderboard —
        // toate sezoanele, fără filtrare — doar salvată pe jucător, nu doar
        // afișată în tab-ul Premii.
        db.players.forEach(p=>{ p.careerPotmCount=0; p.careerMvpCount=0; p.careerAwardsCount=0; });
        groupHistoryForDisplay(db.history).forEach(item => {
            const { winnerId } = computePotmWinnerForRows(item.rows);
            if (winnerId != null) { const pl = db.players.find(x=>x.id===winnerId); if (pl) pl.careerPotmCount++; }
            const chrono = [...item.rows].reverse();
            const winner = computeSessionMvpWinner(chrono);
            if (winner) { const pl = db.players.find(x=>x.name===winner.name); if (pl) pl.careerMvpCount++; }
        });
        (db.playerAwards||[]).forEach(a=>{
            const pl = db.players.find(x=>x.id===a.player_id);
            if (pl) pl.careerAwardsCount = (pl.careerAwardsCount||0) + 1;
        });

        renderMeCard();
        renderStreakBanner();
        renderRulesCard();
        updateSeasonUI();
        renderContribSubTabs();
        renderLeaderboard();
        renderSeasonMatchesList();
        if (pageTab === 'matches') renderMatchesFeed();
        applyPageMode();
    }catch(err){
        document.getElementById('lbContent').innerHTML = `<p style="color:#ef4444;font-size:.85rem;text-align:center;padding:14px;">❌ Eroare la încărcarea clasamentului.</p>`;
    }finally{
        showLoading(false);
    }
}

function showToast(msg){
    let t = document.getElementById('potmToast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'potmToast';
        t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#f3f6fa;color:#fff;padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;z-index:99999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3);';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2600);
}

// ── POTM — Vot prin link (WhatsApp) ──────────────────────────────────
// ═══════════════════════════════════════════════════════════════════
// Link-ul se generează acum doar din panoul de admin (setari.html) — aici
// rămâne doar partea care PRIMEȘTE votul, când cineva deschide linkul.

function checkPotmVoteParam(){
    const params = new URLSearchParams(location.search);
    const matchId = params.get('vote_match');
    if (!matchId) return;
    openPotmVoteModal(matchId);
}

// Returnează toate rândurile (perechile) sesiunii din care face parte h — sau
// doar [h] dacă e un meci simplu, ne-legat de nicio sesiune 3 echipe.
function getSessionRowsFor(h){
    if (!h) return [];
    const groups = groupHistoryForDisplay(db.history);
    const g = groups.find(item => item.rows.some(r => r._dbId === h._dbId));
    return g ? g.rows : [h];
}

function getMatchParticipants(h){
    // La o sesiune 3 echipe, votul POTM e pentru TOATĂ sesiunea, nu doar
    // pentru perechea din care s-a deschis link-ul — deci adunăm participanții
    // din toate perechile sesiunii (toate cele 3 echipe), nu doar cele 2 din
    // perechea curentă.
    const rows = getSessionRowsFor(h);
    const names = new Set();
    rows.forEach(row => {
        [...(row.orangePlayers||[]), ...(row.greenPlayers||[]), ...(row.blackPlayers||[])].forEach(n=>names.add(n));
    });
    return [...names].map(name => db.players.find(p=>p.name===name)).filter(Boolean);
}

let _potmMatch = null;
let _potmVoter = null;

function potmModalShell(innerHTML){
    let overlay = document.getElementById('potmVoteOverlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'potmVoteOverlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99998;display:flex;align-items:center;justify-content:center;padding:20px;';
        document.body.appendChild(overlay);
    }
    overlay.innerHTML = `<div style="background:#141a24;border:1px solid #262f3f;box-shadow:0 20px 60px -12px rgba(0,0,0,.7);border-radius:18px;padding:20px;max-width:400px;width:100%;max-height:86vh;overflow:auto;">

    </div>`;

}
function closePotmModal(){
    const overlay = document.getElementById('potmVoteOverlay');
    if (overlay) overlay.remove();
    // Curățăm parametrul din URL ca un refresh accidental să nu redeschidă modalul
    const url = new URL(location.href);
    url.searchParams.delete('vote_match');
    history.replaceState({}, '', url);
}

async function openPotmVoteModal(matchId){
    const h = db.history.find(x=>String(x._dbId)===String(matchId));
    if (!h){
        potmModalShell(`
            <div style="font-size:.85rem;color:#8b96a8;margin:14px 0;">Nu am găsit meciul ăsta — poate a fost șters sau link-ul e greșit.</div>
            <button onclick="closePotmModal()" style="width:100%;padding:11px;border-radius:9px;background:rgba(239,68,68,.1);border:1px solid #f87171;color:#ef4444;font-weight:700;cursor:pointer;">Închide</button>`);
        return;
    }
    // Termenul de vot se aplică pe toată sesiunea (setat din setari.html) —
    // dacă a expirat pentru oricare pereche a sesiunii, s-a închis peste tot.
    const deadline = getSessionRowsFor(h).map(r=>r.potmVoteDeadline).find(Boolean);
    if (deadline && Date.now() > new Date(deadline).getTime()){
        const fmt = new Date(deadline).toLocaleString('ro-RO', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        potmModalShell(`
            <div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:14px;margin:14px 0;text-align:center;">
                <div style="font-size:1.6rem;margin-bottom:6px;">🔒</div>
                <div style="font-size:.88rem;color:#f3f6fa;font-weight:700;">Votarea s-a închis</div>
                <div style="font-size:.72rem;color:#8b96a8;margin-top:4px;">Termenul a expirat pe ${fmt}.</div>
            </div>
            <button onclick="closePotmModal()" style="width:100%;padding:11px;border-radius:9px;background:#1b2330;border:1px solid #262f3f;color:#8b96a8;font-weight:700;cursor:pointer;">Închide</button>`);
        return;
    }
    const participants = getMatchParticipants(h);
    if (!participants.length){
        potmModalShell(`
            <div style="font-size:.85rem;color:#8b96a8;margin:14px 0;">Nu găsesc jucătorii acestui meci.</div>
            <button onclick="closePotmModal()" style="width:100%;padding:11px;border-radius:9px;background:rgba(239,68,68,.1);border:1px solid #f87171;color:#ef4444;font-weight:700;cursor:pointer;">Închide</button>`);
        return;
    }
    _potmMatch = h;
    renderPotmStep1(participants);
}

// Pasul 1: cine ești?
function renderPotmStep1(participants){
    const options = participants.sort((a,b)=>a.name.localeCompare(b.name))
        .map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    const isSessionVote = Array.isArray(_potmMatch.roundsDetail) && _potmMatch.roundsDetail.length > 0;
    const subtitle = isSessionVote
        ? `${_potmMatch.date||''} · 🎮 Sesiune 3 Echipe`
        : `${_potmMatch.date||''} · ${_potmMatch.score||''}`;
    potmModalShell(`
        <div style="font-size:.72rem;color:#8b96a8;margin-bottom:14px;">${subtitle}</div>
        <div style="font-size:.8rem;color:#f3f6fa;font-weight:700;margin-bottom:8px;">Cine ești?</div>
        <select id="potmWhoAmI" style="width:100%;padding:11px;border-radius:9px;background:#1b2330;border:1px solid #262f3f;color:#f3f6fa;font-size:.88rem;margin-bottom:14px;">
            <option value="">— alege-ți numele —</option>
            ${options}
        </select>
        <button id="potmStep1Next" style="width:100%;padding:11px;border-radius:9px;background:linear-gradient(135deg,#22357a,#5b7fff);border:1px solid #5b7fff;color:#fff;font-weight:700;cursor:pointer;">Continuă →</button>
    `);
    document.getElementById('potmStep1Next').onclick = async ()=>{
        const sel = document.getElementById('potmWhoAmI');
        const pid = parseInt(sel.value);
        if (!pid){ showToast('⚠️ Alege-ți numele întâi!'); return; }
        _potmVoter = db.players.find(p=>p.id===pid);
        await checkAlreadyVotedAndProceed();
    };
}

// Pasul 2: verificare în DB dacă a votat deja
async function checkAlreadyVotedAndProceed(){
    potmModalShell(`<div style="font-size:.85rem;color:#8b96a8;margin:20px 0;text-align:center;">⏳ Se verifică...</div>`);
    try{
        const { data, error } = await sb.from('potm_votes')
            .select('id')
            .eq('match_id', _potmMatch._dbId)
            .eq('voter_player_id', _potmVoter.id)
            .maybeSingle();
        if (error) throw error;
        if (data){
            potmModalShell(`
                <div style="background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);border-radius:10px;padding:14px;margin:14px 0;text-align:center;">
                    <div style="font-size:1.6rem;margin-bottom:6px;">🗳️</div>
                    <div style="font-size:.88rem;color:#f3f6fa;font-weight:700;">Ai votat deja pentru acest meci!</div>
                    <div style="font-size:.72rem;color:#8b96a8;margin-top:4px;">Fiecare jucător votează o singură dată per meci.</div>
                </div>
                <button onclick="closePotmModal()" style="width:100%;padding:11px;border-radius:9px;background:#1b2330;border:1px solid #262f3f;color:#8b96a8;font-weight:700;cursor:pointer;">Închide</button>`);
            localStorage.setItem(`potm_voted_${_potmMatch._dbId}_${_potmVoter.id}`, 'true');
            return;
        }
        renderPotmStep3();
    }catch(e){
        potmModalShell(`
            <div style="font-size:.85rem;color:#ef4444;margin:14px 0;">⚠️ Eroare la verificare: ${e.message}</div>
            <button onclick="closePotmModal()" style="width:100%;padding:11px;border-radius:9px;background:rgba(239,68,68,.1);border:1px solid #f87171;color:#ef4444;font-weight:700;cursor:pointer;">Închide</button>`);
    }
}

// Pasul 3: pe cine votezi? (exclude propriul nume)
function renderPotmStep3(){
    const participants = getMatchParticipants(_potmMatch).filter(p=>p.id!==_potmVoter.id);
    const options = participants.sort((a,b)=>a.name.localeCompare(b.name))
        .map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    potmModalShell(`
        <div style="font-size:.72rem;color:#8b96a8;margin-bottom:4px;">Votezi ca <b style="color:#f3f6fa;">${_potmVoter.name}</b></div>
        <div style="font-size:.8rem;color:#f3f6fa;font-weight:700;margin:10px 0 8px;">Pe cine votezi ca Player of The Match?</div>
        <select id="potmWhoVote" style="width:100%;padding:11px;border-radius:9px;background:#1b2330;border:1px solid #262f3f;color:#f3f6fa;font-size:.88rem;margin-bottom:14px;">
            <option value="">— alege coechipierul —</option>
            ${options}
        </select>
        <button id="potmSubmitVote" style="width:100%;padding:11px;border-radius:9px;background:linear-gradient(135deg,#123322,#2fd66b);border:1px solid #2fd66b;color:#fff;font-weight:700;cursor:pointer;">✅ Trimite Votul</button>
    `);
    document.getElementById('potmSubmitVote').onclick = submitPotmVote;
}

// Pasul 4: trimite votul
async function submitPotmVote(){
    const sel = document.getElementById('potmWhoVote');
    const votedId = parseInt(sel.value);
    if (!votedId){ showToast('⚠️ Alege pe cineva întâi!'); return; }
    const deadline = getSessionRowsFor(_potmMatch).map(r=>r.potmVoteDeadline).find(Boolean);
    if (deadline && Date.now() > new Date(deadline).getTime()){
        showToast('🔒 Votarea s-a închis între timp.');
        closePotmModal();
        return;
    }
    const btn = document.getElementById('potmSubmitVote');
    btn.disabled = true; btn.textContent = '⏳ Se trimite...';
    try{
        const { error } = await sb.from('potm_votes').insert({
            match_id: _potmMatch._dbId,
            voter_player_id: _potmVoter.id,
            voted_player_id: votedId,
        });
        if (error){
            // Constraint unique (match_id, voter_player_id) — a votat deja, poate din alt tab
            if (String(error.code)==='23505' || /duplicate/i.test(error.message||'')){
                potmModalShell(`
                    <div style="background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);border-radius:10px;padding:14px;margin:14px 0;text-align:center;">
                        <div style="font-size:1.6rem;margin-bottom:6px;">🗳️</div>
                        <div style="font-size:.88rem;color:#f3f6fa;font-weight:700;">Ai votat deja pentru acest meci!</div>
                    </div>
                    <button onclick="closePotmModal()" style="width:100%;padding:11px;border-radius:9px;background:#1b2330;border:1px solid #262f3f;color:#8b96a8;font-weight:700;cursor:pointer;">Închide</button>`);
                return;
            }
            throw error;
        }
        localStorage.setItem(`potm_voted_${_potmMatch._dbId}_${_potmVoter.id}`, 'true');
        const votedPlayer = db.players.find(p=>p.id===votedId);
        potmModalShell(`
            <div style="background:rgba(47,214,107,.12);border:1px solid rgba(47,214,107,.4);border-radius:10px;padding:16px;margin:14px 0;text-align:center;">
                <div style="font-size:1.8rem;margin-bottom:6px;">🎉</div>
                <div style="font-size:.9rem;color:#f3f6fa;font-weight:700;">Vot trimis!</div>
                <div style="font-size:.78rem;color:#8b96a8;margin-top:4px;">Ai votat pentru <b>${votedPlayer?votedPlayer.name:'—'}</b></div>
            </div>
            <button onclick="closePotmModal()" style="width:100%;padding:11px;border-radius:9px;background:linear-gradient(135deg,#123322,#2fd66b);border:1px solid #2fd66b;color:#fff;font-weight:700;cursor:pointer;">Gata</button>`);
    }catch(e){
        btn.disabled = false; btn.textContent = '✅ Trimite Votul';
        showToast('⚠️ Eroare: '+e.message);
    }
}

loadAll().then(checkPotmVoteParam);
</script>
