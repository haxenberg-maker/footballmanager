<style>
:root { --orange:#ff8c00;--green:#28a745;--dark:#f7ecd9;--card:#fff8ed;--star:#ffcc00;--accent:#3d5afe;--border:#dcc89a;--purple:#9c27b0; }
*{box-sizing:border-box;}
body{font-family:'Rajdhani',sans-serif;background:var(--dark);color:#3a2f1f;margin:0;padding:0;min-height:100vh;}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 60px;}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 16px;}
.hd-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px;}
.hd-sub{font-size:.68rem;color:#7d6849;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(40,167,69,.12);border:1px solid rgba(40,167,69,.3);padding:4px 10px;border-radius:14px;flex-shrink:0;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#28a745;box-shadow:0 0 6px #28a745;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.live-lbl{font-size:.62rem;font-weight:700;color:#1b7a43;text-transform:uppercase;letter-spacing:1px;}
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,12,16,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.loading-overlay.hidden{display:none;}
.spinner{width:38px;height:38px;border:3px solid #dcc89a;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.8rem;color:#7d6849;letter-spacing:2px;text-transform:uppercase;}
.stats-section{background:#f1e4c8;padding:16px;border-radius:14px;border:1px solid var(--border);}
.stats-section h3{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:3px;margin:0 0 12px;color:#7d6849;}
.lb-tab{padding:5px 10px;border-radius:7px;font-size:0.72rem;font-weight:700;cursor:pointer;background:#fdf3df;border:1px solid #dcc89a;color:#7d6849;transition:all .12s;white-space:nowrap;}
.lb-tab:hover{color:#3a2f1f;}
.lb-tab.active{background:rgba(167,139,250,.2);border-color:#5a2fd9;color:#6b46c1;}
.lb-period-btn{padding:4px 9px;border-radius:6px;font-size:.64rem;font-weight:600;cursor:pointer;background:transparent;border:1px solid #dcc89a;color:#8a7452;transition:all .12s;}
.lb-period-btn:hover{color:#3a2f1f;}
.lb-period-btn.active{background:#e9d9b3;border-color:#b89860;color:#3a2f1f;}
.lb-more-btn{width:100%;text-align:center;padding:7px;margin-top:4px;font-size:.68rem;font-weight:700;color:#7d6849;background:#fdf3df;border:1px dashed #dcc89a;border-radius:8px;cursor:pointer;}
.lb-more-btn:hover{background:#f3e6cf;}
.me-card{background:linear-gradient(135deg,#3a2f1f,#241c11);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
.me-card-name{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;}
.me-card-sub{font-size:.68rem;color:rgba(255,255,255,.55);margin-top:2px;}
.me-card-rank{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--star);min-width:44px;text-align:center;}
.footer-note{text-align:center;font-size:.65rem;color:#9a8663;margin-top:18px;letter-spacing:.5px;}
.row-highlight{outline:2px solid var(--accent);}
.streak-banner-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:480px){.streak-banner-grid{grid-template-columns:1fr;}}
.streak-banner-card{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;}
.streak-banner-card.hot{background:linear-gradient(135deg,rgba(255,140,0,.12),rgba(229,57,53,.10));border:1px solid rgba(255,140,0,.35);}
.streak-banner-card.cold{background:linear-gradient(135deg,rgba(61,90,254,.10),rgba(3,169,244,.08));border:1px solid rgba(61,90,254,.3);}
.streak-banner-icon{font-size:1.4rem;line-height:1;}
.streak-banner-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:#7d6849;}
.streak-banner-name{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:#3a2f1f;}
.streak-banner-sub{font-size:.65rem;color:#6b5840;}
.milestone-row{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;}
.milestone-badge{font-size:.58rem;padding:2px 6px;border-radius:6px;background:rgba(255,204,0,.15);border:1px solid rgba(255,204,0,.4);color:#8a6800;white-space:nowrap;font-weight:700;}
.week-cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
@media(max-width:640px){.week-cards-grid{grid-template-columns:1fr;}}
.week-card{background:#fffaf0;border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.week-card-title{font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:1.5px;color:#7d6849;margin-bottom:8px;}
.week-player-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0e6d0;font-size:.78rem;}
.week-player-row:last-child{border-bottom:none;}
.week-player-rank{font-family:'Bebas Neue',sans-serif;font-size:.85rem;color:#b89860;min-width:16px;}
.week-player-name{flex:1;font-weight:700;color:#3a2f1f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.week-player-sub{font-size:.64rem;color:#6b5840;}
.derby-score{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:2px;text-align:center;margin:4px 0;color:#3a2f1f;}
.derby-teams{display:flex;justify-content:space-between;font-size:.68rem;color:#6b5840;text-transform:uppercase;letter-spacing:.5px;}
.derby-summary{font-size:.74rem;color:#3a2f1f;margin-top:6px;text-align:center;line-height:1.4;}
.derby-date{text-align:center;font-size:.6rem;color:#9a8663;margin-top:2px;}
</style>

<body>

<div class="wrap">
    <div class="hd">

<script>
const SUPABASE_URL      = 'https://lfnumwbjikiyngdxsgrk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbnVtd2JqaWtpeW5nZHhzZ3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MDQ1MzEsImV4cCI6MjA5MDA4MDUzMX0.BrrmEHnOwa66hDqN-GhYCyqHqOqTAV7dswjcOVxx-wc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── Highlighted player (from ?player=Name in URL) ──
const urlParams = new URLSearchParams(window.location.search);
const highlightPlayer = urlParams.get('player') || urlParams.get('p');

// ── State ──
let db = { players: [], history: [] };
let tagsConfig = [];
let PT_BY_ID = {};
let TW = {};
let TAG_BONUS_CAP = 10.0;
const PROFILE_ATTRS = ['viteza','tehnica','strategie','aparare','efort','mentalitate','fizic','executie','pozitionare'];
const DEFAULT_W = {winrate:0.40,borda:0.30,general:0.10,viteza:0.0,tehnica:0.0,strategie:0.0,aparare:0.0,mvpWin:0.0,mvpLoss:0.0};
let W = {...DEFAULT_W};
let currentLbTab = 'smart';
let currentLbPeriod = 'all';
let lbExpanded = false;
const LB_MIN_GAMES = 3;
const LB_PERIODLESS_TABS = ['smart','general'];

function showLoading(v){ document.getElementById('loadingOverlay').classList.toggle('hidden', !v); }

// ── Helpers copiate din aplicația principală (logică identică, doar citire) ──
function parseDateToObj(dateStr) {
    if (!dateStr || dateStr === '—') return new Date(0);
    if (dateStr.includes('.')) {
        const [d,m,y] = dateStr.split('.');
        return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T12:00:00`);
    }
    return new Date(dateStr);
}

function playerWonMatch(h, playerName) {
    const inOrange = (h.orangePlayers||[]).includes(playerName);
    const inGreen  = (h.greenPlayers||[]).includes(playerName);
    const inBlack  = (h.blackPlayers||[]).includes(playerName);
    if (!inOrange && !inGreen && !inBlack) return null;
    const w = (h.winner||'').toLowerCase().trim();
    if (!w || w === 'egal') return false;
    if (inOrange) return w.includes('portocaliu') || w.includes('orange');
    if (inGreen)  return w.includes('verde') || w.includes('green');
    if (inBlack)  return w.includes('negru') || w.includes('black');
    return false;
}

function buildPTById(){ PT_BY_ID = Object.fromEntries(tagsConfig.map(t=>[String(t.id),t])); }
function buildTWFromConfig(){ TW = {}; tagsConfig.forEach(t=>{ TW[String(t.id)] = parseFloat(t.tw_weight)||0; }); }

function computeTagStats(p){
    const voteMap = {};
    (p.ratings||[]).forEach(r=>{
        (r.tags||'').split(',').filter(Boolean).forEach(tid=>{
            if(!voteMap[tid]) voteMap[tid]=[];
            voteMap[tid].push({rater:r.rater||'?', date:r.date||''});
        });
    });
    const myMatches = [...db.history]
        .filter(h=>(h.orangePlayers||[]).includes(p.name)||(h.greenPlayers||[]).includes(p.name)||(h.blackPlayers||[]).includes(p.name))
        .sort((a,b)=>parseDateToObj(b.date)-parseDateToObj(a.date));
    const stats = {};
    tagsConfig.forEach(tag=>{
        const tid = String(tag.id);
        const votes = voteMap[tid] || [];
        const distinctVoters = new Set(votes.map(v=>v.rater)).size;
        let missedMatches = 0;
        if(distinctVoters >= 3 && myMatches.length >= 1){
            myMatches.slice(0,2).forEach(match=>{
                const matchDate = parseDateToObj(match.date);
                const hasVote = votes.some(v=>{
                    if(!v.date) return false;
                    const vd = parseDateToObj(v.date);
                    return vd >= matchDate && (vd - matchDate) <= 2*24*60*60*1000;
                });
                if(!hasVote) missedMatches++;
            });
        }
        stats[tid] = { votes, distinctVoters, missedMatches, expired: missedMatches >= 2 && distinctVoters >= 3 };
    });
    return stats;
}

function getPlayerActiveTagObjects(p){
    const adminSet = new Set((p.adminTags||[]).map(String));
    const stats = computeTagStats(p);
    const result = [];
    tagsConfig.forEach(tag=>{
        const tid = String(tag.id);
        const isAdmin = adminSet.has(tid);
        const s = stats[tid]||{distinctVoters:0,missedMatches:0,expired:false};
        const communityActive = s.distinctVoters >= 3 && !s.expired;
        if(!isAdmin && !communityActive) return;
        result.push({ id: tid, tag, adminSet: isAdmin, nearExpiry: !isAdmin && communityActive && s.missedMatches === 1, distinctVoters: s.distinctVoters, votes: s.votes||[] });
    });
    return result;
}

function getTagProfileStrength(tag){
    const p = tag.impact_profile || {};
    const sum = PROFILE_ATTRS.reduce((s,a)=>s+Math.abs(parseFloat(p[a])||0),0);
    return sum || 1.0;
}
function getTagProfileNet(tag){
    const p = tag.impact_profile || {};
    return PROFILE_ATTRS.reduce((s,a)=>s+(parseFloat(p[a])||0),0);
}

function computeTagBonus(activeTags){
    if(!activeTags.length) return {bonus:0, signals:[], buckets:{}};
    let totalBonus = 0;
    const signals = [];
    activeTags.forEach(obj=>{
        const tag = obj.tag;
        const tw = TW[String(obj.id)] || 0;
        const strength = getTagProfileStrength(tag);
        const scaledStrength = Math.min(strength / 9, 1.0);
        const dir = tag.type==='pos' ? 1 : tag.type==='neg' ? -1 : 0;
        if(dir === 0){
            const net = getTagProfileNet(tag);
            const contrib = (net / 27) * 0.2 + tw * 0.1;
            signals.push({id:obj.id, tag, raw:contrib, dir:0});
            totalBonus += contrib;
            return;
        }
        const base = dir * (0.25 + scaledStrength * 0.25);
        const twContrib = tw * 0.30;
        const contrib = base + twContrib;
        signals.push({id:obj.id, tag, raw:contrib, dir, strength, scaledStrength});
        totalBonus += contrib;
    });
    const bonus = TAG_BONUS_CAP <= 0 ? totalBonus : Math.max(-TAG_BONUS_CAP, Math.min(TAG_BONUS_CAP, totalBonus));
    return {bonus: parseFloat(bonus.toFixed(3)), signals, buckets:{}};
}

function getSynergyScore(pName, mateName) {
    let together = 0, wins = 0;
    db.history.forEach(h => {
        const inOrange = h.orangePlayers.includes(pName) && h.orangePlayers.includes(mateName);
        const inGreen  = h.greenPlayers.includes(pName)  && h.greenPlayers.includes(mateName);
        const inBlack  = (h.blackPlayers||[]).includes(pName) && (h.blackPlayers||[]).includes(mateName);
        if (!inOrange && !inGreen && !inBlack) return;
        together++;
        const won = playerWonMatch(h, pName);
        if (won === true) wins++;
    });
    if (together < 2) return 0.5;
    return wins / together;
}
function getTeamSynergyBonus(playerName, teammates) {
    if (!teammates.length) return 0;
    const scores = teammates.map(m => getSynergyScore(playerName, m.name));
    const avg = scores.reduce((s, v) => s + v, 0) / scores.length;
    return (avg - 0.5) * 1.0;
}
function getActivityMultiplier(p) {
    const recentMatches = db.history.slice(0, 8);
    if (recentMatches.length < 3) return 1.0;
    let absent = 0;
    recentMatches.forEach(h => {
        const played = h.orangePlayers.includes(p.name) || h.greenPlayers.includes(p.name) || (h.blackPlayers||[]).includes(p.name);
        if (!played) absent++;
    });
    return Math.max(0.80, 1.0 - absent * 0.06);
}

function getSmartRating(p, context = {}) {
    if (p.adminRating != null) return parseFloat(p.adminRating.toFixed(2));
    let base = 5.0;
    const wrRaw = p.games > 0 ? p.wins / p.games : 0.5;
    base += (wrRaw - 0.5) * 4 * W.winrate;
    if (wrRaw > 0.60 && p.games >= 3) base += 0.2;
    if ((p.totalGoals || 0) > 0 && p.games > 0) {
        const gpg = Math.min(p.totalGoals / p.games, 3);
        base += Math.min(gpg * 0.33, 1.0);
    }
    if ((p.bordaScore || 0) > 0 && W.borda > 0) {
        base += ((p.bordaScore - 5) / 5) * 4 * W.borda;
    }
    if (W.mvpWin > 0 || W.mvpLoss > 0) {
        const games = Math.max(p.games, 1);
        if ((p.mvpWinCount || 0) > 0)  base += Math.min(((p.mvpWinCount||0)/games)*10, 10) * W.mvpWin * 0.5;
        if ((p.mvpLossCount || 0) > 0) base += Math.min(((p.mvpLossCount||0)/games)*10, 10) * W.mvpLoss * 0.3;
    }
    base -= Math.min((p.lastImbalanceLoss || 0), 3) * 0.20;
    const activeTags = getPlayerActiveTagObjects(p);
    const { bonus: tagBonus } = computeTagBonus(activeTags);
    const actMult = getActivityMultiplier(p);
    base = base * actMult + 5.0 * (1 - actMult);
    let synergyBonus = 0;
    if (context.teammates && context.teammates.length) {
        synergyBonus = getTeamSynergyBonus(p.name, context.teammates) * 0.4;
    }
    const raw = base + tagBonus + synergyBonus;
    return parseFloat(Math.max(1, Math.min(10, raw)).toFixed(2));
}

function getCatAvg(p,cat){return p.ratings?.length?p.ratings.reduce((s,r)=>s+(r[cat]||5),0)/p.ratings.length:5;}
function getGeneralAvg(p){return getCatAvg(p,'general');}

function getStreak(p){
    if(!p.matchHistory?.length) return {count:0,type:null};
    const last=p.matchHistory[p.matchHistory.length-1]; let count=0;
    for(let i=p.matchHistory.length-1;i>=0;i--){ if(p.matchHistory[i]===last) count++; else break; }
    return {count,type:last};
}

function playerLastMatchDate(p){
    for(const h of db.history){
        if((h.orangePlayers||[]).includes(p.name) || (h.greenPlayers||[]).includes(p.name) || (h.blackPlayers||[]).includes(p.name)){
            return parseDateToObj(h.date);
        }
    }
    return null;
}
const STREAK_RECENCY_DAYS = 21;
function renderStreakBanner(){
    const el = document.getElementById('streakBanner');
    if(!el) return;
    const cutoff = new Date(Date.now() - STREAK_RECENCY_DAYS*24*60*60*1000);
    const withGames = db.players.filter(p=>{
        if(!p.games) return false;
        const lastDate = playerLastMatchDate(p);
        return lastDate && lastDate >= cutoff;
    });
    let hot=null, cold=null;
    withGames.forEach(p=>{
        const s = getStreak(p);
        if(!s.count || s.count<2) return;
        if(s.type==='W' && (!hot || s.count>hot.count)) hot = {p, count:s.count};
        if(s.type==='L' && (!cold || s.count>cold.count)) cold = {p, count:s.count};
    });
    if(!hot && !cold){ el.style.display='none'; el.innerHTML=''; return; }
    el.style.display='block';
    el.innerHTML = `<div class="streak-banner-grid">
        ${hot ? `<div class="streak-banner-card hot">
            <div class="streak-banner-icon">🔥</div>
            <div><div class="streak-banner-lbl">Pe val</div><div class="streak-banner-name">${hot.p.name}</div><div class="streak-banner-sub">${hot.count} victorii la rând</div></div>
        </div>` : ''}
        ${cold ? `<div class="streak-banner-card cold">
            <div class="streak-banner-icon">🥶</div>
            <div><div class="streak-banner-lbl">În cădere</div><div class="streak-banner-name">${cold.p.name}</div><div class="streak-banner-sub">${cold.count} înfrângeri la rând</div></div>
        </div>` : ''}
    </div>`;
}

function getLongestWinStreak(p){
    let longest=0, cur=0;
    (p.matchHistory||[]).forEach(r=>{ if(r==='W'){ cur++; longest=Math.max(longest,cur); } else cur=0; });
    return longest;
}
function getBestSingleMatchGoals(p){
    let max=0;
    db.history.forEach(h=>{ const g=(h.playerGoals&&h.playerGoals[p.name])||0; if(g>max) max=g; });
    return max;
}
const MILESTONE_TIERS = {
    goals:  [{n:10,emoji:'⚽',label:'10 Goluri'},{n:25,emoji:'🎯',label:'25 Goluri'},{n:50,emoji:'🔱',label:'50 Goluri'},{n:100,emoji:'💯',label:'100 Goluri'}],
    wins:   [{n:10,emoji:'🏆',label:'10 Victorii'},{n:25,emoji:'🥇',label:'25 Victorii'},{n:50,emoji:'👑',label:'50 Victorii'}],
    games:  [{n:25,emoji:'📅',label:'25 Meciuri'},{n:50,emoji:'🏟️',label:'50 Meciuri'},{n:100,emoji:'💼',label:'100 Meciuri'}],
    streak: [{n:5,emoji:'🔥',label:'5 Victorii la rând'},{n:10,emoji:'🚀',label:'10 Victorii la rând'}],
};
function _pickTier(arr,val){ let best=null; arr.forEach(t=>{ if(val>=t.n) best=t; }); return best; }
function getPlayerMilestones(p){
    const badges=[];
    let b;
    b=_pickTier(MILESTONE_TIERS.goals,(p.totalGoals||0));      if(b) badges.push(b);
    b=_pickTier(MILESTONE_TIERS.wins,(p.wins||0));              if(b) badges.push(b);
    b=_pickTier(MILESTONE_TIERS.games,(p.games||0));            if(b) badges.push(b);
    b=_pickTier(MILESTONE_TIERS.streak,getLongestWinStreak(p)); if(b) badges.push(b);
    const bestGoals = getBestSingleMatchGoals(p);
    if(bestGoals>=4) badges.push({emoji:'🎩🎩',label:'Poker de goluri'});
    else if(bestGoals>=3) badges.push({emoji:'🎩',label:'Hat-trick'});
    return badges;
}
function renderMilestoneBadges(p){
    const badges = getPlayerMilestones(p);
    if(!badges.length) return '';
    return `<div class="milestone-row">${badges.map(b=>`<span class="milestone-badge" title="${b.label}">${b.emoji} ${b.label}</span>`).join('')}</div>`;
}

const teamNames = { orange: 'Portocaliu', green: 'Verde', bench: 'Negru' };

function getRecentMatchesWindow(){
    if(!db.history.length) return [];
    const cutoff = new Date(Date.now()-7*24*60*60*1000);
    let recent = db.history.filter(h=>parseDateToObj(h.date)>=cutoff);
    if(!recent.length) recent = db.history.slice(0,5);
    return recent;
}
function computeWeekTeam(){
    const recent = getRecentMatchesWindow();
    if(!recent.length) return [];
    const stats={};
    const ensure=n=>stats[n]||(stats[n]={name:n,games:0,wins:0,goals:0});
    recent.forEach(h=>{
        const winO=h.winner==='Portocaliu', winG=h.winner==='Verde', winB=h.winner==='Negru';
        (h.orangePlayers||[]).forEach(n=>{const s=ensure(n);s.games++;if(winO)s.wins++;});
        (h.greenPlayers ||[]).forEach(n=>{const s=ensure(n);s.games++;if(winG)s.wins++;});
        (h.blackPlayers ||[]).forEach(n=>{const s=ensure(n);s.games++;if(winB)s.wins++;});
        if(h.playerGoals) Object.entries(h.playerGoals).forEach(([n,g])=>{ ensure(n).goals += (g||0); });
    });
    const arr = Object.values(stats).map(s=>{
        const p = db.players.find(x=>x.name===s.name);
        const wr = s.games>0 ? s.wins/s.games : 0;
        const smartBonus = p ? getSmartRating(p)/10 : 0;
        return { ...s, player:p, score: wr*3 + s.goals*0.6 + smartBonus };
    });
    arr.sort((a,b)=>b.score-a.score);
    return arr.slice(0,5);
}
function computeDerbyOfWeek(){
    const recent = getRecentMatchesWindow();
    if(!recent.length) return null;
    let best=null, bestDiff=Infinity, bestTotal=-1;
    recent.forEach(h=>{
        if(!h.score) return;
        const parts = h.score.split(':').map(s=>parseInt(s.trim(),10));
        if(parts.length<2 || isNaN(parts[0]) || isNaN(parts[1])) return;
        const diff = Math.abs(parts[0]-parts[1]);
        const total = parts[0]+parts[1];
        if(diff<bestDiff || (diff===bestDiff && total>bestTotal)){
            best={h,diff,total,a:parts[0],b:parts[1]};
            bestDiff=diff; bestTotal=total;
        }
    });
    return best;
}
function computeLastMatchTopScorer(){
    if(!db.history.length) return null;
    const h = db.history[0];
    if(!h.playerGoals || !Object.keys(h.playerGoals).length) return null;
    const entries = Object.entries(h.playerGoals).sort((a,b)=>b[1]-a[1]);
    const topGoals = entries[0][1];
    const topScorers = entries.filter(([,g])=>g===topGoals).map(([name])=>name);
    return { h, topScorers, goals: topGoals };
}
function renderWeeklyCards(){
    const wrap = document.getElementById('weeklyCards');
    if(!wrap) return;
    const weekTeam = computeWeekTeam();
    const derby = computeDerbyOfWeek();
    if(!weekTeam.length && !derby){ wrap.style.display='none'; wrap.innerHTML=''; return; }
    wrap.style.display='block';
    const teamHtml = weekTeam.length ? `<div class="week-card">
        <div class="week-card-title">📅 Echipa Săptămânii</div>
        ${weekTeam.map((s,i)=>`<div class="week-player-row">
            <span class="week-player-rank">${i+1}</span>
            <span class="week-player-name">${s.name}</span>
            <span class="week-player-sub">${s.wins}V/${s.games}M${s.goals?' · ⚽'+s.goals:''}</span>
        </div>`).join('')}
    </div>` : '';
    let derbyHtml = '';
    if(derby){
        const h=derby.h;
        let summary;
        if(derby.diff===0) summary = `⚡ Egalitate dramatică, ${derby.a}-${derby.b}!`;
        else if(derby.diff===1) summary = `🔥 Meci strâns, decis la un singur gol diferență!`;
        else summary = `🎬 Cel mai disputat meci recent.`;
        derbyHtml = `<div class="week-card">
            <div class="week-card-title">🎬 Derby-ul Săptămânii</div>
            <div class="derby-teams"><span>${teamNames.orange}</span><span>${teamNames.green}</span></div>
            <div class="derby-score">${derby.a} : ${derby.b}</div>
            <div class="derby-summary">${summary}</div>
            <div class="derby-date">${h.date||''}</div>
        </div>`;
    }

    let scorerHtml = '';
    const topScorer = computeLastMatchTopScorer();
    if(topScorer){
        const { h, topScorers, goals } = topScorer;
        const isTie = topScorers.length > 1;
        scorerHtml = `<div class="week-card">
            <div class="week-card-title">⚽ Marcatorul Ultimului Meci</div>
            ${topScorers.map(name=>`<div class="week-player-row">
                <span class="week-player-rank">${isTie?'🤝':'👑'}</span>
                <span class="week-player-name">${name}</span>
                <span class="week-player-sub">${goals} gol${goals!==1?'uri':''}</span>
            </div>`).join('')}
            <div class="derby-date">${h.date||''}</div>
        </div>`;
    }

    wrap.innerHTML = `<div class="week-cards-grid">${teamHtml}${derbyHtml}${scorerHtml}</div>`;
}

function getFormIndex(p){
    const history = p.matchHistory || [];
    const last5 = history.slice(-5);
    const wins  = last5.filter(r=>r==='W').length;
    const total = last5.length;
    let label='', color='#555';
    if(total < 2) { label='—'; color='#555'; }
    else if(wins >= 4)       { label='🔥 În formă'; color='#2e7d32'; }
    else if(wins === 3)      { label='📈 OK'; color='#8bc34a'; }
    else if(wins === 2)      { label='😐 Mediu'; color='#ffd600'; }
    else if(wins === 1)      { label='📉 Formă slabă'; color='#9c4f00'; }
    else                      { label='❄️ În cădere'; color='#a52020'; }
    return { last5, wins, total, label, color };
}

function computeLbPeriodStats(period){
    const cutoff = period==='month' ? new Date(Date.now()-30*86400000) : null;
    const stats = {};
    const ensure = n => stats[n] || (stats[n] = {name:n, games:0, wins:0, goals:0, penaltyWins:0});
    db.history.forEach(h=>{
        if (cutoff){ const d=parseDateToObj(h.date); if(!d || d<cutoff) return; }
        const winO = h.winner==='Portocaliu', winG = h.winner==='Verde', winB = h.winner==='Negru';
        (h.orangePlayers||[]).forEach(n=>{ const s=ensure(n); s.games++; if(winO) s.wins++; });
        (h.greenPlayers ||[]).forEach(n=>{ const s=ensure(n); s.games++; if(winG) s.wins++; });
        (h.blackPlayers ||[]).forEach(n=>{ const s=ensure(n); s.games++; if(winB) s.wins++; });
        if (h.playerGoals) Object.entries(h.playerGoals).forEach(([n,g])=>{ ensure(n).goals += (g||0); });
        if (Array.isArray(h.roundsDetail)) h.roundsDetail.forEach(r=>{
            if (r.penalty_winner_name) ensure(r.penalty_winner_name).penaltyWins++;
        });
    });
    return stats;
}

function toggleLbExpand(){ lbExpanded=!lbExpanded; renderLeaderboard(); }

    if(!p){ wrap.innerHTML=''; return; }

function renderLeaderboard(){
    const medals=['🥇','🥈','🥉'];
    const content=document.getElementById('lbContent');
    if(!content) return;

    const periodApplies = !LB_PERIODLESS_TABS.includes(currentLbTab);
    const usesPeriodStats = periodApplies && (currentLbPeriod==='month' || currentLbTab==='pen');
    const periodStats = usesPeriodStats ? computeLbPeriodStats(currentLbTab==='pen' ? currentLbPeriod : currentLbPeriod) : null;

    const gamesOf = p => usesPeriodStats ? (periodStats[p.name]?.games||0) : p.games;
    const winsOf  = p => usesPeriodStats ? (periodStats[p.name]?.wins ||0) : p.wins;
    const goalsOf = p => usesPeriodStats ? (periodStats[p.name]?.goals||0) : (p.totalGoals||0);

    const all = db.players;
    const withGames = usesPeriodStats
        ? db.players.filter(p=>(periodStats[p.name]?.games||0)>0)
        : db.players.filter(p=>p.games>0);

    let sorted=[], getValue, subLabel, bigColor='var(--star)';
    switch(currentLbTab){
        case 'smart':
            sorted=[...all].sort((a,b)=>getSmartRating(b)-getSmartRating(a));
            getValue=p=>getSmartRating(p).toFixed(1);
            subLabel=p=>{const wr=p.games>0?((p.wins/p.games)*100).toFixed(0)+'%':'—';return wr+' WR · '+p.games+'M';};
            bigColor='#6b46c1';
            break;
        case 'general':
            sorted=[...all].sort((a,b)=>getGeneralAvg(b)-getGeneralAvg(a));
            getValue=p=>getGeneralAvg(p).toFixed(1);
            subLabel=p=>{const wr=p.games>0?((p.wins/p.games)*100).toFixed(0)+'%':'—';return wr+' WR';};
            bigColor='var(--star)';
            break;
        case 'goals':
            sorted=[...withGames].filter(p=>goalsOf(p)>0).sort((a,b)=>goalsOf(b)-goalsOf(a));
            getValue=p=>'⚽'+goalsOf(p);
            subLabel=p=>{const g=gamesOf(p);const gpg=g>0?(goalsOf(p)/g).toFixed(1):'—';return gpg+'/meci';};
            bigColor='#1b7a43';
            break;
        case 'wins':
            sorted=[...withGames].sort((a,b)=>winsOf(b)-winsOf(a));
            getValue=p=>'🏆'+winsOf(p);
            subLabel=p=>{const g=gamesOf(p);const wr=g>0?((winsOf(p)/g)*100).toFixed(0)+'%':'—';return wr+' WR';};
            bigColor='#c9820a';
            break;
        case 'games':
            sorted=[...withGames].sort((a,b)=>gamesOf(b)-gamesOf(a));
            getValue=p=>'📅'+gamesOf(p);
            subLabel=p=>winsOf(p)+'V / '+(gamesOf(p)-winsOf(p))+'P';
            bigColor='#1554b3';
            break;
        case 'wr':
            sorted=[...withGames].filter(p=>gamesOf(p)>=LB_MIN_GAMES).sort((a,b)=>(winsOf(b)/gamesOf(b))-(winsOf(a)/gamesOf(a)));
            getValue=p=>((winsOf(p)/gamesOf(p))*100).toFixed(0)+'%';
            subLabel=p=>winsOf(p)+'V / '+gamesOf(p)+'M';
            bigColor='#2e7d32';
            break;
        case 'gpg':
            sorted=[...withGames].filter(p=>gamesOf(p)>=LB_MIN_GAMES && goalsOf(p)>0)
                .sort((a,b)=>(goalsOf(b)/gamesOf(b))-(goalsOf(a)/gamesOf(a)));
            getValue=p=>(goalsOf(p)/gamesOf(p)).toFixed(2);
            subLabel=p=>goalsOf(p)+' goluri'+(usesPeriodStats && currentLbPeriod==='month' ? ' (30 zile)' : ' total');
            bigColor='#8a6800';
            break;
        case 'pen':
            sorted=db.players.filter(p=>(periodStats[p.name]?.penaltyWins||0)>0)
                .sort((a,b)=>(periodStats[b.name]?.penaltyWins||0)-(periodStats[a.name]?.penaltyWins||0));
            getValue=p=>'🥅'+(periodStats[p.name]?.penaltyWins||0);
            subLabel=p=>(periodStats[p.name]?.penaltyWins||0)+' câștigate la penalty';
            bigColor='#b71c1c';
            break;
        default:
            sorted=[...all].sort((a,b)=>getSmartRating(b)-getSmartRating(a));
            getValue=p=>getSmartRating(p).toFixed(1); subLabel=p=>p.games+'M'; bigColor='#6b46c1';
    }
    if(!sorted.length){
        const emptyMsg = usesPeriodStats && currentLbPeriod==='month'
            ? 'Niciun meci în ultimele 30 de zile.'
            : (currentLbTab==='pen' ? 'Nicio tură decisă la penalty încă.' : 'Fără date disponibile.');
        content.innerHTML=`<p style="color:#6b5840;font-size:.85rem;text-align:center;padding:14px;">${emptyMsg}</p>`;
        return;
    }
    const maxVal=parseFloat(getValue(sorted[0]).replace(/[^0-9.]/g,''))||1;
    const visibleCount = lbExpanded ? sorted.length : Math.min(10, sorted.length);
    content.innerHTML='<div style="display:flex;flex-direction:column;gap:4px;">'+
        sorted.slice(0,visibleCount).map((p,i)=>{
            const val=getValue(p);
            const numVal=parseFloat(val.replace(/[^0-9.]/g,''))||0;
            const pct=Math.round((numVal/maxVal)*100);
            const medalColors=['#ffd700','#c0c0c0','#cd7f32'];
            const isMe = highlightPlayer && p.name===highlightPlayer;
            const bg=isMe?'rgba(61,90,254,.10)':i===0?`rgba(167,139,250,.06)`:i===1?`rgba(192,192,192,.03)`:i===2?`rgba(205,127,50,.03)`:'transparent';
            const nameColor=i<3?'#3a2f1f':'#7d6849';
            const form=getFormIndex(p);
            const dots=form.last5.slice(0,5).map(r=>`<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${r==='W'?'#4caf50':'#a52020'};"></span>`).join('');
            return `<div class="${isMe?'row-highlight':''}" style="display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;background:${bg};border-bottom:1px solid #e3d3ac;">
                <span style="font-family:'Bebas Neue',sans-serif;font-size:${i<3?'1rem':'.8rem'};min-width:24px;text-align:center;color:${medalColors[i]||'#7d6849'};">${medals[i]||(i+1)}</span>
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:700;font-size:${i===0?'.9rem':'.82rem'};color:${nameColor};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}${isMe?' 📍':''}</div>
                    ${renderMilestoneBadges(p)}
                    <div style="display:flex;align-items:center;gap:5px;margin-top:2px;">
                        <div style="flex:1;height:${i===0?'3px':'2px'};background:#e3d3ac;border-radius:1px;overflow:hidden;max-width:80px;"><div style="width:${pct}%;height:100%;background:${i===0?bigColor:'#d3bd8c'};border-radius:1px;"></div></div>
                        <span style="font-size:.58rem;color:#6b5840;">${subLabel(p)}</span>
                        <span style="font-size:.58rem;">${dots}</span>
                    </div>
                </div>
                <span style="font-family:'Bebas Neue',sans-serif;font-size:${i===0?'1.1rem':'.9rem'};color:${i===0?bigColor:i<3?'#7d6849':'#9a8663'};white-space:nowrap;">${val}</span>
            </div>`;
        }).join('')+
        (sorted.length>10 ? `<button class="lb-more-btn" onclick="toggleLbExpand()">${lbExpanded?'▲ Arată doar top 10':'▼ Vezi tot clasamentul ('+sorted.length+')'}</button>` : '')
        +'</div>';
}

function rowToPlayer(p) {
    return {
        id: p.id, name: p.name, status: p.status||'bench',
        wins: p.wins||0, games: p.games||0,
        matchHistory: p.match_history||[],
        adminTags: p.admin_tags ? p.admin_tags.split(',').filter(Boolean) : [],
        adminRating: p.admin_rating != null ? parseFloat(p.admin_rating) : null,
        totalGoals: p.total_goals||0,
        totalGoalsConceded: p.total_goals_conceded||0,
        lastImbalanceLoss: p.last_imbalance_loss||0,
        ratings: (p.ratings||[]).map(r=>({
            rater:r.rater, date:r.date, tags:r.tags||'',
            general:r.general||5, viteza:r.viteza||5, tehnica:r.tehnica||5,
            strategie:r.strategie||5, aparare:r.aparare||5
        }))
    };
}

async function loadAll(){
    try{
        // tags_config
        const { data: tagsData } = await sb.from('tags_config').select('*').order('sort_order');
        tagsConfig = tagsData || [];
        buildPTById(); buildTWFromConfig();

        // algo_settings
        const { data: algoData } = await sb.from('algo_settings').select('key,value');
        (algoData||[]).forEach(row=>{
            if(row.key==='weights') Object.assign(W, row.value);
            if(row.key==='tag_bonus_cap') TAG_BONUS_CAP = parseFloat(row.value)||10.0;
        });

        // players + ratings
        const { data: playersRaw } = await sb.from('players').select('*, ratings(*)').order('id');
        db.players = (playersRaw || []).map(rowToPlayer);

        // borda
        try{
            const {data:bordaData} = await sb.from('borda_votes').select('player_name, borda_pts');
            if(bordaData?.length){
                const bordaTotals={}, bordaCounts={};
                bordaData.forEach(row=>{
                    bordaTotals[row.player_name]=(bordaTotals[row.player_name]||0)+row.borda_pts;
                    bordaCounts[row.player_name]=(bordaCounts[row.player_name]||0)+1;
                });
                const maxPts=Math.max(...Object.values(bordaTotals),1);
                db.players.forEach(p=>{
                    if(bordaTotals[p.name]){
                        p.bordaScore = 1+(bordaTotals[p.name]/maxPts)*9;
                        p.bordaVotes = bordaCounts[p.name]||0;
                    } else { p.bordaScore=0; p.bordaVotes=0; }
                });
            }
        }catch(e){}

        // match history + goals
        const { data: histRaw } = await sb.from('match_history').select('*').order('created_at', { ascending:false });
        let goalsPerMatch = {};
        try{
            const { data: allGoals } = await sb.from('match_goals').select('match_id,player_name,team,goals');
            (allGoals||[]).forEach(g=>{
                if(!goalsPerMatch[g.match_id]) goalsPerMatch[g.match_id]=[];
                goalsPerMatch[g.match_id].push(g);
            });
        }catch(e){}
        db.history = (histRaw||[]).map(h=>{
            const goals = goalsPerMatch[h.id]||[];
            const playerGoals = {};
            goals.forEach(g=>{ playerGoals[g.player_name]=(playerGoals[g.player_name]||0)+(g.goals||1); });
            return {
                _dbId: h.id, date: h.date, winner: h.winner, score: h.score,
                orangePlayers: h.orange_players||[], greenPlayers: h.green_players||[], blackPlayers: h.black_players||[],
                roundsDetail: h.rounds_detail||null, playerGoals
            };
        }).sort((a,b)=>parseDateToObj(b.date)-parseDateToObj(a.date));

        // mvp votes
        db.players.forEach(p=>{ p.mvpWinCount=0; p.mvpLossCount=0; });
        try{
            const { data: mvpVotes } = await sb.from('mvp_votes').select('mvp_player_name, mvp_type, match_id');
            if(mvpVotes?.length){
                const matchWinners={};
                db.history.forEach(h=>{ if(h._dbId) matchWinners[h._dbId]=h.winner; });
                mvpVotes.forEach(v=>{
                    const player = db.players.find(p=>p.name===v.mvp_player_name);
                    if(!player) return;
                    const matchH = db.history.find(h=>h._dbId===v.match_id);
                    const matchWinner = matchWinners[v.match_id];
                    if(matchH && matchWinner){
                        const inOrange = matchH.orangePlayers.includes(v.mvp_player_name);
                        const playerWon = (inOrange && matchWinner==='Portocaliu') || (!inOrange && matchWinner==='Verde');
                        if(playerWon) player.mvpWinCount++; else player.mvpLossCount++;
                    }
                });
            }
        }catch(e){}

        renderMeCard();
        renderStreakBanner();
        renderWeeklyCards();
        renderLeaderboard();
    }catch(err){
        document.getElementById('lbContent').innerHTML = `<p style="color:#b71c1c;font-size:.85rem;text-align:center;padding:14px;">❌ Eroare la încărcarea clasamentului.</p>`;
    }finally{
        showLoading(false);
    }
}

// ── Live updates: reîncarcă la orice modificare relevantă ──
let reloadTimer=null;
function scheduleReload(){
    if(reloadTimer) clearTimeout(reloadTimer);
    reloadTimer = setTimeout(()=>loadAll(), 600);
}
sb.channel('clasament-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'players'}, scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'ratings'}, scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'match_history'}, scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'match_goals'}, scheduleReload)
    .subscribe();

// Fallback polling la fiecare 45s, pentru cazul în care realtime nu e activat pe proiect
setInterval(()=>loadAll(), 45000);

loadAll();
